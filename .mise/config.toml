[env]
_.file = ["{{config_root}}/.secrets.env"]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = '{{config_root}}/kubeconfig'
MINIJINJA_CONFIG_FILE = '{{config_root}}/.minijinja.toml'
TALOSCONFIG = '{{config_root}}/talosconfig'
JUST_UNSTABLE = "1"

[settings]
experimental = true

[tools]
# Runtimes
node = "26.13.1"
python = "3.15.2"
uv = "0.13.8"
go = "1.27.4"
gum = "2.0.2"

# Mise
"just" = "1.59.0"
"yq" = "4.54.3"
"jq" = "1.8.2"
"rg" = "15.2.0"
"gh" = "2.104.0"

# 1Password
"vals" = "0.51.1"
"op" = "2.41.1"

# Flux Stuff
"aqua:fluxcd/flux2" = "2.10.0"
"github:home-operations/flate" = "0.7.3"

# Kubectl + Plugins
"aqua:kubernetes/kubectl" = "1.37.1"
"aqua:yannh/kubeconform" = "0.8.0"

# Misc K8S Tools
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:helm/helm" = "4.3.2"
"aqua:helmfile/helmfile" = "1.8.4"
"aqua:mitsuhiko/minijinja" = "3.1.0" # minijinja-cli, used by `just template`

# Talos Stuff
"talosctl" = "1.14.6"
"aqua:budimanjojo/talhelper" = "3.1.17"

# Misc Tools
"aqua:cert-manager/cmctl" = "2.6.2"
"aqua:cloudflare/cloudflared" = "2026.11.0"
"asdf:carnei-ro/asdf-cilium-cli" = "0.18.2"
"aqua:cilium/hubble" = "1.20.4"

# Security
"aqua:kubescape/kubescape" = "4.0.21"

# Linters
"pipx:yamllint" = "1.38.0"
