[env]
_.file = ["{{config_root}}/.secrets.env"]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = '{{config_root}}/kubeconfig'
MINIJINJA_CONFIG_FILE = '{{config_root}}/.minijinja.toml'
TALOSCONFIG = '{{config_root}}/talosconfig'
JUST_UNSTABLE = "1"

[settings]
experimental = true

[tools]
# Runtimes
node = "24.20.0"
python = "3.14.7"
uv = "0.12.8"
go = "1.27.1"
gum = "2.0.0"

# Mise
"just" = "1.58.0"
"yq" = "4.53.6"
"jq" = "1.8.2"
"rg" = "15.2.0"
"gh" = "2.99.0"

# 1Password
"vals" = "0.46.0"

# Flux Stuff
"aqua:fluxcd/flux2" = "2.9.5"
"github:home-operations/flate" = "0.6.2"

# Kubectl + Plugins
"aqua:kubernetes/kubectl" = "1.32.3"
"aqua:yannh/kubeconform" = "0.8.0"

# Misc K8S Tools
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:helm/helm" = "4.2.4"
"aqua:helmfile/helmfile" = "1.7.4"

# Talos Stuff
"talosctl" = "1.13.9"
"aqua:budimanjojo/talhelper" = "3.1.17"

# Misc Tools
"aqua:cert-manager/cmctl" = "2.5.0"
"aqua:cloudflare/cloudflared" = "2026.8.3"
"asdf:carnei-ro/asdf-cilium-cli" = "0.18.2"
"aqua:cilium/hubble" = "1.19.4"

# Security
"aqua:kubescape/kubescape" = "4.0.12"

# Linters
"pipx:yamllint" = "1.38.0"
