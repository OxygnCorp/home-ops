---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Zizmor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # SARIF mode (the default) exits 0 even with findings, which would
          # make this job useless as a gate. Annotations mode posts findings
          # as PR annotations and fails the job, with no need for a
          # security-events: write permission.
          advanced-security: false
          annotations: true
