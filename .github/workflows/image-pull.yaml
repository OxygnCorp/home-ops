---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # talosctl is pinned to the cluster's Talos version. This annotation makes
  # the pin join the Renovate "talos" group (groups.json5) together with the
  # factory installer images (talos/main/cluster.yaml.j2 + nodes/workers/k8s-3.yaml.j2), so Renovate
  # bumps it in the same PR as a Talos upgrade.
  # IMPORTANT: keep the `TALOS_VERSION: v...` format — the annotated-deps
  # custom manager (.renovate/customManagers.json5) only captures a value
  # preceded by ": " or "=" on the line under the marker (the former inline
  # `tool_versions:` pin `talosctl 1.14.1` was never captured, hence the drift).
  # renovate: datasource=custom.talos-factory depName=siderolabs/talos
  TALOS_VERSION: v1.14.5

jobs:
  extract:
    name: Image Pull - Extract Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: v2026.11.3
          # Sole cache writer of this workflow (`pull` uses install: false
          # and never saves). The explicit shared cache_key lets `pull` and
          # this job restore the mise binary, its signed SHASUMS and the
          # pinned tools without touching github.com, whose anonymous
          # release downloads 504'd during the 2026-11-09 incident
          # ("Increased timeouts due to surge in anonymous users"). The
          # default key segments by ImageOS (ubuntu26 here vs ubuntu24 on
          # the ARC runner) which would make the cross-job hit impossible;
          # hardcoding the platform instead is safe: the mise release
          # binary only requires glibc >= 2.18. With `version` pinned there
          # is no CDN fallback, so cold runs remain exposed (the action
          # retries each download 5x).
          cache: true
          # Non-blocking: cache save failures (reservation conflicts between
          # concurrent PR runs, cache-service outage) must not fail this job.
          cache_save_post: true
          cache_save_retry_budget: 60s
          cache_key: mise-pull-linux-x64-{{version}}-p{{cache_period}}
          # Only install what this job needs (version pinned in .mise/config.toml).
          # A bare `mise install` would pull every tool in .mise/config.toml and
          # fail the job on any unrelated tool breaking upstream.
          install_args: github:home-operations/flate

      - name: Extract Images
        id: extract
        run: |
          echo 'images<<EOF' >> $GITHUB_OUTPUT
          flate diff images -p ./kubernetes/flux/cluster -o json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  pull:
    # Fork guard: only same-repo PRs may trigger pulls on the self-hosted
    # runner. `flate diff images` returns [] when nothing under kubernetes/
    # changed, which gates this job without a separate changed-files job.
    if: ${{ needs.extract.outputs.images != '[]' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: v2026.11.3
          # With `install: false` this job never saves the cache (mise-action
          # only saves when install runs), so it relies on the shared key
          # written by the `extract` job: a warm restore serves the mise
          # binary + signed SHASUMS straight from actions/cache instead of
          # the github.com release downloads, which 504'd for anonymous
          # traffic during the 2026-11-09 GitHub incident. Sharing a cache
          # across the runners (ImageOS ubuntu24 vs ubuntu26) is fine for
          # the mise release binary (glibc >= 2.18). Cold runs (cache period
          # rollover) are exposed — downloads are retried 5x. Note the
          # tradeoff: a hard restore failure (cache-service outage, beyond
          # the HTTP 429 retries) now fails this job where `cache: false`
          # previously did not.
          cache: true
          cache_restore_retry_budget: 60s
          cache_key: mise-pull-linux-x64-{{version}}-p{{cache_period}}
          # No checkout in this job: mise exec auto-installs the exact pinned
          # version from an empty directory (TALOS_VERSION env, above).
          install: false

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec "talosctl@${TALOS_VERSION}" -- talosctl --nodes "$NODE" image pull "$IMAGE"

  success:
    if: ${{ !cancelled() }}
    needs:
      - extract
      - pull
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed or cancelled?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
