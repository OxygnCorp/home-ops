---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches: ["main"]
    # Label events (`labeled`/`unlabeled`) are deliberately NOT triggers here:
    # Renovate fires a burst of `labeled` events seconds after opening a PR
    # (plus the labeler), and every one of them spawned a full review+gate run
    # — seven runs per Renovate PR, whose duplicate gate conclusions posted a
    # wall of `cancelled` check-runs on the head SHA. GitHub shows cancelled
    # runs as red "checks failed" although the PR is sound, and GitHub cannot
    # filter label events by label name at the trigger level. All label-driven
    # behavior (re-review via `ai-review`, the `hold` manual merge block) now
    # lives in ai-pr-review-labels.yaml; this workflow runs exactly once per
    # PR state change (open / rebase / ready) which is the only time a FULL
    # review is needed.
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true

concurrency:
  # One run per PR state change; cancel-in-progress so a `synchronize` during
  # a long review supersedes it (the new run redoes the full review+gate on
  # the new head SHA).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-pr:
    name: AI PR Review
    # ── Architecture ─────────────────────────────────────────────────────
    # Two jobs, one workflow. The `automerge-gate` job below is the job whose
    # check ("AI PR Review (automerge gate)") is required in `main` branch
    # protection; combining them is what blocks Renovate's automerge while
    # blocker findings stand on `renovate/am-*` branches (the Renovate
    # "trusted automerge" set, see .renovate/autoMerge.json5
    # additionalBranchPrefix).
    #
    # This job never produces the required-check conclusion, on purpose.
    # GitHub resolves required checks by check-run name with "latest
    # posted on the head SHA wins": a `skipped` job-level `if:` still emits
    # a check run of the same name, conclusion "skipped", which GitHub
    # treats as passing. Renovate labels Renovate PRs with a burst of
    # `labeled` events in the seconds after creation, so a single-job
    # design would have those instant skipped checks supersede a later
    # REQUEST_CHANGES gate and re-open the automerge (verified empirically:
    # PR #5378 head 68342c66 carries 4 "skipped" "AI PR Review" check runs
    # on a single SHA). Skipped conclusions are harmless here because the
    # required check has a distinct name owned exclusively by the gate job.
    #
    # This job keeps the cheap guard: full LLM reviews run for non-draft
    # PRs on the state-change events above; re-reviews are driven by
    # ai-pr-review-labels.yaml (the `ai-review` label or the workflow_
    # dispatch input here force one) and hold removal re-reviews there
    # too. On `renovate/am-*` branches the effective config is
    # gate-like (see publish-mode / fail-on-request-changes ternaries:
    # native REQUEST_CHANGES, never APPROVE, step fails on a `request_changes`
    # verdict so the gate job sees a meaningful failure).
    #
    # The ternaries must use `github.head_ref` (the documented source-branch
    # property) or the prctx-resolved branch for workflow_dispatch runs.
    # `github.event.pull_request.head_ref` does NOT exist (the webhook
    # payload path is `head.ref`) and dereferencing a nonexistent property
    # evaluates to '' — so startsWith() would always be false and the gate
    # config would never fire.
    # The `hold` clauses are the manual holding pattern: while a PR is held,
    # the full LLM review is skipped (cost saver) — the `hold` gate check
    # carries the blocking semantics (see `hold` in the automerge-gate job).
    # workflow_dispatch overrides `hold` (manual force-review is deliberate).
    #
    # Digest bumps: PRs on `renovate/am-*` branches that carry the `type/
    # digest` label (Renovate applies it, see .renovate/labels.json5) skip
    # the full LLM review entirely — deliberate policy: digest automerges
    # are enforced by the trusted set in .renovate/autoMerge.json5 and carry
    # no meaningful reviewable content. (Historically a `labeled`-event tail
    # existed here to keep an `ai-review` re-review possible for those PRs;
    # label events no longer reach this workflow — re-review lives in
    # ai-pr-review-labels.yaml.) If Renovate's labels lag the `opened`
    # payload, the one-time full review still runs (fail-safe on the trust
    # anchor). Once `type/digest` has landed, later events skip the
    # review and the gate greens on authorship + label per the accepted
    # edge documented at the gate site.
    #
    # The digest exemption (this `if:` and the gate script) require the PR
    # author to be Renovate itself (`mushu-bot[bot]`, Bot type): label +
    # branch prefix alone would let any collaborator green-pass real code
    # with a hand-decorated PR. Authorship + trusted-prefix together are
    # the exemption's trust anchor. Stale-verdict edge is accepted and
    # documented at the gate site.
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'hold') && !(startsWith(github.head_ref, 'renovate/am-') && github.event.pull_request.user.login == 'mushu-bot[bot]' && github.event.pull_request.user.type == 'Bot' && contains(github.event.pull_request.labels.*.name, 'type/digest'))) || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      # prctx `gh api` reads PR metadata; all writes (comments, reviews) are
      # performed with the scoped app token created inside the job.
      pull-requests: read
    runs-on: home-ops-runner
    # 45 min: ci-status-check waits up to 1200s + tool loop 600s + review
    # rounds must never exhaust the budget on slow multi-chart CI — a job
    # timeout would read as `failure` and red the gate (fail-closed on mere
    # slowness).
    timeout-minutes: 45

    steps:
      - name: Resolve PR head for re-review
        id: prctx
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          echo "head_sha=$(echo "$pr" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
          # resolve the source branch for the gate config ternaries:
          # `github.head_ref` is empty on workflow_dispatch payloads
          echo "head_ref=$(echo "$pr" | jq -r .head.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || steps.prctx.outputs.head_sha }}

      - name: Setup review tooling
        # ARC runners lack helm/PyYAML (preinstalled on ubuntu-latest); the
        # upgrade-impact evidence provider needs them for chart-values drift.
        # Best-effort: the provider degrades gracefully when they are absent,
        # so this step must never fail the job — only warn.
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash \
              || echo "::warning::helm install failed — chart-values drift will be skipped"
          fi
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages pyyaml >/dev/null 2>&1 \
              || python3 -m pip install --user pyyaml >/dev/null 2>&1 \
              || { python3 -m ensurepip --user >/dev/null 2>&1 \
                   && python3 -m pip install --user pyyaml >/dev/null 2>&1; } \
              || { sudo apt-get update -qq >/dev/null 2>&1 \
                   && sudo apt-get install -y -qq python3-yaml >/dev/null 2>&1; } \
              || true
          fi
          python3 -c 'import yaml' >/dev/null 2>&1 \
            && echo "PyYAML OK" \
            || echo "::warning::PyYAML unavailable — chart-values drift will be skipped (advisory-only)"
          command -v helm >/dev/null 2>&1 \
            && echo "helm OK" \
            || echo "::warning::helm unavailable — chart-values drift will be skipped (advisory-only)"

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: read
          permission-pull-requests: write
          # ci-status-check: "true" below reads check runs for CI evidence
          permission-checks: read

      - name: Analyze PR with reusable AI reviewer
        id: analyze
        uses: misospace/pr-reviewer-action@0a2d2732f7358e509e6a85e11160eb25cc5b1b80 # v3.8.0
        env:
          # konflate's read-only MCP endpoint — the konflate evidence provider
          # fetches the rendered (post-kustomize/Helm) Flux diff for this PR.
          KONFLATE_MCP_URL: https://konflate.oxygn.dev/mcp
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          force-review: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          ai-primary-retries: "3"
          ai-primary-retry-delay-sec: "15"
          ai-base-url: ${{ vars.LITELLM_URL }}
          ai-api-format: openai
          ai-model: ${{ vars.PRIMARY_MODEL }}
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-response-format: json_object
          ai-max-tokens: "16000"
          ai-fallback-base-url: ${{ vars.LITELLM_URL }}
          ai-fallback-api-format: openai
          ai-fallback-model: ${{ vars.FALLBACK_MODEL }}
          ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          review-routing-mode: auto
          ai-smart-base-url: ${{ vars.LITELLM_URL }}
          ai-smart-api-format: openai
          ai-smart-model: ${{ vars.SMART_MODEL }}
          ai-smart-api-key: ${{ secrets.LITELLM_API_KEY }}
          allowed-source-hosts: "github.com,api.github.com,gitlab.com,registry.terraform.io,artifacthub.io,talos.dev,www.talos.dev,docs.siderolabs.com"
          context-limit-mode: normal
          ci-status-check: "true"
          # 10 min: multi-chart PRs routinely exceed 600s of CI. Beyond the
          # timeout the review proceeds WITHOUT CI evidence (the action's
          # ci-skip-on-timeout defaults to true) — fail-open by design; the
          # gate derives its decision from the review verdict, and sibling
          # CI checks remain required-check-agnostic.
          ci-timeout-sec: "1200"
          search-url: "https://search.oxygn.dev/search"
          tool-mode: native_loop
          tool-max-rounds: "2"
          tool-max-requests: "4"
          tool-loop-wall-clock-sec: "600"
          tool-max-response-bytes: "12000"
          tool-allowed-gh-api-repos: "OxygnCorp/home-ops"
          tool-request-timeout-sec: "15"
          tool-enable-for-forks: "false"
          # Read-only konflate MCP tools for the native loop (advertised as
          # mcp__konflate__get_pr_summary / get_pr_diff / list_pull_requests).
          # Complements the evidence provider below: the provider injects the
          # rendered-diff summary deterministically; MCP lets the model do
          # follow-up digging (e.g. pull the full rendered diff on demand).
          tool-mcp-servers: "konflate=https://konflate.oxygn.dev/mcp"
          system-prompt-file: .agents/instructions/pr-review.instructions.md
          system-prompt-mode: append
          standards-file-candidates: "AGENTS.md"
          # Read-only konflate MCP: injects the rendered Flux YAML diff (the
          # resources Flux will actually apply) as advisory evidence. Never
          # gates — the provider exits clean with no findings on any failure
          # or for PRs konflate isn't tracking.
          evidence-providers-file: .github/konflate-evidence-providers.json
          on-model-failure: notice
          inline-findings: "true"
          # `renovate/am-*` PRs are the automerge gate candidates: native
          # REQUEST_CHANGES review (never APPROVE) and — through
          # fail-on-request-changes — a job failure on a `request_changes`
          # verdict, which the `automerge-gate` job below turns into a red
          # required check. Everything else keeps the advisory comment
          # behavior (never gates human merges).
          #
          # Fail boundaries (verified against the action contract):
          # - fail-open: `on-model-failure: notice` produces a degraded
          #   "notice" verdict which `fail-on-request-changes` warns and
          #   passes — a pure LLM outage never wedges the automerge queue.
          #   `fail-on-degraded-review` is deliberately left unset (false).
          # - fail-closed: a review that gathered no evidence on the primary
          #   model, or a deterministic fail-closed enforcement (evidence
          #   blocker, tool-harness failure, unmet required check) forces
          #   `request_changes` and fails the gate regardless of degraded
          #   review handling. Re-arm such a run via the `ai-review` label
          #   (allowed on am- branches) or a rebase — the gate re-opens when
          #   the review verdict is clean.
          # On workflow_dispatch, `github.head_ref` is empty: the ternaries
          # fall back to the branch resolved by the prctx step, so a manual
          # force-review of a Renovate PR publishes a real gate verdict to the
          # PR (native REQUEST_CHANGES on blockers). Its check runs attach to
          # the dispatched ref's SHA, not the PR head SHA, so they can never
          # supersede — or fake — the PR's required check; on the PR itself
          # the concluding check always comes from the pull-request runs.
          publish-mode: ${{ startsWith(steps.prctx.outputs.head_ref || github.head_ref, 'renovate/am-') && 'review_blockers' || 'review_comment' }}
          fail-on-request-changes: ${{ startsWith(steps.prctx.outputs.head_ref || github.head_ref, 'renovate/am-') && 'true' || 'false' }}

  # ── Automerge gate (this job's check is REQUIRED in main branch protection)
  # -----------------------------------------------------------------------
  # Decision table, for every event, exactly one conclusion per head SHA,
  # with no "skipped" conclusions allowed (a skipped conclusion would be
  # interpreted by GitHub's branch protection as a pass and is never
  # authoritative for a merge gate):
  #
  #   non-`renovate/am-*` PR              → pass (free; humans are not gated)
  #   review job failure / cancelled      → BLOCKED (fail-closed: real gate
  #                                        verdict request_changes, or
  #                                        review infra failure)
  #   review job success                  → pass (a `request_changes` verdict
  #                                        always fails the review job via
  #                                        fail-on-request-changes; a success
  #                                        means the verdict was clean — or
  #                                        fail-open degraded "notice")
  #   review job skipped (draft, or a     → BLOCKED if a managed
  #   digest skip)                         REQUEST_CHANGES review exists at the
  #                                       current head SHA (Bot-authored), if
  #                                       no managed review exists at that
  #                                       SHA and no review run is in flight
  #                                       there, or if the wait for the first
  #                                       verdict exhausts the poll budget.
  #                                       PASS only once a managed review at
  #                                       that SHA has landed and is clean —
  #                                       a pre-verdict event WAITS for the
  #                                       verdict being produced before it
  #                                       can turn green.
  #   label `hold` present (any PR)       → BLOCKED (manual holding pattern,
  #                                        first in the script — evaluated
  #                                        before every other branch)
  #
  # The skipped line is load-bearing: it is the only phase that can wait for
  # a verdict mid-flight (the pull-requests API is the verdict's source of
  # truth, not this job's `needs`), and it reproduces the verdict state of
  # the head SHA on every event. The check name belongs to this job alone
  # (the labels workflow reproduces it via the checks API, see
  # ai-pr-review-labels.yaml), so no skip conclusion of another job can ever
  # supersede it.
  #
  # Unstick path for a falsely (or stale) blocked PR: label `ai-review` or
  # rebase the branch → fresh full gate review publishes a clean verdict,
  # the review cleanup dismisses the stale REQUEST_CHANGES, and the next
  # gate run (same SHA query path) passes.
  automerge-gate:
    name: AI PR Review (automerge gate)
    needs: review-pr
    if: ${{ always() }}
    permissions:
      contents: read
      # Read-only: the gate only queries PR metadata and reviews.
      pull-requests: read
    runs-on: home-ops-runner
    # Serialize same-PR conclusions: parallel gates on one SHA complete in
    # arbitrary order, and "last completed wins" would be unspecified.
    # cancel-in-progress makes the newest event's gate authoritative; any
    # transient cancelled conclusion is superseded by the surviving run.
    concurrency:
      group: ai-review-gate-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
      cancel-in-progress: true
    # Must cover the poll budget below (pre-verdict bounded wait), which in
    # turn covers a full-length review job (45 min timeout above) — otherwise
    # multi-chart reviews that run long would wedge the gate red again.
    # cancel-in-progress keeps only the newest gate, so the wait cannot pile
    # up behind later gates.
    timeout-minutes: 55
    steps:
      - name: Checkout gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The shared driver is taken from the REPO's latest main version,
          # NOT the PR's: a PR could otherwise modify `.github/scripts/` to
          # gate itself green. This also means a PR whose whole purpose is a
          # gate-script change is judged by the pre-change logic until it
          # merges — conservative and acceptable for a fail-closed gate.
          ref: main

      - name: Evaluate gate decision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          REVIEW_RESULT: ${{ needs.review-pr.result }}
          # How long the gate may wait for a verdict that is already being
          # produced (see the pre-verdict branch below), the poll cadence,
          # and how many consecutive API errors a polling gate may tolerate
          # before failing closed. 2700 s = a full-length 45-min review job.
          GATE_POLL_BUDGET_SEC: "2700"
          GATE_POLL_INTERVAL_SEC: "15"
          GATE_POLL_MAX_CONSEC_ERRORS: "4"
        # The decision logic lives in .github/scripts/ai-review-gate.sh —
        # SHARED with ai-pr-review-labels.yaml (which POSTS the same
        # conclusions as the required check-run for label-driven events).
        # Edit both entry points together; the script is the single source
        # of truth for the decision table above.
        run: bash .github/scripts/ai-review-gate.sh
