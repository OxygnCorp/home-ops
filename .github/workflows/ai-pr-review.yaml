---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches: ["main"]
    # `labeled` enables the one-click re-review: add the `ai-review` label to
    # force a fresh review (only write/triage can label — self-authorizing).
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true

concurrency:
  # `labeled` events each get their own group: net-new PRs are auto-labeled
  # (Renovate adds several at creation), and with a shared group +
  # cancel-in-progress those label runs would cancel the real opened review.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review-pr:
    name: AI PR Review
    outputs:
      verdict: ${{ steps.analyze.outputs.verdict }}
      review-result: ${{ steps.analyze.outputs.review-result }}
      verdict-source: ${{ steps.analyze.outputs.verdict-source }}
    # pull_request is the normal path; PRs on `renovate/am-*` branches are the
    # Renovate "trusted automerge" set (minor/patch/digest non-core, see
    # .renovate/autoMerge.json5 additionalBranchPrefix) and are skipped. The
    # `ai-review` label re-review is NOT available for those; workflow_dispatch
    # remains the manual force-review path for everyone.
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft && !startsWith(github.event.pull_request.head_ref, 'renovate/am-')) || github.event_name == 'workflow_dispatch' }}
    runs-on: home-ops-runner
    timeout-minutes: 35

    steps:
      - name: Resolve PR head for re-review
        id: prctx
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || steps.prctx.outputs.head_sha }}

      - name: Setup review tooling
        # ARC runners lack helm/PyYAML (preinstalled on ubuntu-latest); the
        # upgrade-impact evidence provider needs them for chart-values drift.
        # Best-effort: the provider degrades gracefully when they are absent,
        # so this step must never fail the job — only warn.
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash \
              || echo "::warning::helm install failed — chart-values drift will be skipped"
          fi
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages pyyaml >/dev/null 2>&1 \
              || python3 -m pip install --user pyyaml >/dev/null 2>&1 \
              || { python3 -m ensurepip --user >/dev/null 2>&1 \
                   && python3 -m pip install --user pyyaml >/dev/null 2>&1; } \
              || { sudo apt-get update -qq >/dev/null 2>&1 \
                   && sudo apt-get install -y -qq python3-yaml >/dev/null 2>&1; } \
              || true
          fi
          python3 -c 'import yaml' >/dev/null 2>&1 \
            && echo "PyYAML OK" \
            || echo "::warning::PyYAML unavailable — chart-values drift will be skipped (advisory-only)"
          command -v helm >/dev/null 2>&1 \
            && echo "helm OK" \
            || echo "::warning::helm unavailable — chart-values drift will be skipped (advisory-only)"

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          # contents: write — the auto-merge job uses this token to merge
          # approved minor/patch bumps (gh pr merge --squash). Read-elsewhere.
          permission-contents: write
          permission-pull-requests: write
          # ci-status-check: "true" below reads check runs for CI evidence
          permission-checks: read

      - name: Analyze PR with reusable AI reviewer
        id: analyze
        uses: misospace/pr-reviewer-action@5b1839535748f3afd1bd3ef04e8009302cba9aa6 # v3.7.0
        env:
          # konflate's read-only MCP endpoint — the konflate evidence provider
          # fetches the rendered (post-kustomize/Helm) Flux diff for this PR.
          KONFLATE_MCP_URL: https://konflate.oxygn.dev/mcp
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          force-review: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          ai-primary-retries: "3"
          ai-primary-retry-delay-sec: "15"
          ai-base-url: ${{ vars.LITELLM_URL }}
          ai-api-format: openai
          ai-model: ${{ vars.PRIMARY_MODEL }}
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-response-format: json_object
          ai-max-tokens: "16000"
          ai-fallback-base-url: ${{ vars.LITELLM_URL }}
          ai-fallback-api-format: openai
          ai-fallback-model: ${{ vars.FALLBACK_MODEL }}
          ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          review-routing-mode: auto
          ai-smart-base-url: ${{ vars.LITELLM_URL }}
          ai-smart-api-format: openai
          ai-smart-model: ${{ vars.SMART_MODEL }}
          ai-smart-api-key: ${{ secrets.LITELLM_API_KEY }}
          allowed-source-hosts: "github.com,api.github.com,gitlab.com,registry.terraform.io,artifacthub.io,talos.dev,www.talos.dev,docs.siderolabs.com"
          context-limit-mode: normal
          ci-status-check: "true"
          ci-timeout-sec: "600"
          search-url: "https://search.oxygn.dev/search"
          tool-mode: native_loop
          tool-max-rounds: "2"
          tool-max-requests: "4"
          tool-loop-wall-clock-sec: "600"
          tool-max-response-bytes: "12000"
          tool-allowed-gh-api-repos: "OxygnCorp/home-ops"
          tool-request-timeout-sec: "15"
          tool-enable-for-forks: "false"
          # Read-only konflate MCP tools for the native loop (advertised as
          # mcp__konflate__get_pr_summary / get_pr_diff / list_pull_requests).
          # Complements the evidence provider below: the provider injects the
          # rendered-diff summary deterministically; MCP lets the model do
          # follow-up digging (e.g. pull the full rendered diff on demand).
          tool-mcp-servers: "konflate=https://konflate.oxygn.dev/mcp"
          system-prompt-file: .agents/instructions/pr-review.instructions.md
          system-prompt-mode: append
          standards-file-candidates: "AGENTS.md"
          # Read-only konflate MCP: injects the rendered Flux YAML diff (the
          # resources Flux will actually apply) as advisory evidence. Never
          # gates — the provider exits clean with no findings on any failure
          # or for PRs konflate isn't tracking.
          evidence-providers-file: .github/konflate-evidence-providers.json
          on-model-failure: notice
          inline-findings: "true"
          # Native APPROVE/REQUEST_CHANGES reviews: the verdict becomes a real
          # review that audit trails can query, and the auto-merge job gates on
          # the `verdict` + `review-result` step outputs.
          publish-mode: review_verdict

  auto-merge:
    name: AI Auto-Merge
    needs: [review-pr]
    # Merge minor/patch bump PRs authored by the Renovate bot when the AI review
    # fully approves them. Guards (fail-closed on every line):
    # - verdict approve AND review-result clean|findings (vendor rule: never
    #   gate on verdict alone — `partial` is an unfinished investigation).
    # - renovate/ branch but NOT renovate/am- (those are already Renovate-
    #   automerged; their workflow runs are skipped entirely).
    # - bot author, no type/major label, no `!:` in title.
    # - Files touching talos/ or kubernetes/apps/system-upgrade/ (talos + kubernetes
    #   upgrade chains) abort the merge.
    if: ${{ always() && (github.event_name == 'pull_request'
      && needs.review-pr.result == 'success'
      && needs.review-pr.outputs.verdict == 'approve'
      && (needs.review-pr.outputs.review-result == 'clean' || needs.review-pr.outputs.review-result == 'findings')
      && github.event.pull_request.user.login == 'mushu-bot[bot]'
      && startsWith(github.event.pull_request.head_ref, 'renovate/')
      && !startsWith(github.event.pull_request.head_ref, 'renovate/am-')
      && !contains(github.event.pull_request.labels.*.name, 'type/major')
      && !contains(github.event.pull_request.title, '!')) }}
    runs-on: home-ops-runner
    timeout-minutes: 10
    steps:
      - name: Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read

      - name: Guard forbidden paths (talos / kubernetes upgrades)
        id: guard
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr.number, per_page: 100,
            });
            const forbidden = files.filter(f =>
              f.filename.startsWith('talos/') ||
              f.filename.startsWith('kubernetes/apps/system-upgrade/'));
            core.setOutput('blocked', forbidden.length > 0 ? 'true' : 'false');
            console.log('files:', files.map(f => f.filename).join(','));
            if (forbidden.length > 0) console.log('BLOCKED by:', forbidden.map(f => f.filename).join(','));

      - name: Wait for remaining checks (max ~25 min)
        if: steps.guard.outputs.blocked != 'true'
        run: |
          for i in $(seq 1 25); do
            pending="$(gh pr view ${{ github.event.pull_request.number }} --json statusCheckRollup --jq '[.statusCheckRollup[] | select(.status != "COMPLETED")] | length')"
            skipped="$(gh pr view ${{ github.event.pull_request.number }} --json statusCheckRollup --jq '[.statusCheckRollup[] | select(.conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL") | select(.status == "COMPLETED")] | length')"
            echo "pending=$pending failed=$skipped"
            [ "$skipped" -gt 0 ] && { echo "::error::A check failed — no auto-merge."; exit 1; }
            [ "$pending" -eq 0 ] && break
            sleep 60
          done
          [ "$pending" -ne 0 ] && { echo "::error::Checks still pending after 25 min — no auto-merge."; exit 1; }
          exit 0

      - name: Merge (squash)
        if: steps.guard.outputs.blocked != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash \
            --delete-branch=false \
            --subject "$PR_TITLE"
