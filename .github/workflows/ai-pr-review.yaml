---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches: ["main"]
    # `labeled` enables the one-click re-review: add the `ai-review` label to
    # force a fresh review (only write/triage can label — self-authorizing).
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true

concurrency:
  # `labeled` events each get their own group: net-new PRs are auto-labeled
  # (Renovate adds several at creation), and with a shared group +
  # cancel-in-progress those label runs would cancel the real opened review.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review-pr:
    name: AI PR Review
    # pull_request is the normal path for every non-draft PR. On `renovate/am-*`
    # branches (the Renovate "trusted automerge" set, see
    # .renovate/autoMerge.json5 additionalBranchPrefix) the run doubles as the
    # automerge gate: `publish-mode: review_blockers` + `fail-on-request-changes: true`
    # below make the job fail when the final verdict is `request_changes`, and the
    # "AI PR Review" check is required in `main` branch protection — so Renovate's
    # automerge stays blocked until open blocker findings are resolved. On every
    # other PR the review remains advisory (`review_comment`), and the job still
    # runs so the required check exists and passes. A job-level `if:` skip still
    # produces a check run with "skipped" conclusion, which satisfies the branch
    # protection requirement — draft PRs therefore never wedge merges.
    #
    # workflow_dispatch runs (manual force-review) are advisory even on Renovate
    # branches: `github.head_ref` is empty in that payload, so the ternaries below
    # evaluate false and no gate is authored from a manual run. A blocked am- PR
    # re-opens via the next `synchronize` re-review after the fix lands.
    #
    # The gate conditionals must use `github.head_ref` (the documented source-branch
    # property). `github.event.pull_request.head_ref` does NOT exist (the
    # webhook payload path is `head.ref`) and dereferencing a nonexistent
    # property evaluates to '' — so startsWith() would always be false and the
    # gate would never fire. The `labeled` guard restricts re-reviews
    # to the `ai-review` label: Renovate/labeler add several labels at PR
    # creation, and each `labeled` event would otherwise launch yet another
    # full review run.
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'ai-review')) || github.event_name == 'workflow_dispatch' }}
    runs-on: home-ops-runner
    timeout-minutes: 35

    steps:
      - name: Resolve PR head for re-review
        id: prctx
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || steps.prctx.outputs.head_sha }}

      - name: Setup review tooling
        # ARC runners lack helm/PyYAML (preinstalled on ubuntu-latest); the
        # upgrade-impact evidence provider needs them for chart-values drift.
        # Best-effort: the provider degrades gracefully when they are absent,
        # so this step must never fail the job — only warn.
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash \
              || echo "::warning::helm install failed — chart-values drift will be skipped"
          fi
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages pyyaml >/dev/null 2>&1 \
              || python3 -m pip install --user pyyaml >/dev/null 2>&1 \
              || { python3 -m ensurepip --user >/dev/null 2>&1 \
                   && python3 -m pip install --user pyyaml >/dev/null 2>&1; } \
              || { sudo apt-get update -qq >/dev/null 2>&1 \
                   && sudo apt-get install -y -qq python3-yaml >/dev/null 2>&1; } \
              || true
          fi
          python3 -c 'import yaml' >/dev/null 2>&1 \
            && echo "PyYAML OK" \
            || echo "::warning::PyYAML unavailable — chart-values drift will be skipped (advisory-only)"
          command -v helm >/dev/null 2>&1 \
            && echo "helm OK" \
            || echo "::warning::helm unavailable — chart-values drift will be skipped (advisory-only)"

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: read
          permission-pull-requests: write
          # ci-status-check: "true" below reads check runs for CI evidence
          permission-checks: read

      - name: Analyze PR with reusable AI reviewer
        id: analyze
        uses: misospace/pr-reviewer-action@0a2d2732f7358e509e6a85e11160eb25cc5b1b80 # v3.8.0
        env:
          # konflate's read-only MCP endpoint — the konflate evidence provider
          # fetches the rendered (post-kustomize/Helm) Flux diff for this PR.
          KONFLATE_MCP_URL: https://konflate.oxygn.dev/mcp
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          force-review: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          ai-primary-retries: "3"
          ai-primary-retry-delay-sec: "15"
          ai-base-url: ${{ vars.LITELLM_URL }}
          ai-api-format: openai
          ai-model: ${{ vars.PRIMARY_MODEL }}
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-response-format: json_object
          ai-max-tokens: "16000"
          ai-fallback-base-url: ${{ vars.LITELLM_URL }}
          ai-fallback-api-format: openai
          ai-fallback-model: ${{ vars.FALLBACK_MODEL }}
          ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          review-routing-mode: auto
          ai-smart-base-url: ${{ vars.LITELLM_URL }}
          ai-smart-api-format: openai
          ai-smart-model: ${{ vars.SMART_MODEL }}
          ai-smart-api-key: ${{ secrets.LITELLM_API_KEY }}
          allowed-source-hosts: "github.com,api.github.com,gitlab.com,registry.terraform.io,artifacthub.io,talos.dev,www.talos.dev,docs.siderolabs.com"
          context-limit-mode: normal
          ci-status-check: "true"
          ci-timeout-sec: "600"
          search-url: "https://search.oxygn.dev/search"
          tool-mode: native_loop
          tool-max-rounds: "2"
          tool-max-requests: "4"
          tool-loop-wall-clock-sec: "600"
          tool-max-response-bytes: "12000"
          tool-allowed-gh-api-repos: "OxygnCorp/home-ops"
          tool-request-timeout-sec: "15"
          tool-enable-for-forks: "false"
          # Read-only konflate MCP tools for the native loop (advertised as
          # mcp__konflate__get_pr_summary / get_pr_diff / list_pull_requests).
          # Complements the evidence provider below: the provider injects the
          # rendered-diff summary deterministically; MCP lets the model do
          # follow-up digging (e.g. pull the full rendered diff on demand).
          tool-mcp-servers: "konflate=https://konflate.oxygn.dev/mcp"
          system-prompt-file: .agents/instructions/pr-review.instructions.md
          system-prompt-mode: append
          standards-file-candidates: "AGENTS.md"
          # Read-only konflate MCP: injects the rendered Flux YAML diff (the
          # resources Flux will actually apply) as advisory evidence. Never
          # gates — the provider exits clean with no findings on any failure
          # or for PRs konflate isn't tracking.
          evidence-providers-file: .github/konflate-evidence-providers.json
          on-model-failure: notice
          inline-findings: "true"
          # `renovate/am-*` PRs are the automerge gate: native REQUEST_CHANGES review
          # (never APPROVE) and the step — therefore the job and the required
          # "AI PR Review" check — fail on a `request_changes` verdict, so Renovate's
          # automerge stays blocked while blockers exist. Everything else keeps the
          # advisory comment behavior (never gates human merges).
          # `on-model-failure: notice` above means a model outage produces a degraded
          # "notice" verdict which counts as a degraded review: `fail-on-request-changes`
          # warns and passes it (fail-open — an LLM outage never wedges the automerge
          # queue). `publish-mode: review_blockers` still publishes REQUEST_CHANGES and
          # never APPROVE, so humans keep merge authority.
          publish-mode: ${{ startsWith(github.head_ref, 'renovate/am-') && 'review_blockers' || 'review_comment' }}
          fail-on-request-changes: ${{ startsWith(github.head_ref, 'renovate/am-') && 'true' || 'false' }}
