---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: radarr
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc-kanidm/in-app
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/download/radarr/app
  postBuild:
    substitute:
      APP: radarr
      APP_NAMESPACE: download
      DOMAIN: oxygn.dev
      KOPIUR_CAPACITY: 5Gi
      OIDC_CALLBACK: /signin-oidc
      OIDC_DISPLAY_NAME: Radarr
      SUBDOMAIN: radarr
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: download
  wait: false
