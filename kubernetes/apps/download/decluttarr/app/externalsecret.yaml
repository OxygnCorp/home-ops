---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: decluttarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: decluttarr-secret
    template:
      engineVersion: v2
      data:
        config.yaml: |-
          general:
            log_level: INFO
            # Dry-run until validated against the live queues, then flip to false
            test_run: true
            timer: 10
          job_defaults:
            max_strikes: 3
            min_days_between_searches: 7
            max_concurrent_searches: 3
          jobs:
            remove_bad_files: true
            remove_failed_downloads: true
            remove_failed_imports:
              message_patterns:
                - "Not a Custom Format upgrade for existing*"
                - "Not an upgrade for existing*"
            remove_metadata_missing: true
            remove_missing_files: true
            remove_orphans: true
            remove_slow:
              min_speed: 100
            remove_stalled: true
            remove_unmonitored: true
            search_missing: true
            search_unmet_cutoff: true
          instances:
            radarr:
              - base_url: http://radarr.download
                api_key: {{ .RADARR_API_KEY }}
            sonarr:
              - base_url: http://sonarr.download
                api_key: {{ .SONARR_API_KEY }}
          download_clients:
            qbittorrent:
              - base_url: http://qbittorrent.download
                api_key: {{ .QBITTORRENT_API_KEY }}
            sabnzbd:
              - base_url: http://sabnzbd.download
                api_key: {{ .SABNZBD_API_KEY }}
  dataFrom:
    - extract:
        key: radarr
    - extract:
        key: sonarr
    - extract:
        key: sabnzbd
    - extract:
        key: qbittorrent
