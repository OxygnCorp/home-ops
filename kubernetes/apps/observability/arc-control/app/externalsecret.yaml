---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-control
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: arc-control-secret
    template:
      engineVersion: v2
      data:
        token: "{{ .ARC_CONTROL_TOKEN }}"
  dataFrom:
    - extract:
        key: arc-control
