---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: grafana-mcp
  interval: 1h
  values:
    controllers:
      grafana-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # upstream image (Docker catalog's mcp/grafana lacks --allowed-hosts);
              # pinned by digest per image policy, tags: 1.5.1 = stable release
              repository: docker.io/grafana/mcp-grafana
              tag: 2.0.0@sha256:2ed63c4d9d67557c8ea6cc6988743ddd9008e248bd9842e760fec378a0b61062
            args:
              - "-transport"
              - "sse"
              - "-address"
              - "0.0.0.0:8000"
              - "-allowed-hosts" # DNS-rebinding protection: exact-match allowlist of Host header values
              - "grafana-mcp.observability:8000,grafana-mcp.observability.svc,grafana-mcp.observability.svc.cluster.local,grafana-mcp.oxygn.dev,grafana-mcp.oxygn.dev:443"
            env:
              GRAFANA_URL: "http://grafana-service.observability:3000"
            envFrom:
              - secretRef:
                  name: grafana-mcp
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 999
    service:
      app:
        ports:
          http:
            port: 8000
    route:
      app:
        hostnames: ["grafana-mcp.oxygn.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
