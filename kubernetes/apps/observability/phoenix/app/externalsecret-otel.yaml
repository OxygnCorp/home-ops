---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# PHOENIX_SYSTEM_API_KEY does not exist in the 1Password `phoenix` item
# until it is created in the Phoenix UI post-deploy (system key for
# ingestion). Until then this ExternalSecret stays in SecretSyncedError —
# acceptable while the deployment is deferred; the deploy-env ExternalSecret
# `phoenix` (externalsecret.yaml) syncs independently.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phoenix-otel
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: phoenix-otel
    creationPolicy: Owner
    template:
      data:
        # OTEL_EXPORTER_OTLP_HEADERS (W3C) format: URL-encoded space %20,
        # the OTel SDK decodes it; Phoenix requires the `authorization`
        # header.
        OTEL_EXPORTER_OTLP_HEADERS: 'Authorization=Bearer%20{{ .PHOENIX_SYSTEM_API_KEY }}'
  data:
    - secretKey: PHOENIX_SYSTEM_API_KEY
      remoteRef:
        key: phoenix
        property: PHOENIX_SYSTEM_API_KEY
