---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phoenix
spec:
  # Repo-documented default (12h): external-secrets only rewrites the
  # Secret on actual change.
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: phoenix-secret
    creationPolicy: Owner
    template:
      data:
        PHOENIX_SECRET: "{{ .PHOENIX_SECRET }}"
        PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: "{{ .PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD }}"
  data:
    - secretKey: PHOENIX_SECRET
      remoteRef:
        key: phoenix
        property: PHOENIX_SECRET
    - secretKey: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
      remoteRef:
        key: phoenix
        property: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
