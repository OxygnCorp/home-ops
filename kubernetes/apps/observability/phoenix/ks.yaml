---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app phoenix
  labels:
    # Net-new CNPG cluster: plain initdb, no Barman recovery (see
    # kubernetes/flux/cluster/ks.yaml). Remove after the first scheduled
    # backup.
    components.postgres/cnpg: init
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/postgres
    - ../../../../components/oidc-kanidm/envoy
  # No kopiur/backup: phoenix has no PVC — all state lives in the CNPG
  # cluster (scheduled Barman backups + continuous WAL), and the kopiur
  # component targets PVCs.
  dependsOn:
    - name: kanidm
      namespace: security
    - name: onepassword
      namespace: external-secrets
    - name: miroir-config
      namespace: miroir-system
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/observability/phoenix/app
  postBuild:
    substitute:
      APP: phoenix
      # oidc-kanidm/envoy: the generated SecurityPolicy targets the
      # HTTPRoute `${OIDC_ROUTE_NAME}` in this namespace — here `phoenix`
      # (see httproute.yaml).
      APP_NAMESPACE: observability
      DOMAIN: oxygn.dev
      OIDC_CALLBACK: /oauth2/callback
      OIDC_DISPLAY_NAME: Phoenix
      OIDC_ROUTE_NAME: phoenix
      SUBDOMAIN: phoenix
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  timeout: 10m
  wait: false
