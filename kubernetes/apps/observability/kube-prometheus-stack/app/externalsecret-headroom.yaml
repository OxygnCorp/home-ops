---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Secret headroom-proxy-token dans observability : consommé par Prometheus
# (monté via prometheus.secrets) pour pointer les ServiceMonitor headroom
# (ns ai) en Bearer sur /metrics. Même item 1Password que la source de
# HEADROOM_PROXY_TOKEN côté app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headroom-proxy-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  dataFrom:
    - extract:
        key: Headroom
  target:
    name: headroom-proxy-token
    template:
      data:
        HEADROOM_PROXY_TOKEN: "{{ .HEADROOM_PROXY_TOKEN }}"
