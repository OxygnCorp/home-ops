---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 1h
  dependsOn: []
  values:
    blueprints:
      configMaps:
        - authentik-blueprint
        - mainclaw-blueprint
        - opencode-blueprint
        - hermes-blueprint
    global:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      deploymentStrategy:
        type: RollingUpdate
      env:
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: *app
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-rw.security.svc
        - name: AUTHENTIK_POSTGRESQL__USER
          value: *app
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-app
              key: password
        - name: AUTHENTIK_POSTGRESQL__SSLMODE
          value: require
        - name: AUTHENTIK_REDIS__HOST
          value: authentik-dragonfly
      envFrom:
        - secretRef:
            name: authentik-secret
    server:
      # 2 replicas: authentik is the SSO for the whole cluster — a single pod
      # turns every node reboot into a cluster-wide auth outage. Requires the
      # shared cache (dragonfly) and CNPG Postgres, both already HA.
      replicas: 2
      # Keep at least one server serving auth during voluntary evictions
      pdb:
        enabled: true
        minAvailable: 1
      # Force the two replicas onto different nodes so a single node reboot
      # leaves one replica (and its spegel-cached image) behind
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      resources:
        requests:
          cpu: 200m
        limits:
          memory: 1Gi
      # probes hit the DB (django-tenants query) — tolerate brief CNPG
      # maintenance windows (rolling restarts, primary shutdown) instead of
      # killing the server container on every 503
      livenessProbe:
        httpGet:
          path: /-/health/live/
          port: http
        initialDelaySeconds: 20
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: /-/health/ready/
          port: http
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 3
      metrics:
        prometheus:
          serviceMonitor:
            enabled: true
      route:
        main:
          enabled: true
          hostnames: ["authentik.oxygn.dev"]
          parentRefs:
            - name: envoy-external
              namespace: network
    worker:
      resources:
        requests:
          cpu: 200m
        limits:
          memory: 1Gi
