---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-opencode
data:
  opencode.yaml: |
    version: 1
    metadata:
      name: OpenCode OIDC
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: opencode
        attrs:
          name: opencode
          client_id: !Environment OPENCODE_CLIENT_ID
          client_secret: !Environment OPENCODE_CLIENT_SECRET
          client_type: confidential
          redirect_uris:
            - https://opencode.oxygn.dev/oauth2/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          sub_mode: hashed_user_id
          access_code_validity: hours=1
          token_validity: hours=24
          refresh_token_validity: days=30
          signing_key: !Find [authentik_crypto.certificatekeypair, [name], {}]
      - model: authentik_core.application
        identifiers:
          slug: opencode
        attrs:
          name: OpenCode
          slug: opencode
          provider: !KeyOf opencode
          meta_launch_url: https://opencode.oxygn.dev
          policy_engine_mode: all
