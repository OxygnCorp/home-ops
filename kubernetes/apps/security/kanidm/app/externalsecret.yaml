---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm-provision-token
spec:
  # The item does not exist until the human bootstrap runs (README): the
  # provision controller crashloops until the token lands. That is expected
  # and harmless — kanidm itself starts without it.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kanidm-provision-token
  data:
    - secretKey: token
      remoteRef:
        key: kanidm-provision
        property: token
