---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/backendtlspolicy_v1.json
# Kanidm serves its own TLS on 8443; the gateway validates it against the
# system store (cert-manager issues via letsencrypt-production)
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: kanidm-upstream
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: kanidm
  validation:
    wellKnownCACertificates: System
    hostname: idm.oxygn.dev
