---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app opencode
  namespace: ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc/envoy
  dependsOn:
    - name: authentik
      namespace: security
    - name: litellm
    - name: kopiur
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/ai/opencode/app
  patches:
    # mover security context inherited from the PVC's consumer workload (opencode
    # pod pins pod-level runAsUser 1000) instead of a static PUID — the default
    # 1024 mover cannot read opencode's data (PermissionDenied bursts on 2026-09-11):
    # an explicit runAsUser would always win over the inheritance, so it is
    # removed on both the SnapshotPolicy (pvcConsumer) and the Restore (recorded
    # identity replay) — see kopiur docs "Combining inherit with an explicit context"
  - patch: |-
      - op: add
        path: /spec/mover/inheritSecurityContextFrom
        value:
          pvcConsumer: {}
      - op: remove
        path: /spec/mover/securityContext
    target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
      version: v1alpha1
  - patch: |-
      - op: add
        path: /spec/mover/inheritSecurityContextFrom
        value:
          snapshot: {}
      - op: remove
        path: /spec/mover/securityContext
    target:
      group: kopiur.home-operations.com
      kind: Restore
      version: v1alpha1
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
      OIDC_ROUTE_NAME: opencode
      SUBDOMAIN: opencode
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
