---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      # Prefer the dedicated AI worker (k8s-3) but stay schedulable on any
      # node if it is unavailable; the toleration unlocks the
      # workload=ai:NoSchedule taint on k8s-3 (other nodes are untainted).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-3]
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                cp /kopiaignore/.kopiaignore /home/opencode/.kopiaignore
                mkdir -p /home/opencode/.config/opencode
                cp /etc/opencode/AGENTS.md /home/opencode/.config/opencode/AGENTS.md
                # Make the parent dir explicit for the mise-config subPath
                # mount (read-only ConfigMap) so a mount-point surprise is
                # obvious; kubelet normally creates it.
                mkdir -p /home/opencode/.config/mise
          # Installs mise + the pinned cluster tooling into the home PVC so
          # agent sessions can run GitOps validation locally (flate
          # test/diff) and the repo just recipes get past command-not-found
          # (talosctl, kubectl, yq, jq, gh, op, minijinja-cli, gum, helmfile,
          # helm).
          # Tool pins live in the opencode-mise ConfigMap (app/mise.yaml),
          # mounted read-only at ~/.config/mise/config.toml: keep that file
          # in sync with the repo .mise/config.toml in the same reviewed PR
          # (the Renovate mise manager only sees the root file).
          # Same image as the app container (shared via anchor) for
          # bash+curl; nothing is baked into the image itself. The CLIs stay
          # credentialless on purpose (no kubeconfig/talosconfig/
          # OP_SERVICE_ACCOUNT_TOKEN in this pod; the MCP gateway covers
          # cluster access).
          mise-setup:
            image: &opencode-image
              repository: ghcr.io/joryirving/opencode
              tag: 2.4.1@sha256:d47384ed0937285300b8485ed17fbef92165c6d2b2e73cd24ab11a3d40805f9a
            env:
              HOME: /home/opencode
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                MISE_BIN=/home/opencode/.local/bin/mise
                MISE_VERSION=2026.10.20
                if ! command -v curl >/dev/null 2>&1; then
                  echo "WARN: curl missing from the opencode image; cluster tooling not installed"
                  exit 0
                fi
                # Not first-boot-only: re-download when the pinned version
                # changes or the binary is missing/broken. Bounded: a stalled
                # network must not wedge the init phase forever.
                if [[ ! -x "$${MISE_BIN}" ]] || [[ "$("$${MISE_BIN}" --version 2>/dev/null || true)" != *"$${MISE_VERSION}"* ]]; then
                  install_script=$(mktemp)
                  if ! timeout 120 curl -fsSL -o "$${install_script}" https://mise.run \
                    || ! MISE_INSTALL_PATH="$${MISE_BIN}" MISE_VERSION="$${MISE_VERSION}" timeout 300 sh "$${install_script}"; then
                    rm -f "$${install_script}"
                    echo "WARN: mise download failed; cluster tooling unavailable this boot"
                    exit 0
                  fi
                  rm -f "$${install_script}"
                fi
                # Tool versions come from the opencode-mise ConfigMap
                # (app/mise.yaml), mounted read-only at ~/.config/mise/
                # config.toml by the mise-config volume. auto_install=false
                # there is load-bearing: it keeps the repo checkout's ~25
                # pins (go/node/python compile from source on Alpine) out of
                # the 10Gi PVC budget, and a missing ConfigMap is a hard fail
                # (the pod does not start) instead of a silent fallback to
                # auto_install=true.
                # Guard anyway: if this script ever runs without the mount
                # (a Job against the bare volume), install would be a no-op
                # and prune would see every version as untracked and wipe
                # the toolchain (2026-11-23 devclaw incident) — leave the
                # volume untouched in that case.
                # Readability alone is not enough: the OLD heredoc-written
                # config.toml still sits on the PVC under the masked mount
                # point, so verify the file really IS a mount.
                if ! grep -qF " /home/opencode/.config/mise/config.toml " /proc/self/mountinfo || [ ! -r /home/opencode/.config/mise/config.toml ]; then
                  echo "WARN: ~/.config/mise/config.toml is not a mounted opencode-mise ConfigMap; leaving the toolchain untouched"
                else
                  used_pct=$(df -P /home/opencode 2>/dev/null | awk 'NR==2 {gsub(/%/, "", $5); print $5}' || true)
                  if "$${MISE_BIN}" install; then
                    # Drop tool installs no longer pinned by any tracked
                    # mise config, so bumped pins do not leave old versions
                    # behind. Versions still tracked by live session
                    # worktrees survive (mise keeps every tracked config's
                    # pins) — by design, those sessions keep their tools.
                    # Only after a successful install: if a bumped pin
                    # failed to download, prune must not take the
                    # still-working older version with it.
                    "$${MISE_BIN}" prune --tools -y || echo "WARN: mise prune failed"
                  else
                    echo "WARN: mise install failed; cluster tooling unavailable this boot"
                    # Escape hatch: a full volume is exactly what makes
                    # install fail, so above 95% prune anyway — the only
                    # in-pod lever left (2026-11-23 devclaw lesson).
                    if [ -n "$${used_pct}" ] && [ "$${used_pct}" -ge 95 ]; then
                      echo "disk at $${used_pct}%: pruning mise tool versions the config no longer pins"
                      "$${MISE_BIN}" prune --tools -y || echo "WARN: mise prune failed"
                    fi
                  fi
                  "$${MISE_BIN}" reshim || echo "WARN: mise reshim failed"
                fi
          # Refresh the local home-ops main branch at every boot: worktrees
          # carry session work, but nothing ever pulled, so the main checkout
          # drifts behind origin (19 commits behind when this was written).
          # Public repo: plain HTTPS pull, no token, bounded by a timeout.
          # Non-fatal by design — worst case the session starts on the
          # previous boot's checkout.
          repo-refresh:
            image: *opencode-image
            env:
              HOME: /home/opencode
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                REPO="$${HOME}/projects/home-ops"
                if [[ ! -d "$${REPO}/.git" ]]; then
                  echo "skip: no home-ops clone on the volume"
                  exit 0
                fi
                cd "$${REPO}"
                if [[ "$(git symbolic-ref --quiet --short HEAD 2>/dev/null || true)" != "main" ]]; then
                  echo "WARN: home-ops checkout not on main; skipping refresh"
                  exit 0
                fi
                if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
                  echo "WARN: home-ops HEAD is not resolvable; skipping refresh"
                  exit 0
                fi
                if ! git diff-index --quiet HEAD; then
                  echo "WARN: home-ops working tree dirty; skipping refresh"
                  exit 0
                fi
                timeout 120 git pull --ff-only origin main || echo "WARN: git pull failed; keeping the current checkout"
        containers:
          app:
            image: *opencode-image
            command: ["/etc/opencode/entrypoint.sh"]
            env:
              HOME: &homepath /home/opencode
              OPENCODE_CONFIG: /etc/opencode/opencode.json
              TZ: Europe/Paris
              # LiteLLM Lens ingestion. Agents upload straight to Lens: the
              # gateway's /v1/traces and /v1/logs answer 410 by design, so this
              # must be the in-cluster Lens service, not litellm.ai:4000. The SDK
              # appends /v1/traces and /v1/logs itself, and it pipes every
              # application log line to /v1/logs too (no OTEL_LOGS_EXPORTER
              # switch) — wanted here, Lens folds session events into the trace.
              # serviceName is hardcoded by the SDK, hence no OTEL_SERVICE_NAME.
              # $(OPENCODE_TRACING_KEY) resolves from the secretRef above (envFrom
              # is expanded first); if that 1Password field disappears the literal
              # $(OPENCODE_TRACING_KEY) is sent and every batch gets a 401, the
              # traces are just dropped. Spans still buffered die with the pod,
              # and span payloads carry prompt/completion content.
              OTEL_EXPORTER_OTLP_ENDPOINT: http://lens.ai.svc.cluster.local:4318
              OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer $(OPENCODE_TRACING_KEY)
              OTEL_RESOURCE_ATTRIBUTES: gen_ai.agent.name=opencode
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 4096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
    service:
      app:
        forceRename: opencode-server
        ports:
          http:
            port: *port
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: *homepath
      kopiaignore:
        type: configMap
        name: opencode-kopiaignore
        globalMounts:
          - path: /kopiaignore
      config:
        type: configMap
        name: opencode-config
        defaultMode: 0755
        globalMounts:
          - path: /etc/opencode
      # Pinned mise tool config, mounted read-only. subPath: the kubelet
      # never refreshes a subPath mount in place, so a pin bump relies on
      # the reloader annotation above to roll the pod (the ConfigMap name
      # is hash-free, the HelmRelease values do not change on a bump).
      mise-config:
        type: configMap
        name: opencode-mise
        globalMounts:
          - path: /home/opencode/.config/mise/config.toml
            subPath: config.toml
