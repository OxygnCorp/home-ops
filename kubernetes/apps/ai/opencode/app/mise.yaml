---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-mise
data:
  config.toml: |
    # Cluster tooling installed on the home PVC by the mise-setup init
    # container (kubernetes/apps/ai/opencode/app/helmrelease.yaml), mounted
    # read-only at ~/.config/mise/config.toml.
    # KEEP IN SYNC with the repo .mise/config.toml: Renovate bumps the repo
    # file (never automerged for these tools, .renovate/autoMerge.json5) and
    # the same reviewed PR must update this one too -- in-repo
    # `mise exec -- <tool>` fails on mismatch (auto_install=false below, no
    # silent fallback). Renovate does not see this file (the mise manager
    # does not match ConfigMaps), same bump discipline as the heredoc it
    # replaces.
    [settings]
    # CRITICAL: keeps the repo checkout's ~25 pins (go/node/python compile
    # from source on Alpine) out of the 10Gi PVC budget.
    auto_install = false
    all_compile = false

    [tools]
    "github:home-operations/flate" = "0.8.0" # GitOps validation (flate test/diff)
    "just" = "1.59.0" # repo recipe runner
    "rg" = "16.0.0"
    "aqua:kubernetes-sigs/kustomize" = "5.6.0"
    "vals" = "0.51.1"
    # CLIs called by the repo just recipes (talos/, bootstrap/, kube/,
    # kanidm/ modules) so they run past command-not-found:
    "talosctl" = "1.14.6"
    "aqua:kubernetes/kubectl" = "1.37.1"
    "yq" = "4.54.3"
    "jq" = "1.8.2"
    "gh" = "2.105.0"
    "op" = "2.41.1"
    "aqua:mitsuhiko/minijinja" = "3.1.0" # minijinja-cli, used by `just template`
    "gum" = "2.0.2" # `just log`
    "aqua:helmfile/helmfile" = "1.8.5" # bootstrap module
    "aqua:helm/helm" = "4.3.2" # runtime dependency of helmfile
