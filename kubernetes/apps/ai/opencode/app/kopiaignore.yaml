---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-kopiaignore
data:
  .kopiaignore: |
    # git partial-clone promisor pack placeholders (projects/*/.git/objects/pack/):
    # root-owned read-only on the source volume, unreadable by the kopiur mover
    # (uid 1024) -> fatal errors while snapshotting. git re-fetches the blobs on
    # demand, so excluding them loses nothing
    *.promisor

    # tool caches, re-creatable (flate pre-pull blob cache holds root-owned
    # entries the kopiur mover cannot traverse -> 434+ fatal errors per run)
    .cache/

    # plaintext GitHub token written by the entrypoint with `umask 077`
    # (0600, uid 1000) -> unreadable by the kopiur mover (uid 1024) -> fatal
    # error per run. Also kept out of backups on purpose: it is a credential,
    # regenerated at container start
    .git-credentials
