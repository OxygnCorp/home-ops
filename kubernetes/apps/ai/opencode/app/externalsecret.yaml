---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name opencode
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: KEY_OPENCODE
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: github
        property: GITHUB_TOKEN
    - secretKey: GH_TOKEN
      remoteRef:
        key: github
        property: GITHUB_TOKEN
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
    # opencode v2 requires a server password: when OPENCODE_SERVER_PASSWORD is
    # unset or empty, the server generates a random one at startup and every
    # route behind the OIDC-gated HTTPRoute returns 401 (same fix as
    # joryirving/home-ops#10468).
    - secretKey: OPENCODE_SERVER_PASSWORD
      remoteRef:
        key: opencode
        property: password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# PHOENIX_SYSTEM_API_KEY does not exist in the 1Password `phoenix` item
# until it is created in the Phoenix UI post-deploy (system key for
# ingestion). Until then this ExternalSecret stays in SecretSyncedError —
# acceptable while the deployment is deferred; the deploy-env ExternalSecret
# `phoenix` (observability/phoenix/app/externalsecret.yaml) syncs independently.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phoenix-otel
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: phoenix-otel
    creationPolicy: Owner
    template:
      data:
        # OTEL_EXPORTER_OTLP_HEADERS (W3C) format: a literal space is required
        # here because litellm parses the value without `unquote`
        # (OpenTelemetryConfig._get_headers_dictionary); the standard OTel SDK
        # also accepts non-encoded values in liberal mode. Phoenix requires the
        # `authorization` header.
        OTEL_EXPORTER_OTLP_HEADERS: 'Authorization=Bearer {{ .PHOENIX_SYSTEM_API_KEY }}'
        # Raw key, no Bearer prefix: litellm's OTel v2 `arize_phoenix` preset
        # reads PHOENIX_API_KEY and builds the auth header itself.
        PHOENIX_API_KEY: '{{ .PHOENIX_SYSTEM_API_KEY }}'
  data:
    - secretKey: PHOENIX_SYSTEM_API_KEY
      remoteRef:
        key: phoenix
        property: PHOENIX_SYSTEM_API_KEY
