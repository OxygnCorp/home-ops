---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name opencode
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: KEY_OPENCODE
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: github
        property: GITHUB_TOKEN
    - secretKey: GH_TOKEN
      remoteRef:
        key: github
        property: GITHUB_TOKEN
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
    # opencode v2 requires a server password: when OPENCODE_SERVER_PASSWORD is
    # unset or empty, the server generates a random one at startup and every
    # route behind the OIDC-gated HTTPRoute returns 401 (same fix as
    # joryirving/home-ops#10468).
    - secretKey: OPENCODE_SERVER_PASSWORD
      remoteRef:
        key: opencode
        property: password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name opencode-oidc
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: opencode
        property: OPENCODE_CLIENT_ID
    - secretKey: client-secret
      remoteRef:
        key: opencode
        property: OPENCODE_CLIENT_SECRET
