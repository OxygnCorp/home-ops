---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    git config --global user.name "puchu-ai"
    git config --global user.email "266989594+puchu-ai@users.noreply.github.com"
    git config --global init.defaultBranch main
    git config --global credential.helper store
    git config --global --add safe.directory '*'

    umask 077
    printf 'https://x-access-token:%s@github.com\n' "$${GITHUB_TOKEN}" > "$${HOME}/.git-credentials"
    umask 022

    mkdir -p "$${HOME}/projects"
    if [[ ! -d "$${HOME}/projects/home-ops/.git" ]]; then
      git clone --filter=blob:none https://github.com/OxygnCorp/home-ops.git "$${HOME}/projects/home-ops" \
        || echo "WARN: home-ops clone failed; clone it from a session instead"
    fi

    cd "$${HOME}/projects"
    exec opencode serve --hostname 0.0.0.0 --port 4096
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "litellm/MiniMax-M3",
      "small_model": "litellm/MiniMax-M2.7-highspeed",
      "compaction": { "auto": true, "prune": true, "preserve_recent_tokens": 20000, "reserved": 16384 },
      "tool_output": { "max_lines": 800, "max_bytes": 16384 },
      "plugin": [
        ["@eleboucher/opencode-memini@0.7.23", { "base_url": "http://memini.ai:8080", "namespace": "opencode", "auto_update": false }]
      ],
      "enabled_providers": ["litellm"],
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "LiteLLM OpenAI",
          "options": {
            "baseURL": "http://litellm.ai:4000/v1",
            "apiKey": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "MiniMax-M3": { "name": "MiniMax M3 (primary)", "limit": { "context": 1000000, "output": 131072 } },
            "MiniMax-M2.7": { "name": "MiniMax M2.7", "limit": { "context": 204800, "output": 131072 } },
            "MiniMax-M2.7-highspeed": { "name": "MiniMax M2.7 Highspeed", "limit": { "context": 204800, "output": 131072 } },
            "dsv4f": { "name": "DeepSeek V4 Flash", "limit": { "context": 1000000, "output": 16384 } },
            "dsv4p": { "name": "DeepSeek V4 Pro", "limit": { "context": 1000000, "output": 16384 } },
            "go-kimi-k3": { "name": "Kimi K3", "limit": { "context": 1000000, "output": 32768 } },
            "go-kimi-k2.7-code": { "name": "Kimi K2.7 Code", "limit": { "context": 262144, "output": 16384 } },
            "go-glm-5.3": { "name": "GLM 5.3", "limit": { "context": 1000000, "output": 131072 } },
            "go-glm-5.3-flash": { "name": "GLM 5.3 Flash", "limit": { "context": 1000000, "output": 32768 } },
            "go-qwen3.8-max": { "name": "Qwen3.8 Max", "limit": { "context": 1000000, "output": 16384 } },
            "go-qwen3.8-flash": { "name": "Qwen3.8 Flash", "limit": { "context": 262144, "output": 16384 } },
            "go-hy4-preview": { "name": "Hy4 Preview", "limit": { "context": 131072, "output": 16384 } },
            "go-dsv4f-vision": { "name": "DeepSeek V4 Flash Vision", "limit": { "context": 1000000, "output": 16384 } },
            "go-minimax-m3": { "name": "MiniMax M3 (Zen Go)", "limit": { "context": 1000000, "output": 32768 } },
            "go-minimax-m2.7": { "name": "MiniMax M2.7 (Zen Go)", "limit": { "context": 204800, "output": 16384 } },
            "mimo-v2.5-pro": { "name": "MiMo v2.5 Pro", "limit": { "context": 262144, "output": 16384 } },
            "mimo-v2.5": { "name": "MiMo v2.5", "limit": { "context": 262144, "output": 16384 } },
            "qwen3.7-plus": { "name": "Qwen3.7 Plus", "limit": { "context": 1000000, "output": 16384 } },
            "zai-glm-5.2": { "name": "GLM 5.2 (z.ai Coding)", "limit": { "context": 1000000, "output": 131072 } },
            "zai-glm-5.3": { "name": "GLM 5.3 (z.ai Coding)", "limit": { "context": 1000000, "output": 131072 } },
            "zai-glm-5.3-flash": { "name": "GLM 5.3 Flash (z.ai Coding)", "limit": { "context": 1000000, "output": 32768 } }
          }
        }
      },
      "mcp": {
        "toolhive": {
          "type": "remote",
          "url": "http://vmcp-mcp-gateway-devops.ai:4483/mcp",
          "enabled": true
        }
      }
    }
