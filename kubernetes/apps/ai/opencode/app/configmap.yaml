---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    git config --global user.name "puchu-ai"
    git config --global user.email "266989594+puchu-ai@users.noreply.github.com"
    git config --global init.defaultBranch main
    git config --global credential.helper store
    git config --global --add safe.directory '*'

    umask 077
    printf 'https://x-access-token:%s@github.com\n' "$${GITHUB_TOKEN}" > "$${HOME}/.git-credentials"
    umask 022

    mkdir -p "$${HOME}/projects"
    if [[ ! -d "$${HOME}/projects/home-ops/.git" ]]; then
      git clone --filter=blob:none https://github.com/OxygnCorp/home-ops.git "$${HOME}/projects/home-ops" \
        || echo "WARN: home-ops clone failed; clone it from a session instead"
    fi

    # Serve from the home-ops project so the UI lands on its sessions by
    # default (opencode scopes sessions per directory); fall back to the
    # projects root if the clone failed so the server still starts.
    cd "$${HOME}/projects/home-ops" 2>/dev/null || cd "$${HOME}/projects"
    exec opencode serve --hostname 0.0.0.0 --port 4096
  AGENTS.md: |
    # Global rules (toutes sessions, tous projets)

    ## Git isolation — sessions parallèles

    - Si la tâche implique de créer ou modifier des fichiers, ne travaille JAMAIS
      directement dans le checkout principal du repo.
    - Avant la première modification de fichier, vérifie que tu es dans un worktree
      dédié (répertoire distinct du clone principal, sur une branche dédiée).
      Sinon, crée-en un d'abord et continue là-bas :

          git worktree add ../<repo>-<sujet> -b <type>/<sujet>

    - Les tâches en lecture seule (questions, exploration) n'exigent pas de worktree.
    - Ne stage/committe QUE les fichiers que tu as toi-même créés ou modifiés —
      jamais de `git add -A` ni `git add .`.

    ## QUALITY PASS (avant de déclarer un travail terminé)

    - Après tout changement substantiel, dispatche un subagent `reviewer`
      fresh-context pour une passe critique complète sur le diff (bugs restants,
      cas limites, gestion d'erreurs, petites victoires QoL).
    - Donne-lui les fichiers modifiés et l'objectif — pas ton raisonnement ; un
      relecteur quasi-sans-contexte est plus critique et attrape ce que tu as
      rationalisé.
    - Agis sur ses constats, puis re-vérifie. Skip uniquement pour du travail
      trivial ou en lecture seule.

  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "litellm/go-glm-5.3-flash",
      "agents": {
        "title": {
          "model": "litellm/dsv41f"
        },
        "reviewer": {
          "description": "Revise critique fresh-context d'un diff (bugs, cas limites, gestion d'erreurs, QoL). Famille GLM — à dispatcher après un changement substantiel (QUALITY PASS).",
          "mode": "subagent",
          "model": "litellm/go-glm-5.3-flash",
          "system": "Tu es un relecteur de code indépendant. On te donne des fichiers modifiés et l'objectif du changement — jamais le raisonnement de l'auteur. Relis le diff complet (git diff de la branche) et cherche : bugs réels, cas limites non gérés, erreurs avalées, incohérences avec le reste du repo, et petites améliorations QoL évidentes. Signale chaque constat avec fichier:ligne, ce qui ne va pas, et pourquoi ça compte. Pas de compliments, pas de reformulation du but : uniquement les constats, triés par gravité (bloquant / devrait corriger / mineur). Si rien à signaler, dis-le explicitement."
        }
      },
      "compaction": {
        "auto": true,
        "keep": {
          "tokens": 20000
        },
        "buffer": 16384
      },
      "tool_output": {
        "max_lines": 800,
        "max_bytes": 16384
      },
      "permissions": [
        {
          "action": "edit",
          "resource": "*",
          "effect": "allow"
        },
        {
          "action": "shell",
          "resource": "*",
          "effect": "allow"
        },
        {
          "action": "external_directory",
          "resource": "*",
          "effect": "ask"
        },
        {
          "action": "external_directory",
          "resource": "~/projects/**",
          "effect": "allow"
        },
        {
          "action": "external_directory",
          "resource": "/tmp/opencode/**",
          "effect": "allow"
        }
      ],
      "plugins": [
        "superpowers@git+https://github.com/obra/superpowers.git",
        # opencode v2 plugin contract — the v1 "@eleboucher/opencode-memini" does not load under v2.
        # Version is pinned in the "package" specifier below; grouped with the memini chart
        # updates so every memini release lands as one PR across mainclaw, devclaw and opencode.
        # The marker must stay on the line immediately above the entry. Keep "npm" bare —
        # do NOT write "datasource=npm": the annotated-deps manager would double-capture this pin.
        # renovate: npm depName=@eleboucher/opencode-memini-v2
        { "package": "@eleboucher/opencode-memini-v2@0.7.32", "options": { "base_url": "http://memini.ai:8080", "auto_update": false } },
        "@tarquinen/opencode-dcp@3.2.0"
