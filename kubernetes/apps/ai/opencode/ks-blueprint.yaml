---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opencode-blueprint
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: opencode
  interval: 1h
  path: ./kubernetes/components/oidc/blueprint
  postBuild:
    substitute:
      APP: opencode
      OIDC_DISPLAY_NAME: OpenCode
      OIDC_ENV_PREFIX: OPENCODE
      DOMAIN: ${DOMAIN:=oxygn.dev}
      SUBDOMAIN: ${SUBDOMAIN:=opencode}
      OIDC_CALLBACK: ${OIDC_CALLBACK:=/oauth2/callback}
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  timeout: 5m
  wait: false
