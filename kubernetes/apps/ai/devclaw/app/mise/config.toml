# Toolchain installed on the devclaw state volume by the app container
# (`mise install` at startup) and pruned back to this list when the volume
# passes 80% (`mise prune --tools -y`).
#
# Git is authoritative: this file is mounted read-only at
# ~/.config/mise/config.toml, so an agent cannot drift it with `mise use -g`.
# Renovate maintains these pins through its native mise manager (the same one
# that bumps the repo-root .mise/config.toml) and opens a PR per bump.
#
# Cluster read/write access normally goes through the litellm MCP gateway
# (kubectl, flux, radar, talos, github), so the CLIs kept here are the ones
# that either have no MCP equivalent or are needed by local validation
# (flate, kubeconform, kustomize, helm/helmfile) and secret handling.
# kubescape, k9s, stern and aws-cli were dropped for that reason (radar covers
# posture/diagnostics and log reading; the rest had no use here).

[tools]
# Runtimes
node = "24.18.1"
python = "3.14.6"
uv = "0.13.9"
go = "1.27.4"
gum = "2.0.2"

# Mise
"just" = "1.59.0"
"yq" = "4.54.3"
"jq" = "1.8.2"
"rg" = "15.2.0"
"gh" = "2.105.0"

# 1Password
"vals" = "0.51.1"
"op" = "2.41.1"

# Flux Stuff
"aqua:fluxcd/flux2" = "2.10.0"
"github:home-operations/flate" = "0.7.3"

# Kubectl + Plugins
"aqua:kubernetes/kubectl" = "1.37.1"
"aqua:yannh/kubeconform" = "0.8.0"

# Misc K8s Tools
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:helm/helm" = "4.3.2"
"aqua:helmfile/helmfile" = "1.8.4"
"aqua:mitsuhiko/minijinja" = "3.1.0" # minijinja-cli, used by `just template`

# Talos Stuff
"talosctl" = "1.14.6"
"aqua:budimanjojo/talhelper" = "3.1.17"

# Misc Tools
"aqua:cert-manager/cmctl" = "2.6.2"
"aqua:cloudflare/cloudflared" = "2026.11.1"
"asdf:carnei-ro/asdf-cilium-cli" = "0.18.2"
"aqua:cilium/hubble" = "1.20.4"

# Linters
"pipx:yamllint" = "1.38.0"
