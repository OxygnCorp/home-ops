# Toolchain installed on the devclaw state volume by the app container
# (`mise install` at startup) and pruned back to this list when the volume
# passes 80% (`mise prune --tools -y`).
#
# Git is authoritative: this file is mounted read-only at
# ~/.config/mise/config.toml, so an agent cannot drift it with `mise use -g`.
# Renovate maintains these pins through its native mise manager (the same one
# that bumps the repo-root .mise/config.toml) and opens a PR per bump.
#
# Cluster read/write access goes through the litellm MCP gateway (kubectl, flux,
# radar, talos, github), so the CLIs kept here are the ones that either have no
# MCP equivalent or are needed by local validation (flate, kubeconform,
# kustomize, helm/helmfile) and secret handling.
# kubescape, k9s, stern, aws-cli and kubectl were dropped for that reason:
# radar covers posture/diagnostics and log reading. kubectl has no kubeconfig
# on the volume, and under it falls back to localhost:8080 rather than to the
# pod's service account (verified), so it needs an explicit in-cluster config
# we deliberately do not ship: that would hand this pod a second, unmetered
# cluster write path next to the MCP gateway, which is the only sanctioned one.

[tools]
# Runtimes
# node is held at 24.x: Node 26 official linux-x64 builds require
# libatomic.so.1, which the openclaw image does not ship - every `node`
# call exits 127 and the pod crash-loops (2026-11-23, #5980). A scoped
# Renovate rule (.renovate/overrides.json5) holds bumps to the 24.x
# line; only lift it once the image ships libatomic
# (alpine: `apk add libatomic`, not Debian's libatomic1).
node = "24.22.3"
python = "3.15.2"
uv = "0.13.9"
go = "1.27.4"
gum = "2.0.2"

# Mise
"just" = "1.59.0"
"yq" = "4.54.3"
"jq" = "1.8.2"
"rg" = "16.0.0"
"gh" = "2.105.0"

# 1Password
"vals" = "0.51.1"
"op" = "2.41.1"

# Flux Stuff
"aqua:fluxcd/flux2" = "2.10.1"
"github:home-operations/flate" = "0.8.0"

# Validation
"aqua:yannh/kubeconform" = "0.8.0"

# Misc K8s Tools
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:helm/helm" = "4.3.2"
"aqua:helmfile/helmfile" = "1.8.5"
"aqua:mitsuhiko/minijinja" = "3.1.0" # minijinja-cli, used by `just template`

# Talos Stuff
"talosctl" = "1.14.6"
"aqua:budimanjojo/talhelper" = "3.1.17"

# Misc Tools
"aqua:cert-manager/cmctl" = "2.6.2"
"aqua:cloudflare/cloudflared" = "2026.11.1"
"aqua:cilium/cilium-cli" = "0.20.3"
"aqua:cilium/hubble" = "1.20.4"

# Linters
"pipx:yamllint" = "1.38.0"
