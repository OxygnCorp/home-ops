---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devclaw
spec:
  chartRef:
    kind: OCIRepository
    name: devclaw
  interval: 1h
  # The OpenClaw gateway only starts listening on its readiness port after
  # the (slow) doctor/migration phase (~8+ min on a full pod recycle that
  # runs the startup migration). Helm's default 5m timeout made every
  # rollout exceeding it fail and remediate into a rollback (2026-10-23,
  # release stalled with pods stuck "PodInitializing"/not-Ready for ~5m).
  # 20m covers the doctor phase + plugin install with margin under 1h.
  timeout: 20m
  values:
    controllers:
      openclaw:
        # Explicit: the lease guard below assumes no two gateways can own the
        # state volume at once, which only holds if replacement is Recreate.
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: "devclaw-secret, devclaw-config"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              # Pinned to the multi-arch manifest digest of alpine:3.24 (repo
              # policy: container images prefer @sha256 refs) — a tag ref on
              # Docker Hub can stall on registry slowness and block the whole
              # pod in PodInitializing during rollouts.
              tag: 3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
            securityContext:
              runAsUser: 0
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                # Sticky bit on the PVC root: openclaw doctor refuses to
                # snap pre-repair state when a staging ancestor can be
                # replaced by another user ("Original state capture was
                # unavailable" + no automatic restore path). g+w must stay
                # (fsGroup children like ~/.config, ~/.local are created
                # group-writable), so 3775 = setgid + sticky.
                chmod 3775 /home/node
                # Same doctor refusal, one level down: doctor probes the
                # temp roots themselves (.cache is the default temp root,
                # .openclaw/tmp the state fallback). Devclaw hit this on
                # 2026-11-16 05:09-05:47 (CrashLoopBackOff x30, "No safe
                # OpenClaw temp root is available" → doctor could not
                # enter maintenance → gateway exit 1). Create them if
                # absent (kopia restores exclude them), normalize
                # ownership, then sticky — a failed mkdir/chown/chmod
                # stays fatal under set -e so a real failure is visible
                # instead of silently reproducing the crash. Sticky keeps
                # g+w for fsGroup children: 1775 = sticky + setgid + g+w.
                # (mainclaw only needs the root chmod today — its sticky
                # root satisfied doctor since 933bd6ffd — but apply the
                # same logic here defensively.)
                mkdir -p /home/node/.cache /home/node/.openclaw/tmp
                chown 1000:100 /home/node/.cache /home/node/.openclaw/tmp
                chmod 1775 /home/node/.cache /home/node/.openclaw/tmp
                # Parent dir for the read-only mise config subPath mount below
                mkdir -p /home/node/.config/mise
                chown 1000:100 /home/node/.config/mise
                rm -f /home/node/.openclaw/openclaw.json
                cp /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chown 1000:100 /home/node/.openclaw/openclaw.json
                chmod 400 /home/node/.openclaw/openclaw.json
                # Retention: doctor creates a full recovery capture (~750M of
                # agent sqlite) on every repair run and never prunes them; mainclaw
                # hit 91% PVC usage this way (2026-10-23). Always keep the newest
                # capture (the only automatic rollback path) plus every capture
                # with a file modified in the last 7 days (content age, not the
                # dir's own mtime); tolerates absent dirs (kopia restores now
                # exclude them).
                # No `ls`/`find` bottle-neck with set -e + pipefail: when the
                # glob matches nothing, ls exits 1 with stderr suppressed and
                # pipefail kills the whole init (devclaw had no captures after
                # a kopia restore; the init crashed instantly with exit 1 and
                # no output, hanging the rollout ~20min ×3 on 2026-10-23 & 25).
                # Compute the newest capture by hand, tolerating an empty set.
                # "Newest" is the capture dir with the highest mtime; doctor
                # writes a capture once and never touches the dir again, so the
                # root mtime only moves when a capture is created.
                cutoff=$(( $(date +%s) - 604800 ))
                # Minutes form of the same window, for the content check below
                # (a capture dir's own mtime stops moving once doctor is done).
                cutoff_minutes=$(( 7 * 24 * 60 ))
                # 3 days, in seconds: the state/migration backup class window.
                state_bak_cutoff=$(( $(date +%s) - 259200 ))
                newest=""
                for d in /home/node/.openclaw.update-captures/doctor-*; do
                    [ -d "$d" ] || continue
                    if [ -z "$newest" ] || [ "$(stat -c %Y "$d")" -gt "$(stat -c %Y "$newest")" ]; then
                        newest="$d"
                    fi
                done
                for d in /home/node/.openclaw.update-captures/doctor-*; do
                    [ -d "$d" ] || continue
                    if [ "$d" = "$newest" ]; then continue; fi
                    # A failed traversal must never read as "nothing recent":
                    # non-zero find keeps the capture. (2>/dev/null would merge
                    # "clean scan" and "scan error" and feed a destructive rm.)
                    recent=$(find "$d" -mmin "-$cutoff_minutes" -print -quit) || { echo "cannot scan $d, keeping it"; continue; }
                    if [ -n "$recent" ]; then continue; fi
                    rm -rf "$d" || true
                done
                # Prune startup-migration backups, keeping the NEWEST ONE
                # overall within each agent dir (the only automatic rollback
                # path) and everything younger than 7d. Newest-first walk
                # (not `$(ls|head)`) so an empty set can't kill the init
                # under set -e + pipefail (devclaw, 2026-10-23/25 & 27).
                for d in /home/node/.openclaw/agents/*/agent; do
                    [ -d "$d" ] || continue
                    keep=""
                    for g in "$d"/*.pre-startup-migration-*.bak; do
                        [ -e "$g" ] || continue
                        if [ -z "$keep" ] || [ "$(stat -c %Y "$g")" -gt "$(stat -c %Y "$keep")" ]; then
                            keep="$g"
                        fi
                    done
                    [ -n "$keep" ] || continue
                    for f in "$d"/*.pre-startup-migration-*.bak; do
                        [ -e "$f" ] || continue
                        if [ "$f" != "$keep" ] && [ "$(stat -c %Y "$f")" -lt "$cutoff" ]; then rm -f "$f" || true; fi
                    done
                done
                # State-database backups: doctor cron leaves one full copy a
                # day next to the live DB and each startup migration leaves
                # another (13 copies / 888M for a 77M DB on mainclaw,
                # 2026-11-23) and nothing pruned them. Keep the newest of each
                # class plus 3 days. Only the two known classes are matched;
                # anything else stays untouched.
                prune_state_baks() {
                    local keep_bak=""
                    for g in /home/node/.openclaw/state/*"$1"*.bak; do
                        [ -e "$g" ] || continue
                        if [ -z "$keep_bak" ] || [ "$(stat -c %Y "$g")" -gt "$(stat -c %Y "$keep_bak")" ]; then
                            keep_bak="$g"
                        fi
                    done
                    [ -n "$keep_bak" ] || return 0
                    for g in /home/node/.openclaw/state/*"$1"*.bak; do
                        [ -e "$g" ] || continue
                        if [ "$g" != "$keep_bak" ] && [ "$(stat -c %Y "$g")" -lt "$state_bak_cutoff" ]; then rm -f "$g" || true; fi
                    done
                    return 0
                }
                prune_state_baks doctor-cron-
                prune_state_baks pre-startup-migration-
                # Legacy one-off sqlite snapshots (`.sqlite.bak-<date>`) match
                # neither migration glob and used to pile up forever. Age-only
                # on purpose: the class is retired, so a 30-day-old snapshot is
                # not the last line of defence for anything.
                find /home/node/.openclaw/agents -mindepth 1 -name '*.sqlite.bak-*' -mtime +30 -delete 2>/dev/null || true
                # Stale sqlite readonly-check temp copies (orphaned fs-safe files)
                if [ -d /home/node/.cache/openclaw ]; then
                    find /home/node/.cache/openclaw -name '.fs-safe-*.tmp' -mtime +1 -delete 2>/dev/null || true
                fi
                # Disk hygiene for everything else that grows unattended. The
                # PVC sat at 94% (554M free) on 2026-11-23 with ~1.4G of data
                # that is either re-downloadable or superseded. Rules are
                # size/mtime-based (nothing still in use disappears on a
                # restart), tolerant of missing dirs (kopia restores exclude
                # .npm/.cache) and end in `|| true` so a busybox quirk can
                # never wedge the init under set -euo pipefail.
                # npm content-addressed cache: dropped whole (not by file, which
                # would leave dangling index entries) once it exceeds 500M; it
                # only ever costs a re-download. Logs are plain files.
                if [ -d /home/node/.npm ]; then
                    cache_mb=$(du -s -m /home/node/.npm/_cacache 2>/dev/null | awk 'NR==1 {print $1}') || true
                    if [ -n "$cache_mb" ] && [ "$cache_mb" -gt 500 ]; then
                        echo "npm cache is $cache_mb MB: dropping ~/.npm/_cacache"
                        rm -rf /home/node/.npm/_cacache || true
                    fi
                    find /home/node/.npm/_logs -type f -mtime +7 -delete 2>/dev/null || true
                fi
                # Transient plugin capture dirs (94M on devclaw, 2026-11-23).
                if [ -d /home/node/.openclaw/tmp/plugin-captures ]; then
                    find /home/node/.openclaw/tmp/plugin-captures -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf {} \; 2>/dev/null || true
                fi
                # Legacy jsonl->sqlite import archive (328M imported
                # 2026-08-31): the transcripts live in sqlite now, so the raw
                # jsonl only backs a rollback older than this 30d window.
                for d in /home/node/.openclaw/agents/*/session-sqlite-import-archive; do
                    [ -d "$d" ] || continue
                    find "$d" -type f -mtime +30 -delete 2>/dev/null || true
                    find "$d" -mindepth 1 -type d -empty -delete 2>/dev/null || true
                done
                # Not handled here: mise tool versions (~5G of ad hoc installs
                # on this volume). `mise prune` is a no-op for versions whose
                # config was never tracked, and the volume's mise binary is
                # glibc, so it cannot run in this alpine init. See README.
                cp /kopiaignore/.kopiaignore /home/node/.kopiaignore

        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.11.7@sha256:461cc655301409901f2df11d6ec9f029f9709e4607826e9780fd74f8e1d12a16
            # The gateway only listens on 18789 after a slow doctor/migration
            # phase (~8 min); keep the pod NotReady until then so Envoy does
            # not route to a dead upstream during rollouts
            probes:
              readiness:
                custom: true
                spec:
                  tcpSocket:
                    port: 18789
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 60
            command:
              - /bin/sh
              - -c
              - |
                # Toolchain: the pins live in Git (mise/config.toml, mounted
                # read-only at ~/.config/mise/config.toml) and Renovate bumps
                # them like the repo-root .mise/config.toml. `mise install` is
                # idempotent (instant once satisfied) and covers a pin bumped
                # by Renovate before its tool is on the volume. The prune only
                # runs under disk pressure: versions the config no longer pins
                # are reclaimable, but tools an agent installs ad hoc survive
                # until the room is actually needed. Neither step may block the
                # gateway, so both warn and continue.
                if [ -x "$HOME/.local/bin/mise" ]; then
                  "$HOME/.local/bin/mise" install || echo "WARN: mise install failed; continuing"
                  used_pct=$(df -P "$HOME" 2>/dev/null | awk 'NR==2 {gsub(/%/, "", $5); print $5}')
                  if [ -n "$used_pct" ] && [ "$used_pct" -ge 80 ]; then
                    echo "disk at $used_pct%: pruning mise tool versions the config no longer pins"
                    "$HOME/.local/bin/mise" prune --tools -y || echo "WARN: mise prune failed; continuing"
                  fi
                fi
                # Install the memini memory plugin from ClawHub, version-guarded:
                # only fetches when the pinned version differs from what's on the
                # persistent volume, so normal restarts stay offline.
                # Renovate tracks the plugin version against the ClawHub
                # npm-compatible registry and groups it with the memini chart
                # update so both stay aligned; the guard below keeps restarts
                # offline and warns instead of failing on a transient drift.
                # renovate: clawhub:@eleboucher/memini registryUrl=https://clawhub.ai/api/npm
                MEMINI_PLUGIN_VERSION=0.7.39
                # Strip the chart tag prefix at runtime; braced shell expansion does not survive
                # the Flux postBuild variable substitution
                MEMINI_PLUGIN_REL=$(printf '%s' "$MEMINI_PLUGIN_VERSION" | sed 's/^v//')
                if [ "$(cat "$HOME/.openclaw/extensions/memini/.clawver" 2>/dev/null)" != "$MEMINI_PLUGIN_REL" ]; then
                  if node /app/openclaw.mjs plugins install "clawhub:@eleboucher/memini@$MEMINI_PLUGIN_REL" --force; then
                    printf '%s' "$MEMINI_PLUGIN_REL" > "$HOME/.openclaw/extensions/memini/.clawver"
                  else
                    echo "WARN: memini plugin install failed; starting with whatever is present"
                  fi
                fi
                # Re-sync the config from the secret mount before doctor/gateway:
                # the init container may have copied a stale secret version when
                # the pod is created right after a secret update (kubelet cache
                # propagation race) — the mount settles during init phase.
                cp -f /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chown 1000:100 /home/node/.openclaw/openclaw.json
                chmod 400 /home/node/.openclaw/openclaw.json
                # Gateway lease guard: a pod killed before it can stop the
                # gateway (e.g. its init failing on a transient read-only
                # mount, 2026-11-20) leaves the state lease recorded against a
                # pod name + PID namespace that no later pod can verify, so
                # every replacement is refused ("cannot verify Gateway
                # ownership from this process; heartbeat age does not prove
                # that the holder stopped") and the gateway exits 1 after
                # waiting 95 s — a crash loop only an explicit recover-lock
                # clears. Opt-in, and still safe: recover-lock refuses a
                # holder it can verify as alive, and this workload runs
                # Recreate on a RWO volume, so only one pod can own the state.
                # Unbraced on purpose: braced expansion is eaten by Flux
                # postBuild substitution (same reason as MEMINI above).
                if [ "$OPENCLAW_AUTO_RECOVER_LOCK" = "true" ]; then
                  lock_fp="$(node /app/openclaw.mjs gateway recover-lock --json 2>/dev/null \
                    | tr -d '\n' \
                    | grep -oE '"confirmation"[[:space:]]*:[[:space:]]*"[0-9a-f]{64}"' \
                    | grep -oE '[0-9a-f]{64}' || true)"
                  if [ -n "$lock_fp" ]; then
                    echo "Recovering unverifiable Gateway lease ($lock_fp)"
                    node /app/openclaw.mjs gateway recover-lock --confirm "$lock_fp" \
                      || echo "WARN: recover-lock refused; continuing with a live holder"
                  fi
                fi
                # Doctor check and fix any issues with the OpenClaw installation, then start the gateway
                node /app/openclaw.mjs doctor --fix
                # Start gateway
                echo "Starting OpenClaw gateway..."
                exec node /app/openclaw.mjs gateway
            env:
              OPENCLAW_LOG_LEVEL: debug
              # Reclaim a Gateway lease left behind by a pod that died before
              # it could stop the gateway; see the guard in the command.
              OPENCLAW_AUTO_RECOVER_LOCK: "true"
              GOPATH: /home/node/go
              HOME: /home/node
              HOMEBREW_CELLAR: /home/node/.local/homebrew/Cellar
              HOMEBREW_PREFIX: /home/node/.local/homebrew
              HOMEBREW_REPOSITORY: /home/node/.local/homebrew
              OPENCLAW_GATEWAY_PORT: 18789
              PATH: /home/node/.local/bin:/home/node/.local/share/mise/shims:/home/node/.local/go/bin:/home/node/.local/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              TERM: xterm-256color
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2000m
                # Headroom for openclaw anon bursts, same rationale as mainclaw (PR #4607).
                memory: 6Gi

          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.146.0@sha256:fc708b18f6c613b5a9d00f1d1801e58376d3df9c5b5de77f5c02d67b711f99c9
            env:
              TZ: Europe/Paris
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/home/node/.vscode",
                "--extensions-dir",
                "/home/node/.vscode",
                "--port",
                "12321",
                "/config"
              ]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: true
      # Give the gateway time to stop cleanly and release its state lease;
      # a pod killed mid-shutdown leaves a lock the next pod cannot claim.
      terminationGracePeriodSeconds: 60
      # Prefer the dedicated AI worker (k8s-3) but stay schedulable on any
      # node if it is unavailable; the toleration unlocks the
      # workload=ai:NoSchedule taint on k8s-3 (other nodes are untainted).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-3]
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.10.98.190
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: 18789
          codeserver:
            port: 12321
    route:
      main:
        hostnames:
          - "devclaw.oxygn.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 18789
      codeserver:
        hostnames:
          - "devclaw-code.oxygn.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 12321
    serviceAccount:
      openclaw: {}
    rbac:
      roles:
        openclaw-read-all:
          type: ClusterRole
          rules:
            # Broad read-only access across cluster resources. Secrets intentionally excluded.
            - apiGroups: [""]
              resources: ["pods", "pods/log", "nodes", "services", "namespaces", "configmaps", "persistentvolumes", "persistentvolumeclaims", "endpoints", "resourcequotas", "limitranges", "serviceaccounts", "events"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["apps"]
              resources: ["deployments", "daemonsets", "statefulsets", "replicasets", "controllerrevisions"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["batch"]
              resources: ["jobs", "cronjobs"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["networking.k8s.io"]
              resources: ["ingresses", "ingressclasses", "networkpolicies"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["storage.k8s.io"]
              resources: ["storageclasses", "csinodes", "csidrivers", "volumeattachments"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["autoscaling"]
              resources: ["horizontalpodautoscalers"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["policy"]
              resources: ["poddisruptionbudgets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["apiextensions.k8s.io"]
              resources: ["customresourcedefinitions"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["apiregistration.k8s.io"]
              resources: ["apiservices"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["metrics.k8s.io"]
              resources: ["nodes", "pods"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["helm.toolkit.fluxcd.io"]
              resources: ["helmreleases"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["kustomize.toolkit.fluxcd.io"]
              resources: ["kustomizations"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["source.toolkit.fluxcd.io"]
              resources: ["gitrepositories", "helmrepositories", "ocirepositories", "buckets", "helmcharts"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["external-secrets.io"]
              resources: ["externalsecrets", "secretstores", "clustersecretstores"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["monitoring.coreos.com"]
              resources: ["prometheuses", "alertmanagers", "servicemonitors", "podmonitors", "prometheusrules", "thanosrulers", "probes"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["snapshot.storage.k8s.io"]
              resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
              verbs: ["get", "list", "watch"]
        openclaw-write-restricted:
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["delete"]
            - apiGroups: [""]
              resources: ["pods/exec"]
              verbs: ["create"]
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["patch", "update"]
      bindings:
        openclaw-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: openclaw-read-all
          subjects:
            - identifier: openclaw
              serviceAccount: openclaw
        openclaw-write-restricted:
          type: RoleBinding
          roleRef:
            identifier: openclaw-write-restricted
          subjects:
            - identifier: openclaw
              serviceAccount: openclaw
    persistence:
      openclaw-home:
        type: emptyDir
      # openclaw#153067 tmpfs staging workaround removed 2026-09-25 (same PR
      # as mainclaw): fix ships in 2026.9.6; staging churn verified stopped
      # in-cluster (0 staging files over 150 × 0.2s samples, cgroup shmem 0).
      # ~/.cache/* now lives on the openclaw-home emptyDir.
      kopiaignore:
        type: configMap
        name: devclaw-kopiaignore
        globalMounts:
          - path: /kopiaignore
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/node
      data:
        type: nfs
        server: funkstation.internal
        path: /volume1/Agents/devclaw
        globalMounts:
          - path: /data
      openclaw-config:
        type: secret
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/openclaw.json
            subPath: openclaw.json
      # Toolchain pins live in Git (mise/config.toml -> devclaw-mise) and are
      # mounted read-only so an agent cannot drift them with `mise use -g`.
      # Renovate bumps them through its native mise manager.
      mise-config:
        type: configMap
        name: devclaw-mise
        globalMounts:
          - path: /home/node/.config/mise/config.toml
            subPath: config.toml
