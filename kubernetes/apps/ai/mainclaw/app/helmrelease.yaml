---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mainclaw
spec:
  chartRef:
    kind: OCIRepository
    name: mainclaw
  interval: 1h
  # The OpenClaw gateway only starts listening on its readiness port after
  # the slow doctor/migration phase (~8+ min on a full pod recycle). Helm's
  # default 5m timeout can fail the rollout on slow startups (devclaw got
  # stuck+rolled back this way on 2026-10-23).
  # 40m, not 20m: from 2026.11.8 on, doctor may spend up to 20 min on its
  # pre-repair state capture alone when storage is slow (openclaw#192406),
  # and the gateway stays stopped for that whole time. Add the startup
  # migration, the init config copy, `mise install`, the plugin install and
  # the gateway bootstrap and 20m no longer holds. No effect on the current
  # 2026.11.7 pin: this is the margin the 2026.11.8+ doctor needs.
  # Must stay well under interval: 1h.
  timeout: 40m
  values:
    controllers:
      openclaw:
        # Explicit: the lease guard below assumes no two gateways can own the
        # state volume at once, which only holds if replacement is Recreate.
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: "mainclaw-secret, mainclaw-config"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              # Pinned to alpine:3.24 multi-arch manifest digest; parity with
              # devclaw (tag ref can stall on Docker Hub slowness).
              tag: 3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
            securityContext:
              runAsUser: 0
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                # Sticky bit on the PVC root: openclaw doctor refuses to
                # snap pre-repair state when a staging ancestor can be
                # replaced by another user ("Original state capture was
                # unavailable" + no automatic restore path). g+w must stay
                # (children like ~/.config, ~/.local are created
                # group-writable), so 3775 = setgid + sticky. Ownership is
                # set here because the pod no longer runs with an fsGroup:
                # kubelet's fsGroup pass recursively sets group rwx on the
                # whole volume, which widens OpenClaw's private stores (see
                # the client credential block below).
                chown 0:100 /home/node
                chmod 3775 /home/node
                # Kubelet recreates this emptyDir 0777 root:root on every pod
                # start. Nothing needs it writable by others, and the pod has
                # no fsGroup to tighten it.
                chown 1000:100 /openclaw-home
                # Same doctor refusal, one level down: doctor probes the temp
                # roots themselves (.cache is the default temp root,
                # .openclaw/tmp the state fallback). devclaw hit this on
                # 2026-11-16 05:09-05:47 (CrashLoopBackOff x30, "No safe
                # OpenClaw temp root is available" -> doctor could not enter
                # maintenance -> gateway exit 1). Create them if absent (kopia
                # restores exclude them), normalize ownership, then sticky:
                # 1775 = sticky + setgid + g+w.
                mkdir -p /home/node/.cache /home/node/.openclaw/tmp
                chown 1000:100 /home/node/.cache /home/node/.openclaw/tmp
                chmod 1775 /home/node/.cache /home/node/.openclaw/tmp
                mkdir -p /home/node/.openclaw
                # init creates the state dir root:root on a fresh volume (kopia
                # restores exclude it) and nothing used to fix that: the app
                # could not write there. No fsGroup means this has to be
                # explicit now.
                chown 1000:100 /home/node/.openclaw
                rm -f /home/node/.openclaw/openclaw.json
                cp /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chown 1000:100 /home/node/.openclaw/openclaw.json
                chmod 400 /home/node/.openclaw/openclaw.json
                # Retention windows, one per class of data (all globs tolerate
                # absence: kopia restores exclude these dirs):
                #   doctor captures       newest + any with a file touched < 3d
                #   state db backups      newest per class + younger than 3 days
                #   agent db backups      newest per agent + younger than 7 days
                #   legacy .sqlite.bak-*  older than 30 days
                # Capture age is measured on file content, never on the dir's
                # own mtime (a capture dir stops moving once doctor is done).
                capture_minutes=$(( 3 * 24 * 60 ))
                bak_cutoff=$(( $(date +%s) - 604800 ))
                state_bak_cutoff=$(( $(date +%s) - 259200 ))
                # No `ls`/`find` with set -e + pipefail: when the glob matches
                # nothing, ls exits 1 (stderr suppressed) and pipefail kills
                # the whole init with no output — hang the rollout (seen on
                # devclaw 2026-10-23 & 25). Compute newest by hand instead:
                # the capture dir with the highest mtime. doctor writes a
                # capture once and never touches the dir again, so the root
                # mtime only moves when a capture is created.
                newest=""
                for d in /home/node/.openclaw.update-captures/doctor-*; do
                    [ -d "$d" ] || continue
                    if [ -z "$newest" ] || [ "$(stat -c %Y "$d")" -gt "$(stat -c %Y "$newest")" ]; then
                        newest="$d"
                    fi
                done
                for d in /home/node/.openclaw.update-captures/doctor-*; do
                    [ -d "$d" ] || continue
                    if [ "$d" = "$newest" ]; then continue; fi
                    # A failed traversal must never read as "nothing recent":
                    # non-zero find keeps the capture. (2>/dev/null would merge
                    # "clean scan" and "scan error" and feed a destructive rm.)
                    recent=$(find "$d" -mmin "-$capture_minutes" -print -quit) || { echo "cannot scan $d, keeping it"; continue; }
                    if [ -n "$recent" ]; then continue; fi
                    rm -rf "$d" || true
                done
                # Prune startup-migration backups, keeping the NEWEST ONE
                # overall within each agent dir (the only automatic rollback
                # path) and everything younger than 7d. Newest-first walk
                # (not `$(ls|head)`) so an empty set can't kill the init
                # under set -e + pipefail (devclaw, 2026-10-23/25 & 27).
                for d in /home/node/.openclaw/agents/*/agent; do
                    [ -d "$d" ] || continue
                    keep=""
                    for g in "$d"/*.pre-startup-migration-*.bak; do
                        [ -e "$g" ] || continue
                        if [ -z "$keep" ] || [ "$(stat -c %Y "$g")" -gt "$(stat -c %Y "$keep")" ]; then
                            keep="$g"
                        fi
                    done
                    [ -n "$keep" ] || continue
                    for f in "$d"/*.pre-startup-migration-*.bak; do
                        [ -e "$f" ] || continue
                        if [ "$f" != "$keep" ] && [ "$(stat -c %Y "$f")" -lt "$bak_cutoff" ]; then rm -f "$f" || true; fi
                    done
                done
                # State-database backups: doctor cron runs once a day and each
                # startup migration leaves a full copy of openclaw.sqlite next
                # to the live DB (13 copies / 888M on 2026-11-23, one more per
                # restart) and nothing pruned them. Keep the newest of each
                # class plus 3 days: the DB is small (77M) but a daily cron
                # would otherwise hold a week of full copies. Only the two
                # known classes are matched; anything else stays untouched.
                prune_state_baks() {
                    local keep_bak=""
                    for g in /home/node/.openclaw/state/*"$1"*.bak; do
                        [ -e "$g" ] || continue
                        if [ -z "$keep_bak" ] || [ "$(stat -c %Y "$g")" -gt "$(stat -c %Y "$keep_bak")" ]; then
                            keep_bak="$g"
                        fi
                    done
                    [ -n "$keep_bak" ] || return 0
                    for g in /home/node/.openclaw/state/*"$1"*.bak; do
                        [ -e "$g" ] || continue
                        if [ "$g" != "$keep_bak" ] && [ "$(stat -c %Y "$g")" -lt "$state_bak_cutoff" ]; then rm -f "$g" || true; fi
                    done
                    return 0
                }
                prune_state_baks doctor-cron-
                prune_state_baks pre-startup-migration-
                # Legacy one-off sqlite snapshots (`.sqlite.bak-<date>`) do not
                # match the migration glob above and used to pile up forever
                # (one from June 2026 was still on the volume in November).
                # Deliberately age-only: the class is retired, and unlike the
                # classes above a 30-day-old snapshot is not the last line of
                # defence for anything (the live DB and the state backups are).
                find /home/node/.openclaw/agents -mindepth 1 -name '*.sqlite.bak-*' -mtime +30 -delete 2>/dev/null || true
                # Stale sqlite readonly-check temp copies (orphaned fs-safe files)
                if [ -d /home/node/.cache/openclaw ]; then
                    find /home/node/.cache/openclaw -name '.fs-safe-*.tmp' -mtime +1 -delete 2>/dev/null || true
                fi
                # Disk hygiene for everything else that grows unattended. The
                # volume was 54% full (10.9G of 20G) on 2026-11-23 with caches
                # that are re-downloadable and captures that are transient.
                # Size/mtime based (nothing still in use disappears on a
                # restart), tolerant of missing dirs, and each rule ends in
                # `|| true` so a busybox quirk can never wedge the init under
                # set -euo pipefail. npm's content-addressed cache is dropped
                # whole: a per-file prune leaves dangling index entries.
                if [ -d /home/node/.npm ]; then
                    cache_mb=$(du -s -m /home/node/.npm/_cacache 2>/dev/null | awk 'NR==1 {print $1}') || true
                    if [ -n "$cache_mb" ] && [ "$cache_mb" -gt 500 ]; then
                        echo "npm cache is $cache_mb MB: dropping ~/.npm/_cacache"
                        rm -rf /home/node/.npm/_cacache || true
                    fi
                    find /home/node/.npm/_logs -type f -mtime +7 -delete 2>/dev/null || true
                fi
                if [ -d /home/node/.openclaw/tmp/plugin-captures ]; then
                    find /home/node/.openclaw/tmp/plugin-captures -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf {} \; 2>/dev/null || true
                fi
                cp /kopiaignore/.kopiaignore /home/node/.kopiaignore
                # Parent dir for the mise config subPath mount (install-tools
                # needs it), created root:root by kubelet: give it to the app.
                mkdir -p /home/node/.config/mise
                chown 1000:100 /home/node/.config/mise
                # Kubelet also creates the NFS mount parents as root:root
                # before any container starts. Without an fsGroup nothing fixes
                # them, and uid 1000 could not even traverse into its own
                # workspace on a fresh volume. Only the parents here: chowning
                # the NFS leaves themselves would hit root-squash.
                mkdir -p /home/node/.openclaw/workspace/mnt
                chown 1000:100 /home/node/.openclaw/workspace /home/node/.openclaw/workspace/mnt
                # Channel credential state: keep it owner-only (audit check
                # fs.credentials_dir.perms_readable / _writable)
                mkdir -p /home/node/.openclaw/credentials
                chown 1000:100 /home/node/.openclaw/credentials
                chmod 700 /home/node/.openclaw/credentials
                # Local client credential store (device identities + keys,
                # per-role tokens, native exec socket token) at
                # ~/.openclaw/client/credentials.sqlite. The gateway refuses to
                # read it unless the DIRECTORY is owned by its uid and mode
                # 0700, and the file 0600, with a message that names neither
                # the path nor a fix: "Client credential directory is
                # unsafe." (mainclaw, 2026-11-24 — every agent command failed
                # with it and a chmod on ~/.config/op could not help).
                # OpenClaw only re-applies those modes at gateway startup, so
                # any directory recreated at runtime comes back 2755 under this
                # setgid + g+w PVC root and stays broken until a restart.
                # Normalize on every boot, before the gateway reads it.
                mkdir -p /home/node/.openclaw/client
                chown 1000:100 /home/node/.openclaw/client
                chmod 700 /home/node/.openclaw/client
                # The database and whatever sqlite sidecars an unclean shutdown
                # left behind (-wal / -shm / -journal) are part of the same
                # private store; the directory mode is the real bound, this
                # just keeps the files consistent with it.
                for store in credentials.sqlite credentials.sqlite-wal credentials.sqlite-shm credentials.sqlite-journal; do
                    [ -f "/home/node/.openclaw/client/$store" ] || continue
                    chown 1000:100 "/home/node/.openclaw/client/$store"
                    chmod 600 "/home/node/.openclaw/client/$store"
                done
          install-tools:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.11.7@sha256:461cc655301409901f2df11d6ec9f029f9709e4607826e9780fd74f8e1d12a16
            env:
              HOME: /home/node
              PATH: /home/node/.local/bin:/home/node/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              MISE_YES: "1"
            command:
              - /bin/sh
              - -c
              - |
                # NOTE: /bin/sh in the openclaw image is dash — no `set -o pipefail`
                set -eu
                # Reinstall mise after a PVC restore; skip when present (normal restarts stay offline)
                if [ ! -f /home/node/.local/bin/mise ]; then
                  echo "Installing Mise..."
                  curl -fsSL https://mise.run | MISE_INSTALL_PATH=/home/node/.local/bin/mise sh
                fi
                # Install every tool declared in the shadowed global config; idempotent
                mise self-update -y
                mise install -y
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.11.7@sha256:461cc655301409901f2df11d6ec9f029f9709e4607826e9780fd74f8e1d12a16
            # The gateway does not listen on 18789 until the doctor phase
            # and gateway bootstrap have completed (~2-3 min warm boot, with
            # margin for a cold boot from a restored PVC); keep the pod
            # NotReady until then so Envoy does not route to a dead upstream
            probes:
              readiness:
                custom: true
                spec:
                  tcpSocket:
                    port: 18789
                  periodSeconds: 15
                  timeoutSeconds: 5
                  # 24 * 15s = 6 min of grace before marking unready
                  failureThreshold: 24
            command:
              - /bin/sh
              - -c
              - |
                # Install the memini memory plugin from ClawHub, version-guarded:
                # only fetches when the pinned version differs from what's on the
                # persistent volume, so normal restarts stay offline.
                # Renovate tracks the plugin version against the ClawHub
                # npm-compatible registry and groups it with the memini chart
                # update so both stay aligned; the guard below keeps restarts
                # offline and warns instead of failing on a transient drift.
                # renovate: clawhub:@eleboucher/memini registryUrl=https://clawhub.ai/api/npm
                MEMINI_PLUGIN_VERSION=0.7.39
                # Strip the chart tag prefix at runtime; braced shell expansion does not survive
                # the Flux postBuild variable substitution
                MEMINI_PLUGIN_REL=$(printf '%s' "$MEMINI_PLUGIN_VERSION" | sed 's/^v//')
                if [ "$(cat "$HOME/.openclaw/extensions/memini/.clawver" 2>/dev/null)" != "$MEMINI_PLUGIN_REL" ]; then
                  if node /app/openclaw.mjs plugins install "clawhub:@eleboucher/memini@$MEMINI_PLUGIN_REL" --force; then
                    printf '%s' "$MEMINI_PLUGIN_REL" > "$HOME/.openclaw/extensions/memini/.clawver"
                  else
                    echo "WARN: memini plugin install failed; starting with whatever is present"
                  fi
                fi
                # Re-sync the config from the secret mount before doctor/gateway:
                # the init container may have copied a stale secret version when
                # the pod is created right after a secret update (kubelet cache
                # propagation race) — the mount settles during init/tools phase.
                cp -f /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chown 1000:100 /home/node/.openclaw/openclaw.json
                chmod 400 /home/node/.openclaw/openclaw.json
                # Gateway lease guard: a pod killed before it can stop the
                # gateway (e.g. its init failing on a transient read-only
                # mount, 2026-11-20) leaves the state lease recorded against a
                # pod name + PID namespace that no later pod can verify, so
                # every replacement is refused ("cannot verify Gateway
                # ownership from this process; heartbeat age does not prove
                # that the holder stopped") and the gateway exits 1 after
                # waiting 95 s — a crash loop only an explicit recover-lock
                # clears. Opt-in, and still safe: recover-lock refuses a
                # holder it can verify as alive, and this workload runs
                # Recreate on a RWO volume, so only one pod can own the state.
                # Unbraced on purpose: braced expansion is eaten by Flux
                # postBuild substitution (same reason as MEMINI above).
                if [ "$OPENCLAW_AUTO_RECOVER_LOCK" = "true" ]; then
                  lock_fp="$(node /app/openclaw.mjs gateway recover-lock --json 2>/dev/null \
                    | tr -d '\n' \
                    | grep -oE '"confirmation"[[:space:]]*:[[:space:]]*"[0-9a-f]{64}"' \
                    | grep -oE '[0-9a-f]{64}' || true)"
                  if [ -n "$lock_fp" ]; then
                    echo "Recovering unverifiable Gateway lease ($lock_fp)"
                    node /app/openclaw.mjs gateway recover-lock --confirm "$lock_fp" \
                      || echo "WARN: recover-lock refused; continuing with a live holder"
                  fi
                fi
                # Doctor check and fix any issues with the OpenClaw installation, then start the gateway.
                # `--fix` authorizes unattended repairs (since openclaw#191523 a bare doctor
                # no longer installs the plugin packages it finds missing, so the flag is
                # load-bearing); `--non-interactive` makes the intent explicit so no repair
                # can block on a prompt even if the container is ever started with a TTY.
                node /app/openclaw.mjs doctor --fix --non-interactive \
                  || echo "WARN: doctor exited nonzero; continuing"
                # Start gateway
                echo "Starting OpenClaw gateway..."
                exec node /app/openclaw.mjs gateway
            env:
              OPENCLAW_LOG_LEVEL: info
              # Reclaim a Gateway lease left behind by a pod that died before
              # it could stop the gateway; see the guard in the command.
              OPENCLAW_AUTO_RECOVER_LOCK: "true"
              GOPATH: /home/node/go
              HOME: /home/node
              OPENCLAW_GATEWAY_PORT: 18789
              PATH: /home/node/.local/bin:/home/node/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              TERM: xterm-256color
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 4000m
                # 2026-09-25 OOM (anon burst to 3.93 Gi, cgroup failcnt 3151 in 15h):
                # steady-state grew ~2.2 Gi with 11 agents; 4Gi left no burst headroom.
                memory: 6Gi

          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.146.0@sha256:fc708b18f6c613b5a9d00f1d1801e58376d3df9c5b5de77f5c02d67b711f99c9
            env:
              TZ: Europe/Paris
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/home/node/.vscode",
                "--extensions-dir",
                "/home/node/.vscode",
                "--port",
                "12321",
                "/config"
              ]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: true
      # Give the gateway time to stop cleanly and release its state lease;
      # a pod killed mid-shutdown leaves a lock the next pod cannot claim.
      terminationGracePeriodSeconds: 60
      # Prefer the dedicated AI worker (k8s-3) but stay schedulable on any
      # node if it is unavailable; the toleration unlocks the
      # workload=ai:NoSchedule taint on k8s-3 (other nodes are untainted).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-3]
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      # No fsGroup on purpose. Kubelet's fsGroup pass sets group rwx
      # recursively on the state volume, and an fsGroup volume remount is the
      # documented way OpenClaw's private stores get widened (upstream docs,
      # "Private storage after a volume remount", v2026.11.7). The client
      # credential directory must stay 0700: the gateway throws "Client
      # credential directory is unsafe." and, on 2026-11-24, every agent
      # command failed until the pod was restarted. The startup repair refuses
      # foreign owners and world-access bits, so it cannot be relied on
      # either. The root init container sets the ownership/modes instead —
      # PVC root, state dir, the mount parents kubelet creates, and the
      # private stores. Anything restored from a kopiur snapshot may come back
      # group-writable (the mover mounts a staging copy with its own fsGroup);
      # the init normalizes it on the pod start that follows the restore.
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
    service:
      app:
        type: ClusterIP
        ports:
          http:
            port: 18789
          codeserver:
            port: 12321
    route:
      main:
        hostnames:
          - "mainclaw.oxygn.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 18789
      codeserver:
        hostnames:
          - "mainclaw-code.oxygn.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 12321
    persistence:
      openclaw-home:
        type: emptyDir
      # openclaw#153067 tmpfs staging workaround removed 2026-09-25: the fix
      # ships in 2026.9.6 (issue closed upstream 2026-09-20); steady-state
      # staging activity verified stopped in-cluster (0 staging files over
      # 150 × 0.2s samples, cgroup shmem 0). ~/.cache/* now lives on the
      # openclaw-home emptyDir.
      kopiaignore:
        type: configMap
        name: mainclaw-kopiaignore
        globalMounts:
          - path: /kopiaignore
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/node
      pictures:
        type: nfs
        server: funkstation.internal
        path: /volume2/Pictures
        globalMounts:
          - path: /home/node/.openclaw/workspace/mnt/pictures
      pellicule:
        type: nfs
        server: funkstation.internal
        path: /volume2/Pellicule/Matt
        globalMounts:
          - path: /home/node/.openclaw/workspace/mnt/pellicule
      openclaw-config:
        type: secret
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/openclaw.json
            subPath: openclaw.json
      mise-config:
        type: configMap
        name: mainclaw-mise
        globalMounts:
          - path: /home/node/.config/mise/config.toml
            subPath: config.toml
