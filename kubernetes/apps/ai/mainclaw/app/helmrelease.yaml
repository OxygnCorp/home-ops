---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mainclaw
spec:
  chartRef:
    kind: OCIRepository
    name: mainclaw
  interval: 1h
  # The OpenClaw gateway only starts listening on its readiness port after
  # the slow doctor/migration phase (~8+ min on a full pod recycle). Helm's
  # default 5m timeout can fail the rollout on slow startups (devclaw got
  # stuck+rolled back this way on 2026-10-23); 20m leaves sane margin.
  timeout: 20m
  values:
    controllers:
      openclaw:
        annotations:
          secret.reloader.stakater.com/reload: "mainclaw-secret, mainclaw-config"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              # Pinned to alpine:3.24 multi-arch manifest digest; parity with
              # devclaw (tag ref can stall on Docker Hub slowness).
              tag: 3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            securityContext:
              runAsUser: 0
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                # Sticky bit on the PVC root: openclaw doctor refuses to
                # snap pre-repair state when a staging ancestor can be
                # replaced by another user ("Original state capture was
                # unavailable" + no automatic restore path). g+w must stay
                # (fsGroup children like ~/.config, ~/.local are created
                # group-writable), so 3775 = setgid + sticky.
                chmod 3775 /home/node
                mkdir -p /home/node/.openclaw
                rm -f /home/node/.openclaw/openclaw.json
                cp /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chown 1000:100 /home/node/.openclaw/openclaw.json
                chmod 400 /home/node/.openclaw/openclaw.json
                # Retention: doctor creates a full recovery capture (~750M of
                # agent sqlite) on every repair run and never prunes them; with
                # frequent pod restarts the PVC filled to 91% (2026-10-23).
                # Always keep the newest capture (the only automatic rollback
                # path) plus everything younger than 7 days. All globs/searches
                # tolerate absence: kopia restores now exclude these dirs.
                cutoff=$(( $(date +%s) - 604800 ))
                # No `ls`/`find` with set -e + pipefail: when the glob matches
                # nothing, ls exits 1 (stderr suppressed) and pipefail kills
                # the whole init with no output — hang the rollout (seen on
                # devclaw 2026-10-23 & 25). Compute newest by hand instead.
                newest=""
                for d in /home/node/.openclaw.update-captures/doctor-*; do
                    [ -d "$d" ] || continue
                    if [ -z "$newest" ] || [ "$(stat -c %Y "$d")" -gt "$(stat -c %Y "$newest")" ]; then
                        newest="$d"
                    fi
                done
                for d in /home/node/.openclaw.update-captures/doctor-*; do
                    [ -d "$d" ] || continue
                    if [ "$d" = "$newest" ]; then continue; fi
                    if [ "$(stat -c %Y "$d")" -lt "$cutoff" ]; then rm -rf "$d"; fi
                done
                # Prune startup-migration backups, keeping the NEWEST ONE
                # overall within each agent dir (the only automatic rollback
                # path) and everything younger than 7d. Newest-first walk
                # (not `$(ls|head)`) so an empty set can't kill the init
                # under set -e + pipefail (devclaw, 2026-10-23/25 & 27).
                for d in /home/node/.openclaw/agents/*/agent; do
                    [ -d "$d" ] || continue
                    keep=""
                    for g in "$d"/*.pre-startup-migration-*.bak; do
                        [ -e "$g" ] || continue
                        if [ -z "$keep" ] || [ "$(stat -c %Y "$g")" -gt "$(stat -c %Y "$keep")" ]; then
                            keep="$g"
                        fi
                    done
                    [ -n "$keep" ] || continue
                    for f in "$d"/*.pre-startup-migration-*.bak; do
                        [ -e "$f" ] || continue
                        if [ "$f" != "$keep" ] && [ "$(stat -c %Y "$f")" -lt "$cutoff" ]; then rm -f "$f"; fi
                    done
                done
                # Stale sqlite readonly-check temp copies (orphaned fs-safe files)
                if [ -d /home/node/.cache/openclaw ]; then
                    find /home/node/.cache/openclaw -name '.fs-safe-*.tmp' -mtime +1 -delete 2>/dev/null || true
                fi
                cp /kopiaignore/.kopiaignore /home/node/.kopiaignore
                # Parent dir for the mise config subPath mount (install-tools needs it)
                mkdir -p /home/node/.config/mise
                # Channel credential state: keep it owner-only (audit check
                # fs.credentials_dir.perms_readable / _writable)
                mkdir -p /home/node/.openclaw/credentials
                chown 1000:100 /home/node/.openclaw/credentials
                chmod 700 /home/node/.openclaw/credentials
          install-tools:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.10.6@sha256:7dbff0fe5f5359b1badefe90a23efa9f203cd0d3c36bee095f4896c7a1d3864b
            env:
              HOME: /home/node
              PATH: /home/node/.local/bin:/home/node/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              MISE_YES: "1"
            command:
              - /bin/sh
              - -c
              - |
                # NOTE: /bin/sh in the openclaw image is dash — no `set -o pipefail`
                set -eu
                # Reinstall mise after a PVC restore; skip when present (normal restarts stay offline)
                if [ ! -f /home/node/.local/bin/mise ]; then
                  echo "Installing Mise..."
                  curl -fsSL https://mise.run | MISE_INSTALL_PATH=/home/node/.local/bin/mise sh
                fi
                # Install every tool declared in the shadowed global config; idempotent
                mise self-update -y
                mise install -y
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.10.6@sha256:7dbff0fe5f5359b1badefe90a23efa9f203cd0d3c36bee095f4896c7a1d3864b
            # The gateway does not listen on 18789 until the doctor phase
            # and gateway bootstrap have completed (~2-3 min warm boot, with
            # margin for a cold boot from a restored PVC); keep the pod
            # NotReady until then so Envoy does not route to a dead upstream
            probes:
              readiness:
                custom: true
                spec:
                  tcpSocket:
                    port: 18789
                  periodSeconds: 15
                  timeoutSeconds: 5
                  # 24 * 15s = 6 min of grace before marking unready
                  failureThreshold: 24
            command:
              - /bin/sh
              - -c
              - |
                # Install the memini memory plugin from ClawHub, version-guarded:
                # only fetches when the pinned version differs from what's on the
                # persistent volume, so normal restarts stay offline.
                # Renovate tracks the plugin version against the ClawHub
                # npm-compatible registry and groups it with the memini chart
                # update so both stay aligned; the guard below keeps restarts
                # offline and warns instead of failing on a transient drift.
                # renovate: clawhub:@eleboucher/memini registryUrl=https://clawhub.ai/api/npm
                MEMINI_PLUGIN_VERSION=0.7.37
                # Strip the chart tag prefix at runtime; braced shell expansion does not survive
                # the Flux postBuild variable substitution
                MEMINI_PLUGIN_REL=$(printf '%s' "$MEMINI_PLUGIN_VERSION" | sed 's/^v//')
                if [ "$(cat "$HOME/.openclaw/extensions/memini/.clawver" 2>/dev/null)" != "$MEMINI_PLUGIN_REL" ]; then
                  if node /app/openclaw.mjs plugins install "clawhub:@eleboucher/memini@$MEMINI_PLUGIN_REL" --force; then
                    printf '%s' "$MEMINI_PLUGIN_REL" > "$HOME/.openclaw/extensions/memini/.clawver"
                  else
                    echo "WARN: memini plugin install failed; starting with whatever is present"
                  fi
                fi
                # Re-sync the config from the secret mount before doctor/gateway:
                # the init container may have copied a stale secret version when
                # the pod is created right after a secret update (kubelet cache
                # propagation race) — the mount settles during init/tools phase.
                cp -f /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chown 1000:100 /home/node/.openclaw/openclaw.json
                chmod 400 /home/node/.openclaw/openclaw.json
                # Doctor check and fix any issues with the OpenClaw installation, then start the gateway
                node /app/openclaw.mjs doctor --fix
                # Start gateway
                echo "Starting OpenClaw gateway..."
                exec node /app/openclaw.mjs gateway
            env:
              OPENCLAW_LOG_LEVEL: info
              GOPATH: /home/node/go
              HOME: /home/node
              OPENCLAW_GATEWAY_PORT: 18789
              PATH: /home/node/.local/bin:/home/node/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              TERM: xterm-256color
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 4000m
                # 2026-09-25 OOM (anon burst to 3.93 Gi, cgroup failcnt 3151 in 15h):
                # steady-state grew ~2.2 Gi with 11 agents; 4Gi left no burst headroom.
                memory: 6Gi

          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.141.0@sha256:72ab24b5680ee597dd647b30d82625752f40109b5f61bef90ffbf1ea1f02dbb8
            env:
              TZ: Europe/Paris
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/home/node/.vscode",
                "--extensions-dir",
                "/home/node/.vscode",
                "--port",
                "12321",
                "/config"
              ]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: true
      # Prefer the dedicated AI worker (k8s-3) but stay schedulable on any
      # node if it is unavailable; the toleration unlocks the
      # workload=ai:NoSchedule taint on k8s-3 (other nodes are untainted).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-3]
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: ClusterIP
        ports:
          http:
            port: 18789
          codeserver:
            port: 12321
    route:
      main:
        hostnames:
          - "mainclaw.oxygn.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 18789
      codeserver:
        hostnames:
          - "mainclaw-code.oxygn.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 12321
    persistence:
      openclaw-home:
        type: emptyDir
      # openclaw#153067 tmpfs staging workaround removed 2026-09-25: the fix
      # ships in 2026.9.6 (issue closed upstream 2026-09-20); steady-state
      # staging activity verified stopped in-cluster (0 staging files over
      # 150 × 0.2s samples, cgroup shmem 0). ~/.cache/* now lives on the
      # openclaw-home emptyDir.
      kopiaignore:
        type: configMap
        name: mainclaw-kopiaignore
        globalMounts:
          - path: /kopiaignore
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/node
      pictures:
        type: nfs
        server: funkstation.internal
        path: /volume2/Pictures
        globalMounts:
          - path: /home/node/.openclaw/workspace/mnt/pictures
      pellicule:
        type: nfs
        server: funkstation.internal
        path: /volume2/Pellicule/Matt
        globalMounts:
          - path: /home/node/.openclaw/workspace/mnt/pellicule
      openclaw-config:
        type: secret
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/openclaw.json
            subPath: openclaw.json
      mise-config:
        type: configMap
        name: mainclaw-mise
        globalMounts:
          - path: /home/node/.config/mise/config.toml
            subPath: config.toml
