---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mainclaw
spec:
  chartRef:
    kind: OCIRepository
    name: mainclaw
  interval: 1h
  values:
    controllers:
      openclaw:
        annotations:
          secret.reloader.stakater.com/reload: "mainclaw-secret, mainclaw-config"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            # Runs as root to chown the tmpfs staging mounts below:
            # openclaw requires its temp dirs to be owned by the runtime uid
            # (st_uid === euid check in managed-handoff-runtime), and kubelet
            # creates emptyDir tmpfs root-owned — the gateway hard-fails with
            # "Unsafe fallback OpenClaw temp dir" otherwise.
            securityContext:
              runAsUser: 0
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /home/node/.openclaw
                rm -f /home/node/.openclaw/openclaw.json
                cp /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chown 1000:100 /home/node/.openclaw/openclaw.json
                chmod 400 /home/node/.openclaw/openclaw.json
                cp /kopiaignore/.kopiaignore /home/node/.kopiaignore
                # Parent dir for the mise config subPath mount (install-tools needs it)
                mkdir -p /home/node/.config/mise
                # Secure the tmpfs sqlite-snapshot staging roots (openclaw#153067 workaround)
                for tmpdir in /home/node/.cache/openclaw /home/node/.cache/openclaw-1000; do
                  mkdir -p "$tmpdir"
                  chown 1000:100 "$tmpdir"
                  chmod 700 "$tmpdir"
                done
          install-tools:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.9.5@sha256:ea298b62be8955d3ef750e2004a610dd90c3a30e5f9886e5d654d78a0c573218
            env:
              HOME: /home/node
              PATH: /home/node/.local/bin:/home/node/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              MISE_YES: "1"
            command:
              - /bin/sh
              - -c
              - |
                # NOTE: /bin/sh in the openclaw image is dash — no `set -o pipefail`
                set -eu
                # Reinstall mise after a PVC restore; skip when present (normal restarts stay offline)
                if [ ! -f /home/node/.local/bin/mise ]; then
                  echo "Installing Mise..."
                  curl -fsSL https://mise.run | MISE_INSTALL_PATH=/home/node/.local/bin/mise sh
                fi
                # Install every tool declared in the shadowed global config; idempotent
                mise self-update -y
                mise install -y
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.9.5@sha256:ea298b62be8955d3ef750e2004a610dd90c3a30e5f9886e5d654d78a0c573218
            # The gateway only listens on 18789 after a slow doctor/migration
            # phase (~8 min); keep the pod NotReady until then so Envoy does
            # not route to a dead upstream during rollouts
            probes:
              readiness:
                custom: true
                spec:
                  tcpSocket:
                    port: 18789
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 60
            command:
              - /bin/sh
              - -c
              - |
                # Install the memini memory plugin from ClawHub, version-guarded:
                # only fetches when the pinned version differs from what's on the
                # persistent volume, so normal restarts stay offline.
                # Renovate tracks the plugin version against the ClawHub
                # npm-compatible registry and groups it with the memini chart
                # update so both stay aligned; the guard below keeps restarts
                # offline and warns instead of failing on a transient drift.
                # renovate: clawhub:@eleboucher/memini registryUrl=https://clawhub.ai/api/npm
                MEMINI_PLUGIN_VERSION=v0.7.32
                # Strip the chart tag prefix at runtime; braced shell expansion does not survive
                # the Flux postBuild variable substitution
                MEMINI_PLUGIN_REL=$(printf '%s' "$MEMINI_PLUGIN_VERSION" | sed 's/^v//')
                if [ "$(cat "$HOME/.openclaw/extensions/memini/.clawver" 2>/dev/null)" != "$MEMINI_PLUGIN_REL" ]; then
                  if node /app/openclaw.mjs plugins install "clawhub:@eleboucher/memini@$MEMINI_PLUGIN_REL" --force; then
                    printf '%s' "$MEMINI_PLUGIN_REL" > "$HOME/.openclaw/extensions/memini/.clawver"
                  else
                    echo "WARN: memini plugin install failed; starting with whatever is present"
                  fi
                fi
                # Re-sync the config from the secret mount before doctor/gateway:
                # the init container may have copied a stale secret version when
                # the pod is created right after a secret update (kubelet cache
                # propagation race) — the mount settles during init/tools phase.
                cp -f /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chown 1000:100 /home/node/.openclaw/openclaw.json
                chmod 400 /home/node/.openclaw/openclaw.json
                # Doctor check and fix any issues with the OpenClaw installation, then start the gateway
                node /app/openclaw.mjs doctor --fix
                # Start gateway
                echo "Starting OpenClaw gateway..."
                exec node /app/openclaw.mjs gateway
            env:
              OPENCLAW_LOG_LEVEL: info
              GOPATH: /home/node/go
              HOME: /home/node
              OPENCLAW_GATEWAY_PORT: 18789
              PATH: /home/node/.local/bin:/home/node/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              TERM: xterm-256color
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 4Gi

          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.138.0@sha256:81706b71ace316157850cbcfb574714d1067249c107a415b3a03dc6b613ebfbc
            env:
              TZ: Europe/Paris
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/home/node/.vscode",
                "--extensions-dir",
                "/home/node/.vscode",
                "--port",
                "12321",
                "/config"
              ]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: ClusterIP
        ports:
          http:
            port: 18789
          codeserver:
            port: 12321
    route:
      main:
        hostnames:
          - "mainclaw.oxygn.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 18789
      codeserver:
        hostnames:
          - "mainclaw-code.oxygn.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 12321
    persistence:
      openclaw-home:
        type: emptyDir
      # openclaw#153067 (fixed after 2026.9.5): in steady state the gateway
      # re-copies the whole state DB (66 MB) into ~/.cache/openclaw every few
      # seconds while catalog/auth refreshes run, hammering the DRBD-backed
      # PVC (measured ~458 GB/day). Upstream's documented workaround is to
      # stage that regenerable cache on tmpfs (−99.5% device writes).
      # Remove once the post-2026.9.5 fix ships.
      openclaw-cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /home/node/.cache/openclaw
      # The gateway buckets this staging cache per-uid and falls back to
      # ~/.cache/openclaw-<uid> when the primary dir isn't owned by the
      # runtime user (the tmpfs mount above is root-owned); stage that
      # fallback root on tmpfs too or the snapshot copies land back on the
      # DRBD-backed PVC (observed live).
      openclaw-cache-uid:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /home/node/.cache/openclaw-1000
      kopiaignore:
        type: configMap
        name: mainclaw-kopiaignore
        globalMounts:
          - path: /kopiaignore
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/node
      pictures:
        type: nfs
        server: funkstation.internal
        path: /volume2/Pictures
        globalMounts:
          - path: /home/node/.openclaw/workspace/mnt/pictures
      pellicule:
        type: nfs
        server: funkstation.internal
        path: /volume2/Pellicule/Matt
        globalMounts:
          - path: /home/node/.openclaw/workspace/mnt/pellicule
      openclaw-config:
        type: secret
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/openclaw.json
            subPath: openclaw.json
      mise-config:
        type: configMap
        name: mainclaw-mise
        globalMounts:
          - path: /home/node/.config/mise/config.toml
            subPath: config.toml
