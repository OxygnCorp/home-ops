---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mainclaw
spec:
  chartRef:
    kind: OCIRepository
    name: mainclaw
  interval: 1h
  values:
    controllers:
      openclaw:
        annotations:
          secret.reloader.stakater.com/reload: "mainclaw-secret, mainclaw-config"
          configmap.reloader.stakater.com/reload: "mainclaw-configmap"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /home/node/.openclaw
                rm -f /home/node/.openclaw/openclaw.json
                cp /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chown 1000:100 /home/node/.openclaw/openclaw.json
                chmod 400 /home/node/.openclaw/openclaw.json
                cp /kopiaignore/.kopiaignore /home/node/.kopiaignore
                # Parent dir for the mise config subPath mount (install-tools needs it)
                mkdir -p /home/node/.config/mise
          install-tools:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.8.2@sha256:5d25165995041caa6a7175bec82b25ad98c44eb269bb42435da8e27ec06e6be4
            env:
              HOME: /home/node
              PATH: /home/node/.local/bin:/home/node/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              MISE_YES: "1"
            command:
              - /bin/sh
              - -c
              - |
                # NOTE: /bin/sh in the openclaw image is dash — no `set -o pipefail`
                set -eu
                # Reinstall mise after a PVC restore; skip when present (normal restarts stay offline)
                if [ ! -f /home/node/.local/bin/mise ]; then
                  echo "Installing Mise..."
                  curl -fsSL https://mise.run | MISE_INSTALL_PATH=/home/node/.local/bin/mise sh
                fi
                # Install every tool declared in the shadowed global config; idempotent
                mise self-update -y
                mise install -y
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.8.2@sha256:5d25165995041caa6a7175bec82b25ad98c44eb269bb42435da8e27ec06e6be4
            command:
              - /bin/sh
              - -c
              - |
                # Install the memini memory plugin from ClawHub, version-guarded:
                # only fetches when the pinned version differs from what's on the
                # persistent volume, so normal restarts stay offline.
                # renovate: datasource=docker depName=registry.erwanleboucher.dev/eleboucher/charts/memini
                MEMINI_PLUGIN_VERSION=v0.7.23
                # Strip the chart tag prefix at runtime; braced shell expansion does not survive
                # the Flux postBuild variable substitution
                MEMINI_PLUGIN_REL=$(printf '%s' "$MEMINI_PLUGIN_VERSION" | sed 's/^v//')
                if [ "$(cat "$HOME/.openclaw/extensions/memini/.clawver" 2>/dev/null)" != "$MEMINI_PLUGIN_REL" ]; then
                  if node dist/index.js plugins install "clawhub:@eleboucher/memini@$MEMINI_PLUGIN_REL" --pin --force; then
                    printf '%s' "$MEMINI_PLUGIN_REL" > "$HOME/.openclaw/extensions/memini/.clawver"
                  else
                    echo "WARN: memini plugin install failed; starting with whatever is present"
                  fi
                fi
                # Doctor check and fix any issues with the OpenClaw installation, then start the gateway
                node dist/index.js doctor --fix
                # Start gateway
                echo "Starting OpenClaw gateway..."
                exec node dist/index.js gateway
            env:
              OPENCLAW_LOG_LEVEL: debug
              GOPATH: /home/node/go
              HOME: /home/node
              OPENCLAW_GATEWAY_PORT: 18789
              PATH: /home/node/.local/bin:/home/node/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              TERM: xterm-256color
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 4Gi

          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.135.0@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012
            env:
              TZ: Europe/Paris
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/home/node/.vscode",
                "--extensions-dir",
                "/home/node/.vscode",
                "--port",
                "12321",
                "/config"
              ]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.10.98.191
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: 18789
          codeserver:
            port: 12321
    route:
      main:
        hostnames:
          - "mainclaw.oxygn.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 18789
      codeserver:
        hostnames:
          - "mainclaw-code.oxygn.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 12321
    persistence:
      openclaw-home:
        type: emptyDir
      kopiaignore:
        type: configMap
        name: mainclaw-kopiaignore
        globalMounts:
          - path: /kopiaignore
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/node
      pictures:
        type: nfs
        server: funkstation.internal
        path: /volume2/Pictures
        globalMounts:
          - path: /home/node/.openclaw/workspace/mnt/pictures
      pellicule:
        type: nfs
        server: funkstation.internal
        path: /volume2/Pellicule/Matt
        globalMounts:
          - path: /home/node/.openclaw/workspace/mnt/pellicule
      openclaw-config:
        type: secret
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/openclaw.json
            subPath: openclaw.json
      mise-config:
        type: configMap
        name: mainclaw-mise
        globalMounts:
          - path: /home/node/.config/mise/config.toml
            subPath: config.toml
