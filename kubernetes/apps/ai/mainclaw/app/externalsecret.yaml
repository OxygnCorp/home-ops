---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mainclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mainclaw-secret
    template:
      engineVersion: v2
      data:
        ## Gateway token for authentication
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
        ## Discord
        DISCORD_BOT_TOKEN: "{{ .DISCORD_BOT_TOKEN }}"
        DISCORD_GUILD_ID: "{{ .DISCORD_GUILD_ID }}"
        DISCORD_CLAW_CHANNEL_ID: "{{ .DISCORD_CLAW_CHANNEL_ID }}"
        DISCORD_FAMILY_CHANNEL_ID: "{{ .DISCORD_FAMILY_CHANNEL_ID }}"
        DISCORD_COACH_CHANNEL_ID: "{{ .DISCORD_COACH_CHANNEL_ID }}"
        DISCORD_FINANCE_CHANNEL_ID: "{{ .DISCORD_FINANCE_CHANNEL_ID }}"
        DISCORD_SHOPPING_CHANNEL_ID: "{{ .DISCORD_SHOPPING_CHANNEL_ID }}"
        DISCORD_NOVA_CHANNEL_ID: "{{ .DISCORD_NOVA_CHANNEL_ID }}"
        DISCORD_MEDIA_CHANNEL_ID: "{{ .DISCORD_MEDIA_CHANNEL_ID }}"
        DISCORD_LYCOS_CHANNEL_ID: "{{ .DISCORD_LYCOS_CHANNEL_ID }}"
        DISCORD_LEGAL_CHANNEL_ID: "{{ .DISCORD_LEGAL_CHANNEL_ID }}"
        DISCORD_ELINA_CHANNEL_ID: "{{ .DISCORD_ELINA_CHANNEL_ID }}"
        DISCORD_ELLIOT_CHANNEL_ID: "{{ .DISCORD_ELLIOT_CHANNEL_ID }}"
        DISCORD_CLAW_PROJECT_FORUM: "{{ .DISCORD_CLAW_PROJECT_FORUM }}"
        DISCORD_NOVA_PROJECT_FORUM: "{{ .DISCORD_NOVA_PROJECT_FORUM }}"
        DISCORD_MATT_USER_ID: "{{ .DISCORD_MATT_USER_ID }}"
        DISCORD_AGNES_USER_ID: "{{ .DISCORD_AGNES_USER_ID }}"
        ## Litellm
        LITELLM_API_KEY: "{{ .LITELLM_MAINCLAW_API_KEY }}"
        ## Litellm per-agent keys
        LITELLM_API_KEY_MAINCLAW_MAIN: "{{ .LITELLM_API_KEY_MAINCLAW_MAIN }}"
        LITELLM_API_KEY_MAINCLAW_FAMILY: "{{ .LITELLM_API_KEY_MAINCLAW_FAMILY }}"
        LITELLM_API_KEY_MAINCLAW_COACH: "{{ .LITELLM_API_KEY_MAINCLAW_COACH }}"
        LITELLM_API_KEY_MAINCLAW_FINANCE: "{{ .LITELLM_API_KEY_MAINCLAW_FINANCE }}"
        LITELLM_API_KEY_MAINCLAW_SHOPPING: "{{ .LITELLM_API_KEY_MAINCLAW_SHOPPING }}"
        LITELLM_API_KEY_MAINCLAW_MEDIA: "{{ .LITELLM_API_KEY_MAINCLAW_MEDIA }}"
        LITELLM_API_KEY_MAINCLAW_NOVA: "{{ .LITELLM_API_KEY_MAINCLAW_NOVA }}"
        LITELLM_API_KEY_MAINCLAW_LYCOS: "{{ .LITELLM_API_KEY_MAINCLAW_LYCOS }}"
        LITELLM_API_KEY_MAINCLAW_LEGAL: "{{ .LITELLM_API_KEY_MAINCLAW_LEGAL }}"
        LITELLM_API_KEY_MAINCLAW_ELINA: "{{ .LITELLM_API_KEY_MAINCLAW_ELINA }}"
        LITELLM_API_KEY_MAINCLAW_ELLIOT: "{{ .LITELLM_API_KEY_MAINCLAW_ELLIOT }}"
        ## Memini
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        ## Brave
        BRAVE_API_KEY: "{{ .BRAVE_API_KEY }}"
        ## 1password
        OP_SERVICE_ACCOUNT_TOKEN: "{{ .OP_SERVICE_ACCOUNT_TOKEN }}"

  data:
    - secretKey: LITELLM_MAINCLAW_API_KEY
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW
    - secretKey: LITELLM_API_KEY_MAINCLAW_MAIN
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_MAIN
    - secretKey: LITELLM_API_KEY_MAINCLAW_FAMILY
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_FAMILY
    - secretKey: LITELLM_API_KEY_MAINCLAW_COACH
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_COACH
    - secretKey: LITELLM_API_KEY_MAINCLAW_FINANCE
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_FINANCE
    - secretKey: LITELLM_API_KEY_MAINCLAW_SHOPPING
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_SHOPPING
    - secretKey: LITELLM_API_KEY_MAINCLAW_MEDIA
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_MEDIA
    - secretKey: LITELLM_API_KEY_MAINCLAW_NOVA
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_NOVA
    - secretKey: LITELLM_API_KEY_MAINCLAW_LYCOS
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_LYCOS
    - secretKey: LITELLM_API_KEY_MAINCLAW_LEGAL
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_LEGAL
    - secretKey: LITELLM_API_KEY_MAINCLAW_ELINA
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_ELINA
    - secretKey: LITELLM_API_KEY_MAINCLAW_ELLIOT
      remoteRef:
        key: litellm
        property: KEY_MAINCLAW_ELLIOT
  dataFrom:
    # The litellm item is deliberately NOT extracted wholesale: that would
    # copy every app's virtual key into this pod's environment. The fields
    # this app needs are mapped explicitly in spec.data above.
    - extract:
        key: mainclaw
    - extract:
        key: memini
    - extract:
        key: brave
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mainclaw-config
spec:
  # align with the documented 12h default (external-secrets only rewrites
  # the Secret on actual change, so 1m was mostly just extra resync load);
  # rotation propagates within 12h, or force it:
  # kubectl annotate externalsecret mainclaw-config -n ai force-sync=$(date +%s)
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mainclaw-config
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: mainclaw-configmap
            items:
              - key: openclaw.json
  data:
    # Lens tracing key: minted once in the Lens UI (Traces → Connect project).
    # Ingestion-only: it cannot read traces nor call models. It is consumed by
    # resources/openclaw.json through this template, so the key never lands in
    # the generated ConfigMap, the pod env, or the openclaw.json committed in
    # Git — only in the rendered Secret.
    - secretKey: MAINCLAW_TRACING_KEY
      remoteRef:
        key: lens
        property: MAINCLAW_TRACING_KEY
  dataFrom:
    - extract:
        key: mainclaw

