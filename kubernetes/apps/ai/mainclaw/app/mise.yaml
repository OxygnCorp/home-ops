---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mainclaw-mise
data:
  config.toml: |
    # Tools installed on the PVC by the install-tools initContainer.
    # Binaries live in .local/share/mise/ (excluded from kopia snapshots,
    # restorable via `mise install`). Bump versions manually.
    [tools]
    op = "2.39.0"
    gh = "2.98.0"
