---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mainclaw-oidc
  annotations:
    # One-time nudge: forces Envoy Gateway to re-run OIDC discovery. The first
    # translation raced the authentik blueprint (404 on openid-configuration)
    # and EG does not retry permanent errors on its own.
    oxygn.dev/translation-nudge: "2026-09-07"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mainclaw-main
  oidc:
    provider:
      issuer: https://authentik.oxygn.dev/application/o/mainclaw/
    clientIDRef:
      group: ""
      kind: Secret
      name: mainclaw-oidc
    clientSecret:
      group: ""
      kind: Secret
      name: mainclaw-oidc
    redirectURL: https://mainclaw.oxygn.dev/oauth2/callback
    logoutPath: /logout
    scopes: ["openid", "email", "profile"]
