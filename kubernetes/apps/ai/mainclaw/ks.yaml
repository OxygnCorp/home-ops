---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mainclaw
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: mainclaw
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc/envoy
  dependsOn:
    - name: authentik
      namespace: security
    - name: kopiur
      namespace: kopiur-system
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/ai/mainclaw/app
  postBuild:
    substitute:
      APP: mainclaw
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_PUID: "1000"
      OIDC_ROUTE_NAME: mainclaw-main
      SUBDOMAIN: mainclaw
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 15m
  wait: false
