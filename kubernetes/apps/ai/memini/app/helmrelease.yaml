---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  upgrade:
    force: true
  values:
    global:
      fullnameOverride: *app
    controllers:
      main:
        containers:
          main:
            env:
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_EMBED_BASE_URL: http://litellm.ai:4000/v1
              MEMINI_EMBED_MODEL: qwen3-embedding-0.6b
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_QUERY_PREFIX: "Instruct: Given a user message, retrieve relevant past memories\nQuery: "
              MEMINI_EMBED_MAX_CONCURRENCY: "1"
              # Keep this below the qwen3-embedding-0.6b context (2048 tokens):
              # default 8000 runes lets a dense text (JSON/code) blow the model
              # context, leaving the memory vectorless and stuck in the
              # pending_embed repair loop.
              MEMINI_EMBED_MAX_ITEM_CHARS: "6000"
              MEMINI_RECALL_EMBED_TIMEOUT: 60s
              MEMINI_RERANK: http://litellm.ai:4000
              MEMINI_RERANK_MODEL: qwen3-reranker-0.6b
              MEMINI_RERANK_MAX_CONCURRENCY: "1"
              MEMINI_RERANK_TIMEOUT: 30s
              # deep rerank pool: hand the reranker ~50 candidates before truncation to the
              # recall limit (docs natural ceiling) so relevant memories buried past the
              # limit can be rescued; cost is linear — trades recall latency for accuracy
              MEMINI_RERANK_POOL: "50"
              # HTTP payload guard (not a context guard): large enough that the 50-candidate
              # pool is not sharded into serial requests that blow RERANK_TIMEOUT
              MEMINI_RERANK_MAX_BATCH_CHARS: "32000"
              # coalesce wants a high score (docs recommend ~0.9; the 0.625 default was
              # calibrated for the hint action) — 0.80 collapsed legitimately distinct facts
              MEMINI_WRITE_DEDUP_SCORE: "0.90"
              MEMINI_WRITE_DEDUP_ACTION: coalesce
              MEMINI_LLM_BASE_URL: http://litellm.ai:4000/v1
              MEMINI_LLM_MODEL: dsv41f
              # dsv41f is DeepSeek-class: keep reasoning from eating the 4096 default token
              # budget so distiller JSON answers never truncate (which silently drops calls)
              MEMINI_LLM_EXTRA_BODY: '{"thinking":{"type":"disabled"}}'
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: MEMINI_LLM_API_KEY
              MEMINI_EMBED_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: MEMINI_EMBED_API_KEY
              MEMINI_RERANK_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: MEMINI_RERANK_API_KEY
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: MEMINI_API_KEY
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      fsck:
        enabled: true
        cronjob:
          schedule: "0 5 * * *"
        containers:
          fsck:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: MEMINI_API_KEY
    persistence:
      data:
        existingClaim: *app
    serviceMonitor:
      main:
        enabled: true
    grafanaDashboards:
      enabled: true
      folder: ai
    route:
      ui:
        enabled: true
        hostnames:
          - memini.oxygn.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
