---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./prometheusrule.yaml
  - ./ocirepository.yaml
# Mover security context inherited from the PVC's consumer workload (memini
# distroless pod pins pod-level runAsUser 65532) instead of a static PUID: an
# explicit runAsUser would always win over the inheritance, so it is removed on
# both the SnapshotPolicy (pvcConsumer) and the Restore (recorded identity
# replay). Targeted by kind only: the resources are named ${APP} at build time
# (Flux postBuild substitution), so a name: selector cannot match — and the
# kopiur/backup component injected via the Kustomization's spec.components
# contributes exactly one of each kind. NOTE: this cannot live in spec.patches
# on the ks.yaml — the root kubernetes/flux/cluster/ks.yaml patches every app
# Kustomization with its own spec.patches (HelmRelease strategy) and a
# strategic-merge on that list replaces whatever an app declares there.
patches:
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
      version: v1alpha1
    patch: |-
      - op: add
        path: /spec/mover/inheritSecurityContextFrom
        value:
          pvcConsumer: {}
      - op: remove
        path: /spec/mover/securityContext
  - target:
      group: kopiur.home-operations.com
      kind: Restore
      version: v1alpha1
    patch: |-
      - op: add
        path: /spec/mover/inheritSecurityContextFrom
        value:
          snapshot: {}
      - op: remove
        path: /spec/mover/securityContext
