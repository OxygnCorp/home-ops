---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        ## One LiteLLM virtual key per Hermes profile. The `default` profile
        ## uses LITELLM_API_KEY; the `foyer` profile gets its own key injected
        ## into profiles/foyer/config.yaml by the init container.
        LITELLM_API_KEY: "{{ .KEY_HERMES_DEFAULT }}"
        LITELLM_API_KEY_FOYER: "{{ .KEY_HERMES_FOYER }}"
        ## Memini memory provider
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        ## A2A peer tokens for LiteLLM (1Password `litellm` item).
        ## The default profile uses peer "litellm"; the foyer served agent
        ## uses peer "litellm-foyer" so ingress identity is distinct.
        ## Hermes applies the trusted-peer list gateway-wide, so either token
        ## can reach either served agent; this is acceptable because the A2A
        ## port is cluster-internal and not routed through Envoy.
        A2A_PEER_TOKENS: "litellm:{{ .A2A_HERMES_TOKEN }},litellm-foyer:{{ .A2A_FOYER_TOKEN }}"
  data:
    - secretKey: KEY_HERMES_DEFAULT
      remoteRef:
        key: litellm
        property: LITELLM_API_KEY_HERMES_DEFAULT
    - secretKey: KEY_HERMES_FOYER
      remoteRef:
        key: litellm
        property: LITELLM_API_KEY_HERMES_FOYER
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
    - secretKey: A2A_HERMES_TOKEN
      remoteRef:
        key: litellm
        property: A2A_HERMES_TOKEN
    - secretKey: A2A_FOYER_TOKEN
      remoteRef:
        key: litellm
        property: A2A_HERMES_FOYER_TOKEN
