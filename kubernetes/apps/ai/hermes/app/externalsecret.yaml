---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        ## LiteLLM virtual key (created by the hermes LiteLLMVirtualKey +
        ## PushSecret in apps/ai/litellm/app/virtualkeys/hermes.yaml)
        LITELLM_API_KEY: "{{ .KEY_HERMES }}"
        ## Memini memory provider
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        ## Dashboard OIDC auth (self-hosted provider plugin; env vars win
        ## over config.yaml). Client credentials are generated and stored
        ## in the 1Password 'hermes' item; the Authentik provider itself is
        ## created by the hermes-blueprint OIDC blueprint.
        HERMES_DASHBOARD_OIDC_ISSUER: https://authentik.oxygn.dev/application/o/hermes
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .HERMES_CLIENT_ID }}"
        HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .HERMES_CLIENT_SECRET }}"
  data:
    - secretKey: KEY_HERMES
      remoteRef:
        key: litellm
        property: KEY_HERMES
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
    - secretKey: HERMES_CLIENT_ID
      remoteRef:
        key: hermes
        property: HERMES_CLIENT_ID
    - secretKey: HERMES_CLIENT_SECRET
      remoteRef:
        key: hermes
        property: HERMES_CLIENT_SECRET
