---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        ## One LiteLLM virtual key per Hermes profile. The `default` profile
        ## uses LITELLM_API_KEY; the `foyer` profile gets its own key injected
        ## into profiles/foyer/config.yaml by the init container.
        LITELLM_API_KEY: "{{ .KEY_HERMES_DEFAULT }}"
        LITELLM_API_KEY_FOYER: "{{ .KEY_HERMES_FOYER }}"
        ## Memini memory provider
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        ## A2A peer tokens for LiteLLM. Each token is that profile's existing
        ## LiteLLM virtual key, reused as the A2A credential. Hermes applies
        ## the trusted-peer list gateway-wide, so either token can reach either
        ## served agent; acceptable because the A2A port is cluster-internal
        ## and not routed through Envoy.
        A2A_PEER_TOKENS: "litellm:{{ .KEY_HERMES_DEFAULT }},litellm-foyer:{{ .KEY_HERMES_FOYER }}"
  data:
    - secretKey: KEY_HERMES_DEFAULT
      remoteRef:
        key: litellm
        property: LITELLM_API_KEY_HERMES_DEFAULT
    - secretKey: KEY_HERMES_FOYER
      remoteRef:
        key: litellm
        property: LITELLM_API_KEY_HERMES_FOYER
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
