---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        ## LiteLLM virtual key (created by the hermes LiteLLMVirtualKey +
        ## PushSecret in apps/ai/litellm/app/virtualkeys/hermes.yaml)
        LITELLM_API_KEY: "{{ .KEY_HERMES }}"
        ## Memini memory provider
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        ## Dashboard basic auth (the image refuses to bind 0.0.0.0 without
        ## a registered auth provider; env vars win over config.yaml)
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "{{ .DASHBOARD_USERNAME }}"
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: "{{ .DASHBOARD_PASSWORD_HASH }}"
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ .DASHBOARD_SESSION_SECRET }}"
  data:
    - secretKey: KEY_HERMES
      remoteRef:
        key: litellm
        property: KEY_HERMES
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
  dataFrom:
    - extract:
        key: hermes
