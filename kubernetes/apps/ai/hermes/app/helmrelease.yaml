---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            securityContext:
              runAsUser: 0
            env:
              - name: LITELLM_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: hermes
                    key: LITELLM_API_KEY
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                apk add --no-cache gettext >/dev/null
                cp /tmp/config.yaml /opt/data/config.yaml
                # Expand env-var references from the pod env before hermes
                # reads the config. The config uses double-dollar literals
                # ($${LITELLM_API_KEY}) to survive the strict flux postBuild
                # substitution; envsubst resolves them at pod start.
                envsubst < /opt/data/config.yaml > /opt/data/config.yaml.tmp
                mv /opt/data/config.yaml.tmp /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
                # Install the memini memory-provider plugin from the upstream
                # standalone mirror eleboucher/memini-hermes. Pinned to a
                # commit, guarded by a .ref marker so normal restarts stay
                # offline and it only refetches when the pin changes. The
                # mirror is untagged, so bump this SHA by hand.
                MEMINI_PLUGIN_REF=ad5e12b3ade70e0afaa011513aa97920d2b66b46
                PLUGIN_DIR=/opt/data/plugins/memini
                if [ "$(cat "$PLUGIN_DIR/.ref" 2>/dev/null)" != "$MEMINI_PLUGIN_REF" ]; then
                  BASE="https://raw.githubusercontent.com/eleboucher/memini-hermes/$MEMINI_PLUGIN_REF"
                  if wget -qO /tmp/memini-init.py "$BASE/__init__.py" && wget -qO /tmp/memini-plugin.yaml "$BASE/plugin.yaml"; then
                    rm -rf "$PLUGIN_DIR"
                    mkdir -p "$PLUGIN_DIR"
                    mv /tmp/memini-init.py "$PLUGIN_DIR/__init__.py"
                    mv /tmp/memini-plugin.yaml "$PLUGIN_DIR/plugin.yaml"
                    printf '%s' "$MEMINI_PLUGIN_REF" > "$PLUGIN_DIR/.ref"
                    chown -R 10000:10000 "$PLUGIN_DIR"
                  else
                    echo "WARN: memini plugin fetch failed; starting with whatever is present"
                  fi
                fi
        containers:
          app:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            args: ["gateway", "run"]
            env:
              MEMINI_URL: http://memini.ai:8080
              MEMINI_NAMESPACE: hermes
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: hermes
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 2Gi
            ports:
              - containerPort: &port 8642
                name: http
                protocol: TCP
          dashboard:
            image: *image
            env:
              GATEWAY_HEALTH_URL: http://localhost:8642
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: hermes
            args:
              - dashboard
              - --host
              - "0.0.0.0"
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 1Gi
            ports:
              - containerPort: &dashboard_port 9119
                name: http
                protocol: TCP
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.140.0@sha256:1c9ad972a78450f430155144110da4c02d3627c72a598e9197e2781fb9f92e28
            env:
              TZ: Europe/Paris
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/home/node/.vscode",
                "--extensions-dir",
                "/home/node/.vscode",
                "--port",
                "12321",
                "/opt/data",
              ]
            ports:
              - containerPort: &codeserverPort 12321
                name: codeserver
                protocol: TCP
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: hermes
        ports:
          http:
            port: *port
          codeserver:
            port: *codeserverPort
      dashboard:
        controller: hermes
        ports:
          http:
            port: *dashboard_port
    route:
      app:
        hostnames: ["hermes.oxygn.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: dashboard
                port: http
      codeserver:
        hostnames: ["hermes-code.oxygn.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: codeserver
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      configmap:
        type: configMap
        name: hermes-config
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
