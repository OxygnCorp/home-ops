---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            securityContext:
              runAsUser: 0
            # envFrom rather than explicit secretKeyRef: if the ExternalSecret
            # has not seen the new 1Password field yet, the init container must
            # still start (the foyer rewrite is guarded below), not fail on a
            # missing secret key.
            envFrom:
              - secretRef:
                  name: hermes
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                apk add --no-cache gettext >/dev/null
                cp /tmp/config.yaml /opt/data/config.yaml
                # Expand env-var references from the pod env before hermes
                # reads the config. The config uses double-dollar literals
                # ($${LITELLM_API_KEY}) to survive the strict flux postBuild
                # substitution; envsubst resolves them at pod start.
                envsubst < /opt/data/config.yaml > /opt/data/config.yaml.tmp
                mv /opt/data/config.yaml.tmp /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
                # The `foyer` profile's config lives on the PVC and used to
                # hardcode the gateway-wide LiteLLM key, so a rotation never
                # reached it. Rewrite its provider key on every start from the
                # profile-specific Secret entry, but only once that entry is
                # actually present: before the PushSecret/ExternalSecret catch
                # up, foyer keeps its previous (still valid) key instead of
                # taking the whole gateway down. This profile currently has a
                # single `api_key` line (its litellm provider).
                if [ -f /opt/data/profiles/foyer/config.yaml ] && [ -n "$${LITELLM_API_KEY_FOYER:-}" ]; then
                  sed -i 's|^\([[:space:]]*api_key:\).*|\1 $${LITELLM_API_KEY_FOYER}|' \
                    /opt/data/profiles/foyer/config.yaml
                  # Restrict the expansion to the one variable we own: the
                  # foyer config lives on the PVC and may contain other
                  # (user-edited) $VAR references that envsubst would erase.
                  envsubst '$${LITELLM_API_KEY_FOYER}' < /opt/data/profiles/foyer/config.yaml > /opt/data/profiles/foyer/config.yaml.tmp
                  mv /opt/data/profiles/foyer/config.yaml.tmp /opt/data/profiles/foyer/config.yaml
                  chown 10000:10000 /opt/data/profiles/foyer/config.yaml
                fi
                # Keep the kopia ignore list at the PVC root so kopiur
                # snapshots skip regenerable files (caches, rendered config).
                # Explicit mode/ownership so the kopiur mover can always
                # read it, whatever the init umask turns out to be.
                cp /kopiaignore/.kopiaignore /opt/data/.kopiaignore
                chown 10000:10000 /opt/data/.kopiaignore
                chmod 0644 /opt/data/.kopiaignore
                # Install the memini memory-provider plugin from the upstream
                # standalone mirror eleboucher/memini-hermes. Pinned to a
                # commit, guarded by a .ref marker so normal restarts stay
                # offline and it only refetches when the pin changes. The
                # mirror is untagged, so bump this SHA by hand.
                MEMINI_PLUGIN_REF=ad5e12b3ade70e0afaa011513aa97920d2b66b46
                PLUGIN_DIR=/opt/data/plugins/memini
                if [ "$(cat "$PLUGIN_DIR/.ref" 2>/dev/null)" != "$MEMINI_PLUGIN_REF" ]; then
                  BASE="https://raw.githubusercontent.com/eleboucher/memini-hermes/$MEMINI_PLUGIN_REF"
                  if wget -qO /tmp/memini-init.py "$BASE/__init__.py" && wget -qO /tmp/memini-plugin.yaml "$BASE/plugin.yaml"; then
                    rm -rf "$PLUGIN_DIR"
                    mkdir -p "$PLUGIN_DIR"
                    mv /tmp/memini-init.py "$PLUGIN_DIR/__init__.py"
                    mv /tmp/memini-plugin.yaml "$PLUGIN_DIR/plugin.yaml"
                    printf '%s' "$MEMINI_PLUGIN_REF" > "$PLUGIN_DIR/.ref"
                    chown -R 10000:10000 "$PLUGIN_DIR"
                  else
                    echo "WARN: memini plugin fetch failed; starting with whatever is present"
                  fi
                fi
        containers:
          app:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
            args: ["gateway", "run"]
            env:
              # The Hermes memini plugin only reads MEMINI_BASE_URL; under any
              # other name it falls back to http://localhost:8080 and fails
              # soft (no handshake, no recall, no capture).
              MEMINI_BASE_URL: http://memini.ai:8080
              # Writes go to a dedicated namespace for this agent.
              MEMINI_NAMESPACE: hermes-foyer
              # Read-only home leg: merges the shared namespace's semantic +
              # procedural tiers into every recall (flat names do not cascade,
              # so this is how the agent inherits household-wide memories).
              # Verified with GET /v1/namespaces/readset.
              MEMINI_HOME: hermes
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: Europe/Paris
              # The Webapp is served by this gateway process and shares the
              # dashboard sign-in providers: without one the gateway only
              # serves native clients, so the browser listener stays off.
              HERMES_DASHBOARD_OIDC_ISSUER: https://idm.oxygn.dev/oauth2/openid/hermes
              HERMES_DASHBOARD_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-hermes-oidc
                    key: client-id
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-hermes-oidc
                    key: client-secret
              # Native A2A v1.0 inbound (Hermes >= v0.23). A non-loopback
              # bind requires both a token and A2A_HOST; A2A_PEER_TOKENS in
              # the `hermes` Secret gives LiteLLM the stable peer identity
              # "litellm" so dispatch does not depend on the caller's IP.
              A2A_HOST: 0.0.0.0
              A2A_PORT: "9900"
              A2A_AGENT_NAME: hermes-default
              A2A_PUBLIC_URL: http://hermes-app.ai.svc.cluster.local:9900
              A2A_TRUSTED_PEERS: litellm,litellm-foyer
            envFrom:
              - secretRef:
                  name: hermes
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 2Gi
            ports:
              - containerPort: &port 8642
                name: http
                protocol: TCP
              - containerPort: &webapp_port 9120
                name: webapp
                protocol: TCP
              - containerPort: &a2a_port 9900
                name: a2a
                protocol: TCP
          dashboard:
            image: *image
            env:
              GATEWAY_HEALTH_URL: http://localhost:8642
              # Explicit public URL: used verbatim for the OAuth redirect_uri
              # (https://hermes-ui.oxygn.dev/auth/callback, registered strict in
              # Kanidm by the provision controller) instead of request-header
              # reconstruction behind Envoy
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes-ui.oxygn.dev
              # Dashboard OIDC (self-hosted provider plugin; env vars win over
              # config.yaml). A Kanidm client holds one callback hostname, so
              # the dashboard has its own hermes-ui client — the hermes one is
              # now the Webapp's (see the app container above).
              HERMES_DASHBOARD_OIDC_ISSUER: https://idm.oxygn.dev/oauth2/openid/hermes-ui
              HERMES_DASHBOARD_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-hermes-ui-oidc
                    key: client-id
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-hermes-ui-oidc
                    key: client-secret
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: hermes
            args:
              - dashboard
              - --host
              - "0.0.0.0"
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 1Gi
            ports:
              - containerPort: &dashboard_port 9119
                name: http
                protocol: TCP
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.146.0@sha256:fc708b18f6c613b5a9d00f1d1801e58376d3df9c5b5de77f5c02d67b711f99c9
            env:
              TZ: Europe/Paris
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/home/node/.vscode",
                "--extensions-dir",
                "/home/node/.vscode",
                "--port",
                "12321",
                "/opt/data",
              ]
            ports:
              - containerPort: &codeserverPort 12321
                name: codeserver
                protocol: TCP
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: hermes
        ports:
          http:
            port: *port
          webapp:
            port: *webapp_port
          codeserver:
            port: *codeserverPort
          a2a:
            port: *a2a_port
      dashboard:
        controller: hermes
        ports:
          http:
            port: *dashboard_port
    route:
      app:
        hostnames: ["hermes.oxygn.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: webapp
      dashboard:
        hostnames: ["hermes-ui.oxygn.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: dashboard
                port: http
      codeserver:
        hostnames: ["hermes-code.oxygn.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: codeserver
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      configmap:
        type: configMap
        name: hermes-config
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
      kopiaignore:
        type: configMap
        name: hermes-kopiaignore
        globalMounts:
          - path: /kopiaignore
