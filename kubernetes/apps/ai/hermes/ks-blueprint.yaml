---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-blueprint
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: hermes
  interval: 1h
  path: ./kubernetes/components/oidc/blueprint
  postBuild:
    substitute:
      APP: hermes
      OIDC_DISPLAY_NAME: Hermes
      OIDC_ENV_PREFIX: HERMES
      DOMAIN: ${DOMAIN:=oxygn.dev}
      SUBDOMAIN: ${SUBDOMAIN:=hermes}
      # The hermes dashboard self-hosted OIDC plugin registers its own
      # callback path; strict-matched in the Authentik blueprint
      OIDC_CALLBACK: ${OIDC_CALLBACK:=/auth/callback}
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  timeout: 5m
  wait: false
