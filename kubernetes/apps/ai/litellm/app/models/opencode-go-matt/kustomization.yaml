---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Upstream provider: opencode.ai/zen/go/v1 (OpenCode Go subscription).
# Subscription key: OPENCODE_MATT_API_KEY (1Password item `litellm`, providers section).
#
# Sticky-per-session load-balancing
# ---------------------------------
# Sibling folder ./opencode-go-agnes/ duplicates every model in this folder, but
# with modelName `<canonical>-agnes` and apiKey OPENCODE_AGNES_API_KEY. The two
# folders are NOT interchangeable routes for the same modelName: clients call
# the canonical names here (e.g. `go-minimax-m3`), and the session hook in
# `app/resources/session_hook.py` rewrites the request to `<canonical>-agnes`
# for ~half of sessions (deterministic hash of `x-opencode-session`).
#
# Effect: each openclaw conversation is permanently pinned to one subscription,
# keeping the upstream OpenCode Go prompt cache coherent, while the two
# subscriptions share overall load roughly 50/50.
#
# Keep this folder and opencode-go-agnes/ in lockstep: any new model added
# here must also be added there AND listed in `_OPENCODE_GO_MODELS` in
# session_hook.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./dsv41f.yaml
  - ./dsv41f-max.yaml
  - ./dsv41f-nothink.yaml
  - ./dsv4f.yaml
  - ./dsv4p.yaml
  - ./go-dsv4f-vision.yaml
  - ./go-glm-5.3.yaml
  - ./go-glm-5.3-flash.yaml
  - ./go-hy4-preview.yaml
  - ./go-kimi-k2.7-code.yaml
  - ./go-kimi-k3.yaml
  - ./go-minimax-m2.7.yaml
  - ./go-minimax-m3.yaml
  - ./go-qwen3.8-flash.yaml
  - ./go-qwen3.8-max.yaml
  - ./mimo-v2.5.yaml
  - ./mimo-v2.5-pro.yaml
  - ./qwen3.7-plus.yaml