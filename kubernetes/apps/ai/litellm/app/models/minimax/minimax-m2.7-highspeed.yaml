---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: minimax-m2.7-highspeed
spec:
  modelName: MiniMax-M2.7-highspeed
  proxyRef: litellm
  params:
    model: minimax/MiniMax-M2.7-highspeed
    apiBase: https://api.minimax.io/v1
    apiKey: os.environ/MINIMAX_API_KEY
    additional:
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      input_cost_per_token: 0.0000006
      output_cost_per_token: 0.0000024
      cache_read_input_token_cost: 0.00000006
      cache_creation_input_token_cost: 0.000000375
  info:
    mode: chat
    maxInputTokens: 204800
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: false
    supportsPromptCaching: true
