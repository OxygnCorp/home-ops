---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: minimax-m3
spec:
  modelName: MiniMax-M3
  proxyRef: litellm
  params:
    model: minimax/MiniMax-M3
    apiBase: https://api.minimax.io/v1
    apiKey: os.environ/MINIMAX_API_KEY
    additional:
      # MiniMax API pricing, Permanent 50% off, <=512K context
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.00000006
      # >512K context tier (50% off)
      input_cost_per_token_above_512k_tokens: 0.0000006
      output_cost_per_token_above_512k_tokens: 0.0000024
      cache_read_input_token_cost_above_512k_tokens: 0.00000012
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
