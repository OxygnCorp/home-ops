---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Upstream provider: api.minimax.io/v1 (MiniMax API).
# All models share MINIMAX_API_KEY (1Password item `litellm`, providers section).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./minimax-m2.7.yaml
  - ./minimax-m2.7-highspeed.yaml
  - ./minimax-m3.yaml
  - ./minimax-m3.1-flash-preview.yaml