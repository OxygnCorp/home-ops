---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: deepseek-v4-pro-agnes
spec:
  modelName: deepseek-v4-pro
  proxyRef: litellm
  params:
    model: openai/deepseek-v4-pro
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_AGNES_API_KEY
    additional:
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      # Base rates; peak hours (weekdays 01:00-04:00 and 06:00-10:00 UTC)
      # bill x2. Zero data retention upstream.
      input_cost_per_token: 0.00000066
      output_cost_per_token: 0.00000198
      cache_read_input_token_cost: 0.000000022
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 384000
    supportsFunctionCalling: true
    supportsVision: false
    supportsPromptCaching: true
