---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: beam-free
spec:
  modelName: beam-free
  proxyRef: litellm
  params:
    model: openai/beam-free
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_MATT_API_KEY
    additional:
      # Tier-2 emergency fallback for every chat model group: free and
      # unmetered while the OpenCode Go promo lasts ("limited time" — if the
      # promo ends, repoint the tier-2 fallbacks at go-glm-5.3-flash).
      # Replaces longcat-2.5-free (upstream longcat-2.5-preview-free retired).
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
  info:
    # Sparse MoE reasoning model (23B active): reasoning model, so responses
    # carry reasoning_content. Not vision-capable. Not available in China,
    # Russia and a few other regions; provider retains request data 30 days
    # for safety monitoring (no training).
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: false
    supportsPromptCaching: false
