---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: go-kimi-k2.7-code
spec:
  modelName: go-kimi-k2.7-code
  proxyRef: litellm
  params:
    model: openai/kimi-k2.7-code
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_MATT_API_KEY
    additional:
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      input_cost_per_token: 0.00000095
      output_cost_per_token: 0.000004
      cache_read_input_token_cost: 0.00000019
  info:
    mode: chat
    maxInputTokens: 262144
    maxOutputTokens: 262144
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
