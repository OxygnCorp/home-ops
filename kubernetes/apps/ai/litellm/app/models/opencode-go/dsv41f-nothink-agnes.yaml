---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: dsv41f-nothink-agnes
spec:
  modelName: dsv41f-nothink
  proxyRef: litellm
  params:
    model: openai/deepseek-v4.1-flash
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_AGNES_API_KEY
    # Same upstream as dsv41f, with reasoning disabled: LightRAG's indexing
    # guidance says to avoid reasoning models during extraction. OpenCode Go
    # honours reasoning_effort (none disables reasoning), same as dsv41f-max/max.
    additional:
      reasoning_effort: none
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.000000006
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 384000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
