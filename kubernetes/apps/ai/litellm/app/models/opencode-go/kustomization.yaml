---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Upstream provider: opencode.ai/zen/go/v1 (OpenCode Go).
# Two subscriptions back the same pool, split across file pairs.
#
# Shared pool / failover
# ----------------------
# Each model exists as a PAIR of LiteLLMModel CRs that share one `modelName`:
#
#   <model>.yaml        apiKey: OPENCODE_MATT_API_KEY
#   <model>-agnes.yaml  apiKey: OPENCODE_AGNES_API_KEY
#
# Because the `modelName` is identical, litellm treats them as two deployments
# of ONE model group (`dsv41f` -> [Matt, Agnes]) and load-balances between them
# under `routing_strategy: simple-shuffle`. The `-agnes` suffix lives in
# `metadata.name` only — it is NOT part of the model name clients request.
#
# This is what makes the pool resilient: when one subscription returns 429 or
# 5xx, the group has an alternative deployment, so the router benches the
# failing one (`cooldown_time: 30`) and serves the request from the other.
# With one deployment per modelName instead, a 429 has no sibling to go to —
# the request falls through to the router's free-tier `default_fallbacks`.
# (See the TEMPORARY block below: parking Matt's paid deployments puts every
# paid group in that single-deployment shape for now.)
#
# Do NOT give the two files of a pair different `modelName`s: that splits them
# into two single-deployment groups and removes all failover.
#
# When adding a model, add BOTH files of the pair.
#
# TEMPORARY — Matt subscription parked (2026-11-26 → 2026-11-29)
# -----------------------------------------------------------------
# Agnès's Go subscription renews on 2026-11-29 with ~74% of its monthly
# allowance already used, and unused allowance does not roll over. To burn
# that remainder instead of splitting traffic 50/50, the Matt-side
# deployments of every PAID model are commented out below: each paid model
# group keeps a single deployment (Agnès) and gets 100% of the traffic.
#
# Free models (beam-free, hy4-flash-free) stay on BOTH keys — they bill no
# allowance and keep the failover that go-auto's SIMPLE tier relies on.
#
# Consequence: a 429 from Agnès's subscription is no longer failed over to
# Matt. `routerSettings.default_fallbacks` (app/litellmproxy.yaml) applies
# `hy4-flash-free` then `beam-free` to every chat group without an explicit
# `fallbacks` entry, so the request is SILENTLY served by a free model — a
# quota-exhausted paid group degrades to the free tier instead of erroring,
# and no paid group hard-fails. (Embeddings/reranker keep explicit empty
# chains and are unaffected.)
#
# Restore after Agnès renews: uncomment the 27 `# - ./<model>.yaml` lines
# below, or `git revert` the commit that parked them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # - ./dsv41f.yaml
  - ./dsv41f-agnes.yaml
  # - ./dsv41f-max.yaml
  - ./dsv41f-max-agnes.yaml
  # - ./dsv41f-nothink.yaml
