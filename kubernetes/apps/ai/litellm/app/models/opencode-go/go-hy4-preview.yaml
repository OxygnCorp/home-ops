---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: go-hy4-preview
spec:
  modelName: go-hy4-preview
  proxyRef: litellm
  params:
    model: openai/hy4-preview
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_MATT_API_KEY
    additional:
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      input_cost_per_token: 0.000000834
      output_cost_per_token: 0.000002501
      cache_read_input_token_cost: 0.000000042
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 64000
    supportsFunctionCalling: true
    supportsVision: false
    supportsPromptCaching: true
