---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: hy3
spec:
  modelName: hy3
  proxyRef: litellm
  params:
    model: openai/hy3
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_MATT_API_KEY
    additional:
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000058
      cache_read_input_token_cost: 0.000000035
  info:
    mode: chat
    maxInputTokens: 256000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsVision: false
    supportsPromptCaching: true
