---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: longcat-2.5-agnes
spec:
  modelName: longcat-2.5
  proxyRef: litellm
  params:
    model: openai/longcat-2.5
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_AGNES_API_KEY
    additional:
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      # Cache writes are free upstream. Served from limited regions.
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.000000006
      cache_creation_input_token_cost: 0
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 262144
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
