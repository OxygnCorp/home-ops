---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: go-qwen3.8-max-agnes
spec:
  modelName: go-qwen3.8-max
  proxyRef: litellm
  params:
    model: openai/qwen3.8-max
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_AGNES_API_KEY
    additional:
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      cache_read_input_token_cost: 0.00000025
      cache_creation_input_token_cost: 0.0000025
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
