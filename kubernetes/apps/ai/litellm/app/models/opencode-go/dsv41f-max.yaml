---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: dsv41f-max
spec:
  modelName: dsv41f-max
  proxyRef: litellm
  params:
    model: openai/deepseek-v4.1-flash
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_MATT_API_KEY
    # Same upstream as dsv41f, with the reasoning effort pinned so the
    # foreman escalation coder (which sends no per-request param) always runs
    # at the strongest mode. OpenCode Go serves a single model id but honours
    # reasoning_effort (probe-tested: max accepted, none disables reasoning);
    # litellm passes it through unchanged (verified 200 end-to-end).
    additional:
      reasoning_effort: max
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.000000006
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 384000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
