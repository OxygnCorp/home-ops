---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: gemini-4-argon
spec:
  modelName: gemini-4-argon
  proxyRef: litellm
  params:
    model: openai/gemini-4-argon
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_MATT_API_KEY
    additional:
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      # Base rates; x2 from 2026-12-01 (4.00/20.00/0.20). Google-protocol
      # upstream reached through the openai-compatible Go endpoint.
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      cache_read_input_token_cost: 0.0000001
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
