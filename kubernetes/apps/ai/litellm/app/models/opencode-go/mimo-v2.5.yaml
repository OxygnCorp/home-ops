---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: mimo-v2.5
spec:
  modelName: mimo-v2.5
  proxyRef: litellm
  params:
    model: openai/mimo-v2.5
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_MATT_API_KEY
    additional:
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028
      cache_read_input_token_cost: 0.0000000028
  info:
    mode: chat
    maxInputTokens: 262144
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
