---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: step-5-preview
spec:
  modelName: step-5-preview
  proxyRef: litellm
  params:
    model: openai/step-5-preview
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_MATT_API_KEY
    additional:
      # Real upstream pricing (USD/M ÷ 1M) — subscription only, tracking
      # purposes, no max_budget set (would block requests)
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.0000027
      cache_read_input_token_cost: 0.0000001
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
