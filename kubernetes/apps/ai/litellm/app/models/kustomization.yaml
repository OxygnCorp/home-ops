---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Grouped by upstream provider:
#   - opencode-go-matt/  : 18 OpenCode Go models using OPENCODE_MATT_API_KEY
#   - opencode-go-agnes/ : same 18 modelNames, OPENCODE_AGNES_API_KEY (load-balances with matt via simple-shuffle)
#   - minimax/           : 4 MiniMax models on api.minimax.io/v1 (MINIMAX_API_KEY)
#   - internal/          : 2 in-cluster services (embedding + reranker)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./opencode-go-matt
  - ./opencode-go-agnes
  - ./minimax
  - ./internal