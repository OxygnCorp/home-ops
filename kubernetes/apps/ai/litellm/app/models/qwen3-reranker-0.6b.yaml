---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen3-reranker-0.6b
spec:
  # Name matches MEMINI_RERANK_MODEL. `infinity/` provider posts the cohere
  # format to {api_base}/rerank — verified against llama-server in-cluster
  # (200, results[].relevance_score + usage present).
  modelName: qwen3-reranker-0.6b
  proxyRef: litellm
  params:
    model: infinity/qwen3-reranker-0.6b
    apiBase: http://qwen3-reranker-0-6b.ai.svc.cluster.local:8080
    apiKey: sk-llmkube-noauth
  info:
    # NO `mode: rerank` here: the operator controller normalizes rerank-mode
    # models (provider → openai/, apiBase +/v1, default tokens), which litellm
    # then rejects at /rerank ("Unsupported provider: openai"). Without a mode
    # the CR is rendered verbatim and the infinity/ provider works (verified
    # E2E: POST /rerank 200, correct ranking). mode is informational in litellm;
    # the /rerank endpoint routes by model name.
    maxInputTokens: 2048
