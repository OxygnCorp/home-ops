general_settings:
  health_check_endpoint: /v1/health

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  routing_strategy: simple-shuffle
  cooldown_time: 30
  enable_pre_call_checks: true
  fallbacks:
    - MiniMax-M3: ["go-minimax-m3"]
    - MiniMax-M2.7: ["go-minimax-m2.7"]
    - dsv4f: ["go-minimax-m3"]
    - zai-glm-5.2: ["zai-glm-5.3-flash"]
    - zai-glm-5.3: ["zai-glm-5.3-flash"]
    - zai-glm-5.3-flash: ["go-glm-5.3-flash"]
    - go-glm-5.3: ["zai-glm-5.3"]
    - go-glm-5.3-flash: ["zai-glm-5.3-flash"]
    - go-qwen3.8-max: ["dsv4p"]

litellm_settings:
  callbacks: ["prometheus"]
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  prometheus_adapter: true
  require_auth_for_metrics_endpoint: false
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ttl: 300
  drop_params: true
  request_timeout: 3600
  num_retries: 1
  set_verbose: false

environment:
  - MINIMAX_API_KEY
  - OPENCODE_API_KEY
  - ZAI_API_KEY
  - REDIS_HOST
  - REDIS_PORT
