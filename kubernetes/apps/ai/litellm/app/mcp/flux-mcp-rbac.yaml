---
# Copy of toolhive/mcp-servers/flux-mcp/rbac.yaml during the litellm MCP gateway
# migration. Names are prefixed "litellm-" because the toolhive resources
# (SA flux-mcp, ClusterRole/Binding flux-mcp-write, flux-mcp-readonly binding)
# are still deployed in the same namespace and would conflict / be co-owned.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-flux-mcp
---
# Reuses the broad read-only ClusterRole from kubectl-mcp (secrets excluded).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litellm-flux-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litellm-kubectl-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: litellm-flux-mcp
    namespace: ai
---
# Write access limited to Flux API groups: enables the MCP
# reconcile/suspend/resume tools (annotation/spec patches) and
# apply/delete of Flux objects, but nothing outside Flux CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litellm-flux-mcp-write
rules:
  - apiGroups:
      - fluxcd.controlplane.io
      - helm.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
    resources:
      - "*"
    verbs:
      - create
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litellm-flux-mcp-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litellm-flux-mcp-write
subjects:
  - kind: ServiceAccount
    name: litellm-flux-mcp
    namespace: ai
