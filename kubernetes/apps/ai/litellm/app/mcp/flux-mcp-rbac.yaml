---
# Service account for the Flux MCP (litellm-flux in workloads.yaml).
#
# Read-only on purpose: this cluster is GitOps, so cluster writes belong in Git,
# and the agent's cluster-side mutation path is radar (manage_gitops,
# apply_resource, patch_resource). The Flux write ClusterRole that used to live
# here (litellm-flux-mcp-write) granted create/patch/update/delete on the Flux
# API groups — i.e. direct edits of Flux CRs from an LLM tool call, bypassing
# review — for capabilities radar already provides. It was dropped along with
# the MCP write tools (spec.params.disallowed_tools in workloads.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-flux-mcp
---
# Broad read-only access, secrets excluded (role defined in
# mcp-readonly-rbac.yaml). Constant name on purpose: a ClusterRoleBinding's
# roleRef is immutable, so pointing an existing binding at a different role is
# rejected by the API server and would wedge the reconcile. This name was
# introduced together with the role it points at (the former
# litellm-flux-mcp-readonly binding is pruned).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litellm-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litellm-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: litellm-flux-mcp
    namespace: ai
