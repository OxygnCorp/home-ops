# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-todoist-mcp
spec:
  alias: todoist-mcp
  proxyRef: litellm
  transport: http
  workload:
    image: docker.io/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    port: 8020
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      # renovate: datasource=npm depName=@doist/todoist-mcp
      - "npx -y -p @doist/todoist-mcp@13.4.0 -- todoist-mcp"
      - --outputTransport
      - streamableHttp
      - --streamableHttpPath
      - /mcp
      - --port
      - "8020"
    # No tool exclusion here: the get-overview exclusion is handled at the
    # litellm proxy layer (Task 8), not on the workload.
    env:
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp/.npm
      - name: TODOIST_API_KEY
        valueFrom:
          secretKeyRef:
            name: toolhive-todoist
            key: TODOIST_API_KEY
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
