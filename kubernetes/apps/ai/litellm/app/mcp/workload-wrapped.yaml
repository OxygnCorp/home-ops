---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Wrapped stdio MCP servers migrated from toolhive MCPServer CRs
# (kubernetes/apps/ai/toolhive/mcp-servers/*) during the litellm MCP gateway
# migration (see .superpowers/sdd/2026-10-03-litellm-mcp-migration).
#
# Every npm-based stdio server is wrapped with supergateway
# (stdio -> streamable HTTP at /mcp); flags verified against the supergateway
# README (github.com/supercorp-ai/supergateway): --stdio "<cmd>",
# --outputTransport streamableHttp, --streamableHttpPath /mcp, --port N.
# All wrappers run --stateful with --sessionTimeout (2026-10-05): in the
# default stateless mode supergateway spawns a NEW child MCP process per
# sessionless request and SIGTERMs it after the response. The litellm proxy
# replicas refresh each server's catalog (tools/prompts/resources) every few
# minutes on top of real tool calls, which produced ~1000 child boots per
# 16h (933 initializes) on litellm-context7 — overlapping npx+node boots
# (~100-150Mi each on a ~205Mi base) blew the memory limits => repeated
# OOMKilled (exit 137). Stateful keeps one child per client session and
# reaps idle ones after --sessionTimeout, flattening memory and CPU.
# github-mcp-server supports native HTTP transport (probed in-pod 2026-10-03:
# `server http --port`, image ghcr.io/github/github-mcp-server), so it runs the
# binary directly instead of being wrapped.
# Note: workload CR names carry a `litellm-` prefix so their Deployments do not
# collide with still-deployed toolhive MCPServer Deployments (same names in the
# ai namespace) during the coexistence window. `spec.alias` restores the
# original server name as rendered in the litellm proxy config.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-arr
spec:
  alias: arr
  proxyRef: litellm
  transport: http
  workload:
    # Digest pin verified against Docker Hub tag `node:24-alpine`
    # (multi-arch index, last updated 2026-09-18).
    image: docker.io/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    port: 8000
    command:
      - sh
      - -c
      # npm install runs ONCE at container boot; the stdio child is the plain
      # binary from PATH (no per-session npx). Concurrent session boots used
      # to race on the shared npx cache (/tmp/.npm/_npx): a process that found
      # the cache dir present skipped the install and died reading a
      # package.json that was not written yet (ENOENT — seen live on todoist
      # 2026-10-05 with a fresh emptyDir). The version pin must stay the last
      # <pkg>@<version> token on the line right below the renovate marker.
      # renovate: datasource=npm depName=mcp-arr-server
      - npm install -g --no-audit --no-fund supergateway mcp-arr-server@1.7.3 && exec supergateway --stdio mcp-arr --outputTransport streamableHttp --streamableHttpPath /mcp --port 8000 --stateful --sessionTimeout 600000
    env:
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp/.npm
      - name: SONARR_URL
        value: http://sonarr.download
      - name: RADARR_URL
        value: http://radarr.download
      - name: PROWLARR_URL
        value: http://prowlarr.download
      - name: SONARR_API_KEY
        valueFrom:
          secretKeyRef:
            name: toolhive-sonarr
            key: SONARR_API_KEY
      - name: RADARR_API_KEY
        valueFrom:
          secretKeyRef:
            name: toolhive-radarr
            key: RADARR_API_KEY
      - name: PROWLARR_API_KEY
        valueFrom:
          secretKeyRef:
            name: toolhive-prowlarr
            key: PROWLARR_API_KEY
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-seerr-mcp
spec:
  # Underscore (not dash): litellm server-name validation forbids '-' (render:
  # "Server name cannot contain '-'"). Only spec.alias changes, not metadata.name.
  alias: seerr_mcp
  proxyRef: litellm
  transport: http
  workload:
    image: docker.io/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    port: 8010
    command:
      - sh
      - -c
      # Boot-time npm install + plain-binary child (no per-session npx): see
      # litellm-arr above for the npx cache race rationale.
      # renovate: datasource=npm depName=@jhomen368/overseerr-mcp
      - npm install -g --no-audit --no-fund supergateway @jhomen368/overseerr-mcp@2.3.1 && exec supergateway --stdio overseerr-mcp --outputTransport streamableHttp --streamableHttpPath /mcp --port 8010 --stateful --sessionTimeout 600000
    env:
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp/.npm
      - name: SEERR_URL
        value: http://seerr.media
      - name: SEERR_API_KEY
        valueFrom:
          secretKeyRef:
            name: toolhive-seerr
            key: SEERR_API_KEY
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-todoist-mcp
spec:
  alias: todoist_mcp
  proxyRef: litellm
  transport: http
  # get-overview (project-wide rollup; noisy/expensive) is hidden for every
  # caller of todoist_mcp, mirroring the toolhive VirtualMCPServer exclusion
  # (kubernetes/apps/ai/toolhive/config/virtualmcpserver.yaml). Blacklist, not
  # allowlist, so new upstream tools stay visible; `params` passes the field
  # through to the generated mcp_servers entry (docs.litellm.ai/docs/mcp_control).
  params:
    disallowed_tools:
      - get-overview
  workload:
    image: docker.io/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    port: 8020
    command:
      - sh
      - -c
      # Boot-time npm install + plain-binary child (no per-session npx): see
      # litellm-arr above for the npx cache race rationale.
      # renovate: datasource=npm depName=@doist/todoist-mcp
      - npm install -g --no-audit --no-fund supergateway @doist/todoist-mcp@13.4.1 && exec supergateway --stdio todoist-mcp --outputTransport streamableHttp --streamableHttpPath /mcp --port 8020 --stateful --sessionTimeout 600000
    # Tool exclusion happens on the CR itself (spec.params.disallowed_tools —
    # formerly handled by the toolhive VirtualMCPServer aggregation config),
    # not on the workload.
    env:
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp/.npm
      - name: TODOIST_API_KEY
        valueFrom:
          secretKeyRef:
            name: toolhive-todoist
            key: TODOIST_API_KEY
    # 384Mi limit: stateful child per session + ~175Mi base (npm wrapper +
    # supergateway node) — 256Mi left no headroom for two concurrent sessions
    # (transient boot spikes OOMKilled this pod repeatedly, exit 137).
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-context7
spec:
  alias: context7
  proxyRef: litellm
  transport: http
  workload:
    image: docker.io/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    port: 8030
    command:
      - sh
      - -c
      # Boot-time npm install + plain-binary child (no per-session npx): see
      # litellm-arr above for the npx cache race rationale.
      # renovate: datasource=npm depName=@upstash/context7-mcp
      - npm install -g --no-audit --no-fund supergateway @upstash/context7-mcp@4.3.0 && exec supergateway --stdio context7-mcp --outputTransport streamableHttp --streamableHttpPath /mcp --port 8030 --stateful --sessionTimeout 600000
    env:
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp/.npm
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# PROBE DECISION (2026-10-03, read-only kubectl run in the ai namespace):
# gh-mcp-server --help / http --help confirm a native `http` subcommand
# ("Start an HTTP server that listens for MCP requests over HTTP", default
# port 8082, --port flag). Native streamable-http is supported, so this
# workload runs the binary directly over its HTTP transport — no supergateway
# wrap, and no fallback needed to the remote
# https://api.githubcopilot.com/mcp endpoint.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-github
spec:
  alias: github
  proxyRef: litellm
  transport: http
  # github-mcp-server requires `Authorization: Bearer <PAT>` per request; the
  # operator forwards auth_token as the bearer header on proxied calls.
  authType: bearer_token
  authTokenRef:
    name: toolhive-github
    key: token
  workload:
    # Tag not pinned upstream (source MCPServer had no tag either); glance
    # digest available if a later task wants to pin it.
    image: ghcr.io/github/github-mcp-server
    port: 8040
    args:
      - http
      - --port
      - "8040"
    env:
      - name: GITHUB_API_URL
        value: https://api.github.com
      - name: LOG_LEVEL
        value: info
      - name: GITHUB_PERSONAL_ACCESS_TOKEN
        valueFrom:
          secretKeyRef:
            name: toolhive-github
            key: token
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Single-container python (uv) stdio server bridged to streamable HTTP by
# mcp-proxy (stdio -> streamable HTTP), replacing the toolhive proxy pod.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-lightrag-mcp
spec:
  alias: lightrag_mcp
  proxyRef: litellm
  transport: http
  workload:
    image: ghcr.io/astral-sh/uv:python3.12-alpine
    port: 8050
    command:
      - sh
      - -c
    args:
      # lightrag-mcp (shemhamforash23) is configured via CLI args only —
      # no env fallback — so the API key is expanded at runtime from the
      # secret-injected LIGHTRAG_API_KEY env var (never committed to git).
      # mcp 2.0 (2026-07-28) removed mcp.server.fastmcp; lightrag-mcp
      # declares mcp>=1.6.0 with no upper bound, so constrain to latest 1.x.
      # The generated openapi-python-client sends the key as
      # `Authorization: Bearer <key>`, which the LightRAG auth middleware
      # parses as a JWT and rejects with 401 (API-key-only profile only
      # accepts the X-API-Key header). The inline -c patch wraps
      # AuthenticatedClient.__init__ so every client is built with the
      # key in the X-API-Key header instead (validated in-pod: 200 on
      # POST /query). Patch runs before `from lightrag_mcp.main import
      # main` so the wrapped __init__ is in place before any client is
      # instantiated.
      # The renovate marker lives inside the shell script because the
      # annotated-deps regex requires the pinned spec (unquoted, at line
      # end) on the line right below it; the shell ignores the comment
      # line. Literal block (|) keeps real newlines — a folded scalar (>-)
      # would collapse the script into one line and the # comment would
      # swallow the whole command.
      # NO renovate marker for the lightrag-mcp==0.1.1 pin (manual bump
      # required): the pin sits in the `uv run --with "mcp<2" --with
      # lightrag-mcp==0.1.1 python -c "…"` line, so it never ends a line —
      # the annotated-deps regex only matches a version at end-of-line on
      # the comment's immediate successor, and refactoring to a separate
      # matchable `pip install lightrag-mcp==0.1.1` step would change the
      # in-pod install/runtime layout that was validated during
      # migration. Note the pre-migration toolhive source
      # (mcp-servers/lightrag-mcp/mcpserver.yaml) had the same inert
      # placement, so no working renovate automation was lost — coverage
      # was already zero before the wrapper.
      - |
        # renovate: datasource=pypi depName=mcp-proxy
        pip install --quiet mcp-proxy==0.12.0 "mcp<2" &&
        exec mcp-proxy --host 0.0.0.0 --port 8050 --pass-environment -- sh -c '
        exec uv run --with "mcp<2" --with lightrag-mcp==0.1.1 python -c "
        from lightrag_mcp.client.light_rag_server_api_client.client import AuthenticatedClient
        _orig_init = AuthenticatedClient.__init__
        def _patched_init(self, *args, **kwargs):
            kwargs.setdefault(\"prefix\", \"\")
            kwargs.setdefault(\"auth_header_name\", \"X-API-Key\")
            _orig_init(self, *args, **kwargs)
        AuthenticatedClient.__init__ = _patched_init
        from lightrag_mcp.main import main
        main()" \
          --host lightrag.ai.svc.cluster.local --port 9621 \
          --api-key "$LIGHTRAG_API_KEY"'
    env:
      - name: HOME
        value: /tmp
      - name: UV_CACHE_DIR
        value: /tmp/.uv-cache
      - name: LIGHTRAG_API_KEY
        valueFrom:
          secretKeyRef:
            name: toolhive-lightrag
            key: LIGHTRAG_API_KEY
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    # Prefer the dedicated AI worker (k8s-3) — same node as the lightrag
    # service it proxies — but stay schedulable on any node if it is
    # unavailable; the toleration unlocks the workload=ai:NoSchedule taint
    # on k8s-3 (other nodes are untainted).
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [k8s-3]
    tolerations:
      - key: workload
        operator: Equal
        value: ai
        effect: NoSchedule
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
