---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Wrapped stdio MCP servers migrated from toolhive MCPServer CRs
# (kubernetes/apps/ai/toolhive/mcp-servers/*) during the litellm MCP gateway
# migration (see .superpowers/sdd/2026-10-03-litellm-mcp-migration).
#
# Every npm-based stdio server is wrapped with supergateway
# (stdio -> streamable HTTP at /mcp); flags verified against the supergateway
# README (github.com/supercorp-ai/supergateway): --stdio "<cmd>",
# --outputTransport streamableHttp, --streamableHttpPath /mcp, --port N.
# github-mcp-server supports native HTTP transport (probed in-pod 2026-10-03:
# `server http --port`, image ghcr.io/github/github-mcp-server), so it runs the
# binary directly instead of being wrapped.
# Note: workload CR names carry a `litellm-` prefix so their Deployments do not
# collide with still-deployed toolhive MCPServer Deployments (same names in the
# ai namespace) during the coexistence window. `spec.alias` restores the
# original server name as rendered in the litellm proxy config.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-arr
spec:
  alias: arr
  proxyRef: litellm
  transport: http
  workload:
    # Digest pin verified against Docker Hub tag `node:24-alpine`
    # (multi-arch index, last updated 2026-09-18).
    image: docker.io/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    port: 8000
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      # renovate: datasource=npm depName=mcp-arr-server
      - "npx -y mcp-arr-server@1.7.3"
      - --outputTransport
      - streamableHttp
      - --streamableHttpPath
      - /mcp
      - --port
      - "8000"
    env:
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp/.npm
      - name: SONARR_URL
        value: http://sonarr.download
      - name: RADARR_URL
        value: http://radarr.download
      - name: PROWLARR_URL
        value: http://prowlarr.download
      - name: SONARR_API_KEY
        valueFrom:
          secretKeyRef:
            name: toolhive-sonarr
            key: SONARR_API_KEY
      - name: RADARR_API_KEY
        valueFrom:
          secretKeyRef:
            name: toolhive-radarr
            key: RADARR_API_KEY
      - name: PROWLARR_API_KEY
        valueFrom:
          secretKeyRef:
            name: toolhive-prowlarr
            key: PROWLARR_API_KEY
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
