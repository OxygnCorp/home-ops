---
# Note: workload CR names carry a `litellm-` prefix inherited from the toolhive
# migration (the Deployments were originally named after the bare server name).
# `spec.alias` is the server name as rendered in the litellm proxy config.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-ha-mcp
spec:
  # Underscore (not dash): litellm server-name validation forbids '-' (render:
  # "Server name cannot contain '-' Found: ha-mcp"). Only spec.alias changes —
  # metadata.name stays dash-qualified for workload name-collision avoidance.
  alias: ha_mcp
  proxyRef: litellm
  transport: http
  workload:
    image: ghcr.io/homeassistant-ai/ha-mcp:9.3.0
    port: 8086
    command:
      - ha-mcp-web
    env:
      - name: HOMEASSISTANT_URL
        value: http://home-assistant.automation:8123
      - name: HOMEASSISTANT_TOKEN
        valueFrom:
          secretKeyRef:
            name: toolhive-home-assistant
            key: HOMEASSISTANT_TOKEN
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-unifi-network
spec:
  alias: unifi_network
  proxyRef: litellm
  transport: http
  workload:
    image: ghcr.io/sirkirby/unifi-network-mcp:0.50.3@sha256:fd0f3e020e24c82995bee5eb4a513724d324eebdc2e253d8ca72398afd0bed97
    port: 3000
    env:
      - name: UNIFI_NETWORK_HOST
        value: unifi.internal
      - name: UNIFI_NETWORK_SITE
        value: default
      - name: UNIFI_NETWORK_VERIFY_SSL
        value: "false"
      - name: UNIFI_MCP_HTTP_ENABLED
        value: "true"
      - name: UNIFI_MCP_HTTP_TRANSPORT
        value: streamable-http
      - name: UNIFI_MCP_HOST
        value: 0.0.0.0
      - name: UNIFI_MCP_PORT
        value: "3000"
      - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
        value: "false"
      - name: UNIFI_TOOL_REGISTRATION_MODE
        value: meta_only
      - name: UNIFI_POLICY_CREATE
        value: "false"
      - name: UNIFI_POLICY_UPDATE
        value: "false"
      - name: UNIFI_POLICY_DELETE
        value: "false"
      # Granular override (category+action beats the global flags above).
      # Opens ONLY networks and switch-port mutations — needed by the Puchu
      # agent (mcp-apps virtual key) for the Mngt -> VLAN 100 migration, with
      # UNIFI_TOOL_PERMISSION_MODE=confirm still requiring preview+confirm.
      - name: UNIFI_POLICY_NETWORK_NETWORKS_UPDATE
        value: "true"
      - name: UNIFI_POLICY_NETWORK_SWITCH_UPDATE
        value: "true"
      # Granular override (category+action beats the global flags above).
      # Opens ONLY firewall policy mutations — needed by the Puchu agent
      # (mcp-apps virtual key) for the inter-VLAN segmentation (new zone
      # "Restricted" for IOT/Cameras + allowlist rules), with
      # UNIFI_TOOL_PERMISSION_MODE=confirm still requiring preview+confirm.
      # DELETE is needed for rule cleanup: dead/duplicate segmentation rules
      # (e.g. rules created after a BLOCK that are never reached, replaced
      # CLIENT-MAC targeting) cannot be retired otherwise, and reorder via
      # the API needs cleanup of superseded rules — not just disable.
      - name: UNIFI_POLICY_NETWORK_FIREWALL_POLICIES_CREATE
        value: "true"
      - name: UNIFI_POLICY_NETWORK_FIREWALL_POLICIES_UPDATE
        value: "true"
      - name: UNIFI_POLICY_NETWORK_FIREWALL_POLICIES_DELETE
        value: "true"
      - name: UNIFI_TOOL_PERMISSION_MODE
        value: confirm
      - name: UNIFI_NETWORK_USERNAME
        valueFrom:
          secretKeyRef:
            name: toolhive-unifi-network-username
            key: UNIFI_NETWORK_USERNAME
      - name: UNIFI_NETWORK_PASSWORD
        valueFrom:
          secretKeyRef:
            name: toolhive-unifi-network-password
            key: UNIFI_NETWORK_PASSWORD
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-talos-mcp
spec:
  alias: talos_mcp
  proxyRef: litellm
  transport: http
  workload:
    image: registry.erwanleboucher.dev/eleboucher/talos-mcp:0.0.2
    port: 8080
    env:
      - name: TALOS_MCP_TRANSPORT
        value: http
      - name: TALOS_MCP_HTTP_ADDR
        value: ":8080"
    volumeMounts:
      - name: talosconfig
        mountPath: /var/run/secrets/talos.dev
        readOnly: true
    volumes:
      - name: talosconfig
        secret:
          secretName: litellm-talos-mcp-talosconfig
          defaultMode: 0400
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-flux
spec:
  alias: flux
  proxyRef: litellm
  transport: http
  # Read-only by policy: this cluster is GitOps (Flux), so cluster writes belong
  # in Git and cluster-side mutation is covered by radar (manage_gitops /
  # apply_resource / patch_resource). The flux MCP keeps only its unique
  # read-side value: Flux docs, get_flux_instance, trace_kubernetes_resource and
  # the read/log/metrics tools. The write tools are hidden here AND their RBAC
  # ClusterRole was dropped (see flux-mcp-rbac.yaml) so they cannot be reached
  # even if a caller calls them by name.
  # diff_kubernetes_manifest is excluded too: server-side dry-run requires real
  # create/patch grants, so keeping it would keep the write surface alive.
  params:
    disallowed_tools:
      - apply_kubernetes_manifest
      - delete_kubernetes_resource
      - diff_kubernetes_manifest
      - install_flux_instance
      - patch_kubernetes_resource
      - reconcile_flux_resource
      - resume_flux_reconciliation
      - suspend_flux_reconciliation
  workload:
    image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.63.1@sha256:556f9fbef8c10c6ded833463dc830708e82043cfe819296ade4fef32f87f8dd2
    port: 8000
    args:
      - serve
      - --transport=http
      - --port=8000
    env:
      # In-cluster mode: no KUBECONFIG; uses the pod service account.
      - name: RUNTIME_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    serviceAccountName: litellm-flux-mcp
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
