---
# Note: workload CR names carry a `litellm-` prefix so their Deployments do not
# collide with still-deployed toolhive MCPServer Deployments (same names in the
# ai namespace) during the coexistence window. `spec.alias` restores the
# original server name as rendered in the litellm proxy config.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-ha-mcp
spec:
  # Underscore (not dash): litellm server-name validation forbids '-' (render:
  # "Server name cannot contain '-' Found: ha-mcp"). Only spec.alias changes —
  # metadata.name stays dash-qualified for workload name-collision avoidance.
  alias: ha_mcp
  proxyRef: litellm
  transport: http
  workload:
    image: ghcr.io/homeassistant-ai/ha-mcp:8.6.0
    port: 8086
    command:
      - ha-mcp-web
    env:
      - name: HOMEASSISTANT_URL
        value: http://home-assistant.automation:8123
      - name: HOMEASSISTANT_TOKEN
        valueFrom:
          secretKeyRef:
            name: toolhive-home-assistant
            key: HOMEASSISTANT_TOKEN
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-unifi-network
spec:
  alias: unifi_network
  proxyRef: litellm
  transport: http
  workload:
    image: ghcr.io/sirkirby/unifi-network-mcp:0.36.5@sha256:58d2b15615dcda6c236fc3e9e1905e3186780a1b07173433950823ed9cdf230f
    port: 3000
    env:
      - name: UNIFI_NETWORK_HOST
        value: unifi.internal
      - name: UNIFI_NETWORK_SITE
        value: default
      - name: UNIFI_NETWORK_VERIFY_SSL
        value: "false"
      - name: UNIFI_MCP_HTTP_ENABLED
        value: "true"
      - name: UNIFI_MCP_HTTP_TRANSPORT
        value: streamable-http
      - name: UNIFI_MCP_HOST
        value: 0.0.0.0
      - name: UNIFI_MCP_PORT
        value: "3000"
      - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
        value: "false"
      - name: UNIFI_TOOL_REGISTRATION_MODE
        value: meta_only
      - name: UNIFI_POLICY_CREATE
        value: "false"
      - name: UNIFI_POLICY_UPDATE
        value: "false"
      - name: UNIFI_POLICY_DELETE
        value: "false"
      - name: UNIFI_TOOL_PERMISSION_MODE
        value: confirm
      - name: UNIFI_NETWORK_USERNAME
        valueFrom:
          secretKeyRef:
            name: toolhive-unifi-network-username
            key: UNIFI_NETWORK_USERNAME
      - name: UNIFI_NETWORK_PASSWORD
        valueFrom:
          secretKeyRef:
            name: toolhive-unifi-network-password
            key: UNIFI_NETWORK_PASSWORD
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-talos-mcp
spec:
  alias: talos_mcp
  proxyRef: litellm
  transport: http
  workload:
    image: registry.erwanleboucher.dev/eleboucher/talos-mcp:0.0.2
    port: 8080
    env:
      - name: TALOS_MCP_TRANSPORT
        value: http
      - name: TALOS_MCP_HTTP_ADDR
        value: ":8080"
    volumeMounts:
      - name: talosconfig
        mountPath: /var/run/secrets/talos.dev
        readOnly: true
    volumes:
      - name: talosconfig
        secret:
          secretName: litellm-talos-mcp-talosconfig
          defaultMode: 0400
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-flux
spec:
  alias: flux
  proxyRef: litellm
  transport: http
  workload:
    image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.61.0@sha256:b253ef07502413bcad89d8fb8f9c01d3cfa070331698323fbd8fe0ae9cfa1cb4
    port: 8000
    args:
      - serve
      - --transport=http
      - --port=8000
    env:
      # In-cluster mode: no KUBECONFIG; uses the pod service account.
      - name: RUNTIME_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    serviceAccountName: litellm-flux-mcp
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: litellm-kubectl
spec:
  alias: kubectl
  proxyRef: litellm
  transport: http
  workload:
    image: docker.io/rohitghumare64/kubectl-mcp-server:1.24.0@sha256:17134e36a3e1d3a5e457c12d61e8c7f7c52a7927c6ae4250131dfd95a74a2331
    port: 8000
    args:
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --read-only
    env:
      - name: MCP_K8S_PROVIDER
        value: in-cluster
      - name: PYTHONUNBUFFERED
        value: "1"
    serviceAccountName: litellm-kubectl-mcp-readonly
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
