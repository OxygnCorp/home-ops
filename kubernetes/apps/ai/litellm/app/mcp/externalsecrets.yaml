---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Bearer token of the `lens` MCP server (see ./remote.yaml for why it must be
# the admin token). Only ADMIN_TOKEN is pulled: SERVICE_TOKEN/GATEWAY_SECRET
# stay in the `lens-connection` Secret consumed by the proxy itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm-lens-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: lens
        property: ADMIN_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
  - extract:
      key: sonarr
