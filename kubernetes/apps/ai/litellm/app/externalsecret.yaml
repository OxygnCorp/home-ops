---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secret
    template:
      data:
        # App
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # Provider API keys — see kubernetes/apps/ai/litellm/app/virtualkeys/README.md
        # for the 1Password `litellm` item layout. Two OpenCode Go subscriptions
        # back the opencode-go-matt/ and opencode-go-agnes/ model folders and are
        # load-balanced by the litellm router per model group.
        OPENCODE_MATT_API_KEY: "{{ .OPENCODE_MATT_API_KEY }}"
        OPENCODE_AGNES_API_KEY: "{{ .OPENCODE_AGNES_API_KEY }}"
        # A2A peer tokens are the agents' existing LiteLLM virtual keys, reused
        # as the shared A2A credential (no second token set). dataFrom.extract
        # fetches the whole 1Password `litellm` item, but the default mergePolicy
        # (Replace) only writes template.data keys into the Secret — these
        # mappings are what put the keys in the proxy pods' environment.
        A2A_HERMES_DEFAULT: "{{ .LITELLM_API_KEY_HERMES_DEFAULT }}"
        A2A_HERMES_FOYER: "{{ .LITELLM_API_KEY_HERMES_FOYER }}"
        A2A_MAINCLAW_MAIN: "{{ .KEY_MAINCLAW_MAIN }}"
        A2A_MAINCLAW_NOVA: "{{ .KEY_MAINCLAW_NOVA }}"
        A2A_DEVCLAW_MAIN: "{{ .KEY_DEVCLAW_MAIN }}"
  dataFrom:
    - extract:
        key: litellm
