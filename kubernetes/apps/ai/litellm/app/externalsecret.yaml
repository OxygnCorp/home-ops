---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secret
    template:
      data:
        # App
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # Provider API keys — see kubernetes/apps/ai/litellm/app/virtualkeys/README.md
        # for the 1Password `litellm` item layout. Two OpenCode Go subscriptions
        # back the opencode-go-matt/ and opencode-go-agnes/ model folders and are
        # load-balanced by the litellm router per model group.
        OPENCODE_MATT_API_KEY: "{{ .OPENCODE_MATT_API_KEY }}"
        OPENCODE_AGNES_API_KEY: "{{ .OPENCODE_AGNES_API_KEY }}"
  dataFrom:
    - extract:
        key: litellm
---
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# PHOENIX_SYSTEM_API_KEY does not exist in the 1Password `phoenix` item
# until it is created in the Phoenix UI post-deploy (system key for
# ingestion). Until then this ExternalSecret stays in SecretSyncedError —
# acceptable while the deployment is deferred; the deploy-env ExternalSecret
# `phoenix` (observability/phoenix/app/externalsecret.yaml) syncs independently.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phoenix-otel
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: phoenix-otel
    creationPolicy: Owner
    template:
      data:
        # OTEL_EXPORTER_OTLP_HEADERS (W3C) format: a literal space is required
        # here because litellm parses the value without `unquote`
        # (OpenTelemetryConfig._get_headers_dictionary); the standard OTel SDK
        # also accepts non-encoded values in liberal mode. Phoenix requires the
        # `authorization` header.
        OTEL_EXPORTER_OTLP_HEADERS: 'Authorization=Bearer {{ .PHOENIX_SYSTEM_API_KEY }}'
        # Raw key, no Bearer prefix: litellm's OTel v2 `arize_phoenix` preset
        # reads PHOENIX_API_KEY and builds the auth header itself.
        PHOENIX_API_KEY: '{{ .PHOENIX_SYSTEM_API_KEY }}'
  data:
    - secretKey: PHOENIX_SYSTEM_API_KEY
      remoteRef:
        key: phoenix
        property: PHOENIX_SYSTEM_API_KEY
