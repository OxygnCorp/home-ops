---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secret
    template:
      data:
        # App
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # Provider API keys — see kubernetes/apps/ai/litellm/app/virtualkeys/README.md
        # for the 1Password `litellm` item layout. Two OpenCode Go subscriptions
        # back the opencode-go-matt/ and opencode-go-agnes/ model folders and are
        # load-balanced by the litellm router per model group.
        OPENCODE_MATT_API_KEY: "{{ .OPENCODE_MATT_API_KEY }}"
        OPENCODE_AGNES_API_KEY: "{{ .OPENCODE_AGNES_API_KEY }}"
        # A2A peer token for the Hermes agent (extraConfig.agents[].litellm_params.api_key
        # resolves os.environ/A2A_HERMES_TOKEN from this Secret). dataFrom.extract
        # fetches the whole 1Password `litellm` item, but the default mergePolicy
        # (Replace) only writes template.data keys into the Secret — without this
        # mapping the token never reaches the proxy pods.
        A2A_HERMES_TOKEN: "{{ .A2A_HERMES_TOKEN }}"
        A2A_HERMES_FOYER_TOKEN: "{{ .A2A_HERMES_FOYER_TOKEN }}"
        A2A_MAINCLAW_MAIN_TOKEN: "{{ .A2A_MAINCLAW_MAIN_TOKEN }}"
        A2A_MAINCLAW_FAMILY_TOKEN: "{{ .A2A_MAINCLAW_FAMILY_TOKEN }}"
        A2A_MAINCLAW_COACH_TOKEN: "{{ .A2A_MAINCLAW_COACH_TOKEN }}"
        A2A_MAINCLAW_FINANCE_TOKEN: "{{ .A2A_MAINCLAW_FINANCE_TOKEN }}"
        A2A_MAINCLAW_SHOPPING_TOKEN: "{{ .A2A_MAINCLAW_SHOPPING_TOKEN }}"
        A2A_MAINCLAW_MEDIA_TOKEN: "{{ .A2A_MAINCLAW_MEDIA_TOKEN }}"
        A2A_MAINCLAW_NOVA_TOKEN: "{{ .A2A_MAINCLAW_NOVA_TOKEN }}"
        A2A_MAINCLAW_LYCOS_TOKEN: "{{ .A2A_MAINCLAW_LYCOS_TOKEN }}"
        A2A_MAINCLAW_LEGAL_TOKEN: "{{ .A2A_MAINCLAW_LEGAL_TOKEN }}"
        A2A_MAINCLAW_ELINA_TOKEN: "{{ .A2A_MAINCLAW_ELINA_TOKEN }}"
        A2A_MAINCLAW_ELLIOT_TOKEN: "{{ .A2A_MAINCLAW_ELLIOT_TOKEN }}"
        A2A_DEVCLAW_MAIN_TOKEN: "{{ .A2A_DEVCLAW_MAIN_TOKEN }}"
  dataFrom:
    - extract:
        key: litellm
