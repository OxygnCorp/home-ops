---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secret
    template:
      data:
        # App
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # Provider API keys — see kubernetes/apps/ai/litellm/app/virtualkeys/README.md
        # for the 1Password `litellm` item layout. Two OpenCode Go subscriptions
        # back the opencode-go-matt/ and opencode-go-agnes/ model folders and are
        # load-balanced by the litellm router per model group.
        OPENCODE_MATT_API_KEY: "{{ .OPENCODE_MATT_API_KEY }}"
        OPENCODE_AGNES_API_KEY: "{{ .OPENCODE_AGNES_API_KEY }}"
  dataFrom:
    - extract:
        key: litellm
