---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: &app litellm
spec:
  applyMode: file
  image: ghcr.io/berriai/litellm-database:v1.104.0@sha256:fbe28229d2d02181c0a7d9df9599de614b491f3d897d2d7da18404f088310218
  # 2 replicas: one prefers the dedicated AI worker (k8s-3, closest to the
  # GPU embedding/reranker models it routes to), the other is forced onto a
  # different node by the hostname podAntiAffinity for HA.
  replicas: 2
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [k8s-3]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: litellm
              app.kubernetes.io/name: litellm
              app.kubernetes.io/managed-by: litellm-operator
  tolerations:
    # k8s-3 is reserved for AI workloads via workload=ai:NoSchedule.
    - key: workload
      operator: Equal
      value: ai
      effect: NoSchedule
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
      - litellm.oxygn.dev
    parentRefs:
      - name: envoy-internal
        namespace: network
  env:
    - name: TZ
      value: Europe/Paris
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: litellm-dragonfly
    - name: REDIS_PORT
      value: "6379"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          key: uri
          name: litellm-app
  envFrom:
    - secretRef:
        name: litellm-secret
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 2Gi
  podAnnotations:
    reloader.stakater.com/auto: "true"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  volumes:
    - name: session-hook
      configMap:
        name: litellm-configmap
        items:
          - key: session_hook.py
            path: session_hook.py
    - name: cache
      emptyDir: {}
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: session-hook
      mountPath: /app/hooks
      readOnly: true
    - name: cache
      mountPath: /app/cache
    - name: tmp
      mountPath: /tmp
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
    cooldown_time: 30
    enable_pre_call_checks: true
    # Pin each conversation to one OpenCode Go subscription so its upstream
    # prompt cache stays coherent, instead of re-rolling the dice on every
    # request. Requires a session id in `metadata.session_id`, which the
    # session hook injects from the client's x-opencode-session header.
    #
    # Failover is unaffected: the pin only ever narrows the candidate list to
    # deployments that are currently healthy, so a benched (429/5xx) deployment
    # is skipped and the request is served by the other subscription.
    optional_pre_call_checks:
      - session_affinity
    # Three-tier fallback policy reduced to two tiers after the MiniMax
    # subscription lapsed: tier 1 is implicit (every group's matt/agnes pair
    # load-balances within the group itself), tier 2 is longcat-2.5-free,
    # free and unmetered on the OpenCode Go promos (repoint at go-glm-5.3-flash
    # if the promo ends).
    #
    # Caveat: go-dsv4f-vision's fallbacks are not vision-capable — a vision
    # request that exhausts the group will fail differently, which still beats
    # having no net at all.
    fallbacks:
      # Flash-class OpenCode Go groups
      - dsv41f:
          - longcat-2.5-free
      - dsv41f-nothink:
          - longcat-2.5-free
      - go-glm-5.3-flash:
          - longcat-2.5-free
      - go-qwen3.8-flash:
          - longcat-2.5-free
      - mimo-v2.5:
          - longcat-2.5-free
      - go-dsv4f-vision:
          - longcat-2.5-free
      # Pro/heavy-class OpenCode Go groups
      - dsv4p:
          - longcat-2.5-free
      - go-glm-5.3:
          - longcat-2.5-free
      - go-qwen3.8-max:
          - longcat-2.5-free
      - go-kimi-k3:
          - longcat-2.5-free
      - go-kimi-k2.7-code:
          - longcat-2.5-free
      - qwen3.7-plus:
          - longcat-2.5-free
      - go-hy4-preview:
          - longcat-2.5-free
      - mimo-v2.5-pro:
          - longcat-2.5-free
  litellmSettings:
    callbacks:
      - prometheus
      - hooks.session_hook.service_session_injector
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    prometheus_adapter: true
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
    drop_params: true
    request_timeout: 3600
    num_retries: 1
    set_verbose: false
    model_group_settings:
      # Forward client x-* session headers for every model group (see old
      # config.yaml comment: fallback chains must not lose the session header).
      forward_client_headers_to_llm_api:
        - "*"
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
  extraConfig:
    environment:
      - OPENCODE_MATT_API_KEY
      - OPENCODE_AGNES_API_KEY
      - REDIS_HOST
      - REDIS_PORT
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
