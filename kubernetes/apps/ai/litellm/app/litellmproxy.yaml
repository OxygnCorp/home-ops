---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: &app litellm
spec:
  applyMode: file
  image: ghcr.io/berriai/litellm-database:1.110.4@sha256:d8cd8c5b8bde7e3959b22f5adbd5492d5a12be143173ebb1c7a4f30d07028005
  # 2 replicas: one prefers the dedicated AI worker (k8s-3, closest to the
  # GPU embedding/reranker models it routes to), the other is forced onto a
  # different node by the hostname podAntiAffinity for HA.
  replicas: 2
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [k8s-3]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: litellm
              app.kubernetes.io/name: litellm
              app.kubernetes.io/managed-by: litellm-operator
  tolerations:
    # k8s-3 is reserved for AI workloads via workload=ai:NoSchedule.
    - key: workload
      operator: Equal
      value: ai
      effect: NoSchedule
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
      - litellm.oxygn.dev
    parentRefs:
      - name: envoy-internal
        namespace: network
  env:
    - name: TZ
      value: Europe/Paris
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    # Admin UI SSO against Kanidm. The OAuth2 client + secret are
    # provisioned by components/oidc-kanidm/in-app (ConfigMap ->
    # kanidm-provision -> Secret kanidm-litellm-oidc). Optional
    # PROXY_ADMIN_ID is fetched by the separate `litellm-admin`
    # ExternalSecret from the 1Password `litellm` item (field
    # PROXY_ADMIN_ID = Kanidm account UUID); see README.
    - name: PROXY_BASE_URL
      value: https://litellm.oxygn.dev
    # Send /ui to the Kanidm SSO flow instead of showing the login form.
    # /fallback/login remains available for the database break-glass admin.
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
    - name: PROXY_ADMIN_ID
      valueFrom:
        secretKeyRef:
          name: litellm-admin
          key: PROXY_ADMIN_ID
          optional: true
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: kanidm-litellm-oidc
          key: client-id
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: kanidm-litellm-oidc
          key: client-secret
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://idm.oxygn.dev/ui/oauth2
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://idm.oxygn.dev/oauth2/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://idm.oxygn.dev/oauth2/openid/litellm/userinfo
    # Kanidm's stable subject is the account UUID; `preferred_username`
    # can be renamed and would create a new LiteLLM user.
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: email
    # Kanidm returns the display name in `name` (LiteLLM's default would
    # fall back to the `sub` UUID).
    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: name
    - name: GENERIC_SCOPE
      value: openid profile email
    # Kanidm enforces PKCE, including for confidential clients.
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    # Fail fast (401) if a callback lands on a replica that cannot find
    # the PKCE verifier, instead of trying the token exchange without it.
    - name: PKCE_STRICT_CACHE_MISS
      value: "true"
    - name: REDIS_HOST
      value: litellm-dragonfly
    - name: REDIS_PORT
      value: "6379"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          key: uri
          name: litellm-app
    # Agent tracing store (Lens). `optional: true` : si l'item 1Password `lens`
    # n'est pas encore créé, le gateway démarre quand même (tracing désactivé
    # avec un log). Le podAnnotations reloader relance le pod dès que
    # `lens-connection` apparaît ou change, donc pas besoin d'intervention.
    - name: LITELLM_LENS_URL
      value: http://lens.ai.svc.cluster.local:4318
    - name: LITELLM_LENS_PUBLIC_URL
      value: https://lens.oxygn.dev
    - name: LITELLM_LENS_SERVICE_TOKEN
      valueFrom:
        secretKeyRef:
          key: service-token
          name: lens-connection
          optional: true
    - name: LENS_GATEWAY_SECRET
      valueFrom:
        secretKeyRef:
          key: gateway-secret
          name: lens-connection
          optional: true
  envFrom:
    - secretRef:
        name: litellm-secret
  # Baseline is ~850Mi (gunicorn workers) with transient +1.4GiB spikes when
  # a client sends a ~200k-token prompt (router token counting + request
  # buffering). 2Gi got OOMKilled on 2026-10-25 (crash-loop while the client
  # retried against the fresh pod); 4Gi absorbs a spike on top of the plateau.
  resources:
    requests:
      cpu: 10m
      memory: 1Gi
    limits:
      memory: 4Gi
  podAnnotations:
    reloader.stakater.com/auto: "true"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  volumes:
    - name: session-hook
      configMap:
        name: litellm-configmap
        items:
          - key: session_hook.py
            path: session_hook.py
    - name: cache
      emptyDir: {}
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: session-hook
      mountPath: /app/hooks
      readOnly: true
    - name: cache
      mountPath: /app/cache
    - name: tmp
      mountPath: /tmp
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
    cooldown_time: 30
    enable_pre_call_checks: true
    # Pin each conversation to one OpenCode Go subscription so its upstream
    # prompt cache stays coherent, instead of re-rolling the dice on every
    # request. Requires a session id in `metadata.session_id`, which the
    # session hook injects from the client's x-opencode-session header.
    #
    # Failover is unaffected: the pin only ever narrows the candidate list to
    # deployments that are currently healthy, so a benched (429/5xx) deployment
    # is skipped and the request is served by the group's other deployment
    # when it has one (only the free models do while the Matt subscription is
    # parked — see models/opencode-go/kustomization.yaml), otherwise by the
    # tier-2 free-tier list below (`default_fallbacks`).
    optional_pre_call_checks:
      - session_affinity
    # Two-tier fallback policy: tier 1 is implicit (each group's matt/agnes
    # pair load-balances and retries within the group itself), tier 2 is the
    # free tier below, applied to every group without an explicit entry in
    # `fallbacks` — one list to maintain, new groups covered automatically.
    # The free groups themselves inherit it too, so one free model hands over
    # to the other.
    #
    # TEMPORARY (2026-11-26): the 27 paid Matt deployments are parked until
    # Agnès's Go renewal on 2026-11-29 (see models/opencode-go/kustomization.yaml),
    # so paid groups run a single deployment and tier 1 is inoperative for them:
    # their 429/5xx degrades straight to the tier-2 free list.
    #
    # Ordered: hy4-flash-free first (vision-capable + prompt caching, $0 on
    # the Go plan), then beam-free (text-only, 1M/131k) when it fails or is in
    # cooldown. Both are free only for a limited time: add, drop or reorder a
    # line here rather than in one entry per model group.
    default_fallbacks:
      - hy4-flash-free
      - beam-free
    # Embeddings and rerank are not chat and must never fall back to a chat
    # model: a keyed entry with an empty chain wins over `default_fallbacks`
    # (router-core `regular_targets` short-circuits on `Some([])`). Keep both.
    fallbacks:
      - qwen3-embedding-0.6b: []
      - qwen3-reranker-0.6b: []
  litellmSettings:
    # Semantic MCP tool filter: for /v1/responses and /v1/chat/completions
    # requests carrying MCP tools, narrow the per-request tool list to the
    # top-K semantically relevant tools (headers x-litellm-semantic-filter).
    # Uses the local TEI embedding server (LiteLLMModel qwen3-embedding-0.6b).
    # Does NOT affect direct /mcp clients: keys with tool search keep their
    # four virtual tools and keyword search (the two features coexist).
    # Fails gracefully: if the embedding model is unreachable, all tools pass.
    mcp_semantic_tool_filter:
      enabled: true
      embedding_model: qwen3-embedding-0.6b
      top_k: 10
      similarity_threshold: 0.3
    # Embedding backbone for the agent_search / skill_search virtual tools
    # (semantic ranking over the A2A agent registry and the skill registry).
    # With these set, the two tools answer on every tool-search key — empty
    # until agents (A2A agents: config) or skills (skill-hub) are registered;
    # if ever unset, they 400 with agent_search_not_configured /
    # skill_search_not_configured. Reuses the local TEI embedding model from
    # mcp_semantic_tool_filter above — no new provider, no new cost. Unlike
    # that filter (fails open), these fail closed: TEI down = embedding
    # error, no empty-list or keyword fallback.
    agent_search_embedding_model: qwen3-embedding-0.6b
    skill_search_embedding_model: qwen3-embedding-0.6b
    callbacks:
      - prometheus
      - hooks.session_hook.service_session_injector
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
    drop_params: true
    request_timeout: 3600
    num_retries: 1
    set_verbose: false
    model_group_settings:
      # Forward client x-* session headers for every model group (see old
      # config.yaml comment: fallback chains must not lose the session header).
      forward_client_headers_to_llm_api:
        - "*"
    # Tool search on by default for NEW keys: tools/list collapses the whole
    # MCP catalog into the four virtual tools (mcp_tool_search, mcp_tool_call,
    # agent_search, skill_search) and the LLM discovers real tools by keyword
    # token-overlap — no embedding model needed. Merged by /key/generate for
    # any key that leaves the field unset; does NOT retro-apply to existing
    # keys (one-time POST /key/update, see README.md "MCP").
    default_key_generate_params:
      object_permission:
        mcp_tool_search_enabled: true
  generalSettings:
    # The UI normal path is SSO. This rejects UI_USERNAME/UI_PASSWORD and the
    # master key on the UI login; the master key still works as an API bearer
    # token. Create and test the /fallback/login database admin first (README
    # "Break-glass and logout") before merging this.
    disable_env_credential_login: true
    health_check_endpoint: /v1/health
    store_model_in_db: false
    # The UI/API agent-card fetch runs through LiteLLM's SSRF guard, which
    # blocks private ClusterIPs. `user_url_allowed_hosts` is read from
    # general_settings on the pinned 1.110.x image (not litellm_settings,
    # despite the UI error text); upstream docs now point at litellm_settings,
    # so re-check both on a major bump. The allowlist applies to every
    # validate_url call site (image/file URLs, client-supplied api_base,
    # guardrail HTTP primitives, A2A push notifications), not just card
    # discovery — keep entries host:port and minimal. Allowlisted hosts still
    # resolve DNS and are rewritten to the resolved IP before connecting.
    user_url_allowed_hosts:
      - hermes-app.ai.svc.cluster.local:9900
      - mainclaw.ai.svc.cluster.local:18789
      - devclaw.ai.svc.cluster.local:18789
    tracing:
      store:
        type: lens
  extraConfig:
    # `extraConfig` is merged verbatim into the top level of config.yaml
    # (x-kubernetes-preserve-unknown-fields). The A2A registry is a top-level
    # `agents:` key since LiteLLM v1.96 — readable even with the attached DB.
    # Config-defined agents are not editable in the UI; Git is the source of
    # truth. Only the orchestrators are exposed: main/nova delegate to their
    # own specialists inside their gateway, so adding a specialist does not
    # need A2A plumbing. Each OpenClaw peer token is the agent's existing
    # LiteLLM virtual key (reused, not a second credential). Hermes uses each
    # profile's own key as that profile's peer token.
    # `url` is the base LiteLLM probes for the remote agent card at each
    # invocation (`<url>/.well-known/agent-card.json`); the card's advertised
    # interface URL is then used for JSON-RPC. For OpenClaw the base is the
    # gateway origin because the card lives there and advertises `/a2a/v1`;
    # appending `/a2a/v1` here makes card discovery 404. Hermes serves its
    # default card at `/` and the foyer card under `/foyer`. A wrong URL only
    # breaks invocation and UI discovery, not the proxy itself.
    agents:
      - agent_name: hermes-default
        agent_card_params:
          name: Hermes Default
          description: >-
            NousResearch Hermes gateway, default profile. Answers from its live
            session with memini memory over A2A JSON-RPC.
          url: http://hermes-app.ai.svc.cluster.local:9900
          protocolVersion: "1.0"
        litellm_params:
          # Hermes trusts the profile's own LiteLLM key as its peer token.
          api_key: os.environ/A2A_HERMES_DEFAULT
      - agent_name: hermes-foyer
        agent_card_params:
          name: Hermes Foyer
          description: >-
            NousResearch Hermes gateway, foyer profile. Household assistant
            with its own sessions and memini namespace.
          url: http://hermes-app.ai.svc.cluster.local:9900/foyer
          protocolVersion: "1.0"
        litellm_params:
          api_key: os.environ/A2A_HERMES_FOYER
      - agent_name: mainclaw-main
        agent_card_params:
          name: Mainclaw Claw
          description: >-
            Mainclaw orchestrator for general requests and cross-agent
            delegation to the mainclaw specialists.
          url: http://mainclaw.ai.svc.cluster.local:18789
          protocolVersion: "1.0"
        litellm_params:
          # OpenClaw peer token = this agent's existing LiteLLM virtual key.
          api_key: os.environ/A2A_MAINCLAW_MAIN
      - agent_name: mainclaw-nova
        agent_card_params:
          name: Mainclaw Nova
          description: >-
            Mainclaw orchestrator for projects and research; delegates to the
            mainclaw specialists.
          url: http://mainclaw.ai.svc.cluster.local:18789
          protocolVersion: "1.0"
        litellm_params:
          api_key: os.environ/A2A_MAINCLAW_NOVA
      - agent_name: devclaw-main
        agent_card_params:
          name: Devclaw Puchu
          description: >-
            Devclaw DevOps assistant for cluster, GitOps and infrastructure
            tasks.
          url: http://devclaw.ai.svc.cluster.local:18789
          protocolVersion: "1.0"
        litellm_params:
          api_key: os.environ/A2A_DEVCLAW_MAIN
    environment:
      - OPENCODE_MATT_API_KEY
      - OPENCODE_AGNES_API_KEY
      - REDIS_HOST
      - REDIS_PORT
      - A2A_HERMES_DEFAULT
      - A2A_HERMES_FOYER
      - A2A_MAINCLAW_MAIN
      - A2A_MAINCLAW_NOVA
      - A2A_DEVCLAW_MAIN
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
