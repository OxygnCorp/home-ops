---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: &app litellm
spec:
  applyMode: file
  image: ghcr.io/berriai/litellm-database:v1.100.1@sha256:fc44cf7f72786e636dc4dc1032b4e431818abfec9d54b8e04284fdea7ef03e2a
  replicas: 1
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
      - litellm.oxygn.dev
    parentRefs:
      - name: envoy-internal
        namespace: network
  env:
    - name: TZ
      value: Europe/Paris
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: litellm-dragonfly
    - name: REDIS_PORT
      value: "6379"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          key: uri
          name: litellm-app
  envFrom:
    - secretRef:
        name: litellm-secret
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 2Gi
  podAnnotations:
    reloader.stakater.com/auto: "true"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  volumes:
    - name: session-hook
      configMap:
        name: litellm-configmap
        items:
          - key: session_hook.py
            path: session_hook.py
    - name: cache
      emptyDir: {}
  volumeMounts:
    - name: session-hook
      mountPath: /app/hooks
      readOnly: true
    - name: cache
      mountPath: /app/cache
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
    cooldown_time: 30
    enable_pre_call_checks: true
    fallbacks:
      - MiniMax-M3:
          - go-minimax-m3
      - MiniMax-M2.7:
          - go-minimax-m2.7
      - dsv4f:
          - go-minimax-m3
      - go-glm-5.3:
          - MiniMax-M3
      - go-glm-5.3-flash:
          - dsv4f
      - go-qwen3.8-max:
          - dsv4p
  litellmSettings:
    callbacks:
      - prometheus
      - hooks.session_hook.service_session_injector
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    prometheus_adapter: true
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
    drop_params: true
    request_timeout: 3600
    num_retries: 1
    set_verbose: false
    model_group_settings:
      # Forward client x-* session headers for every model group (see old
      # config.yaml comment: fallback chains must not lose the session header).
      forward_client_headers_to_llm_api:
        - "*"
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
  extraConfig:
    environment:
      - MINIMAX_API_KEY
      - OPENCODE_API_KEY
      - REDIS_HOST
      - REDIS_PORT
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
