---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: pr-review
spec:
  proxyRef: litellm
  keyAlias: PrReview
  # Spend cap for the GitHub Actions PR-review workflows (ai-pr-review*.yaml
  # authenticate with this key). A busy automerge day chains many
  # multi-round reviews through the primary/smart/fallback routes; the cap
  # keeps a runaway tool loop from quietly billing the gateway. When it
  # trips, litellm rejects the call and the action's `on-model-failure:
  # notice` degrades the review to an advisory notice instead of blocking
  # the PR (fail-open by design). One number to raise if reviews prove
  # worth more.
  maxBudget: "1"
  # `daily` is LiteLLM's alias for a floating 24h window, not a calendar day.
  budgetDuration: daily
  secretName: litellm-key-pr-review
  secretKey: api-key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pr-review
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-pr-review
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: KEY_PR_REVIEW
