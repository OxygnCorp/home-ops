---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: repo-wiki
spec:
  proxyRef: litellm
  keyAlias: RepoWiki
  secretName: litellm-key-repo-wiki
  secretKey: api-key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: repo-wiki
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-repo-wiki
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm-key-repo-wiki
          property: credential
