---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-admin
  data:
    # The main `litellm` ExternalSecret uses the default `Replace` template
    # merge policy and only projects the keys listed in
    # `target.template.data`. Fetch the optional Kanidm UUID separately so
    # `PROXY_ADMIN_ID` doesn't require widening that template (which would
    # also pull the `KEY_*` virtual keys into the proxy pod).
    - secretKey: PROXY_ADMIN_ID
      remoteRef:
        key: litellm
        property: PROXY_ADMIN_ID
