---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmguardrail_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMGuardrail
metadata:
  name: headroom-compression
spec:
  # Compression pre_call via le sidecar Headroom (kubernetes/apps/ai/headroom),
  # cf docs/litellm.mdx + litellm int handler compression_interception.
  guardrail: headroom
  guardrailName: headroom-compression
  mode: pre_call
  apiBase: http://headroom.ai.svc.cluster.local:8787
  apiKeyRef:
    name: headroom
    key: HEADROOM_PROXY_TOKEN
  # defaultOn: appliqué à /v1/chat/completions & openai-routes par défaut
  # (cf plan compression guardrail).
  defaultOn: true
  params:
    unreachable_fallback: fail_open
    timeout: 10
