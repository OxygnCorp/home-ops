---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Token HEADROOM_PROXY_TOKEN — auth "Bearer" sur /v1/* et /metrics de headroom
# (items /livez + /readyz en sont exemptés). Réutilisé tel quel par le
# ServiceMonitor kube-prometheus-stack (cf. app kps externalsecret headroom.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name headroom
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  dataFrom:
    - extract:
        key: Headroom
  target:
    name: *name
    template:
      data:
        HEADROOM_PROXY_TOKEN: "{{ .HEADROOM_PROXY_TOKEN }}"
