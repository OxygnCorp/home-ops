---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-reranker-0.6b
spec:
  format: gguf
  quantization: Q8_0
  source: https://huggingface.co/ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/resolve/main/qwen3-reranker-0.6b-q8_0.gguf
  hardware:
    accelerator: cuda
    gpu:
      count: 1
      enabled: true
      layers: 99
      vendor: nvidia
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-reranker-0.6b
spec:
  modelRef: qwen3-reranker-0.6b
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:e8318a7b3988f9ca57b28c03486569e60def08f2b7b060550ebfa046e175e6cb
  runtimeClassName: nvidia
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: k8s-3
  tolerations:
    - key: workload
      operator: Equal
      value: ai
      effect: NoSchedule
  # Physical batch must cover the longest single input: llama.cpp pooling
  # (rerank/embedding) requires the whole sequence in one ubatch, so any
  # input in (batchSize, contextSize] fails with "input too large to
  # process". Keep batchSize == contextSize (2048). Observed rerank pairs
  # reached 1907 tokens before this bump.
  contextSize: 2048
  parallelSlots: 1
  batchSize: 2048
  uBatchSize: 2048
  resources:
    gpu: 1
    cpu: 100m
  extraArgs:
    - --rerank
    - --pooling
    - rank
    - --cache-ram
    - "0"
    - --load-mode
    - none
    - --alias
    - qwen3-reranker-0.6b
    - --metrics
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
