---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lightrag
  labels:
    # Net-new CNPG cluster: plain initdb, no Barman recovery (see
    # kubernetes/flux/cluster/ks.yaml). Remove after the first scheduled backup.
    components.postgres/cnpg: init
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: lightrag
  components:
    - ../../../../components/postgres
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: miroir-config
      namespace: miroir-system
    - name: litellm
      namespace: ai
    - name: kopiur
      namespace: kopiur-system
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/ai/lightrag/app
  postBuild:
    substitute:
      APP: lightrag
      KOPIUR_CAPACITY: "20Gi"
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
