---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lightrag
spec:
  # Empty list: the postgres component appends its cloudnative-pg dependency here.
  dependsOn: []
  chartRef:
    kind: OCIRepository
    name: lightrag
  interval: 1h
  values:
    controllers:
      lightrag:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/hkuds/lightrag
              tag: v1.5.7
            env:
              TZ: Europe/Paris
              # Server
              HOST: 0.0.0.0
              PORT: &port 9621
              WORKING_DIR: /app/data/rag_storage
              INPUT_DIR: /app/data/inputs
              PROMPT_DIR: /app/data/prompts
              # Logging (root filesystem is read-only; write logs to emptyDir)
              LOG_DIR: /tmp
              TIKTOKEN_CACHE_DIR: /app/data/tiktoken
              # LLM via litellm (OpenAI-compatible gateway)
              LLM_BINDING: openai
              LLM_BINDING_HOST: http://litellm.ai.svc.cluster.local:4000/v1
              LLM_MODEL: MiniMax-M3
              # Indexing (high volume): fast, cheap-cache model, reasoning off.
              EXTRACT_LLM_MODEL: dsv41f-nothink
              KEYWORD_LLM_MODEL: dsv41f-nothink
              # Query (low volume, quality-critical).
              QUERY_LLM_MODEL: MiniMax-M3
              MAX_ASYNC_LLM: "4"
              LLM_TIMEOUT: "480"
              ENTITY_EXTRACTION_USE_JSON: "true"
              SUMMARY_LANGUAGE: French
              # Chunking / parsing
              CHUNK_SIZE: "1000"
              CHUNK_OVERLAP_SIZE: "100"
              # pdf:docling route les PDF (y compris scannés image-only) vers
              # docling-serve pour OCR + extraction de structure. Les autres
              # formats gardent le chunking Tree-sitter (native-teP) et le
              # fallback legacy-R. L'ordre des règles est significatif :
              # la première règle matchant gagne.
              LIGHTRAG_PARSER: "pdf:docling,*:native-teP,*:legacy-R"
              # Service interne (ClusterIP, aucune route) — cf. spec D4 :
              # pas d'auth API key, isolation réseau uniquement.
              DOCLING_ENDPOINT: "http://docling-serve.ai.svc.cluster.local:5001"
              # OCR activé pour les pages image-only.
              DOCLING_DO_OCR: "true"
              # false = n'OCR que les pages sans couche texte. Évite le ×3 de
              # temps de traitement sur un PDF mixte (contrats avec pages
              # scannées ET pages textuelles) — cf. spec D7.
              DOCLING_FORCE_OCR: "false"
              # 2 conversions PDF en parallèle (default upstream = 1) pour
              # réduire le temps total d'indexation d'un lot — cf. spec D8.
              MAX_PARALLEL_PARSE_DOCLING: "2"
              # 5 min : generous pour un PDF technique avec tableaux complexes
              # au premier passage (warmup modèles).
              DOCLING_TIMEOUT: "300"
              # Storage — production backend: PostgreSQL (pgvector for vectors,
              # plain-table graph, no Apache AGE). Replaces the file-based
              # Json/Nano/NetworkX defaults, which upstream marks test-only.
              LIGHTRAG_KV_STORAGE: PGKVStorage
              LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
              LIGHTRAG_GRAPH_STORAGE: PGTableGraphStorage
              LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
              POSTGRES_HOST: lightrag-rw
              POSTGRES_WORKSPACE: lightrag
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: lightrag-app
                    key: port
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: lightrag-app
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: lightrag-app
                    key: password
              POSTGRES_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: lightrag-app
                    key: dbname
              # Embeddings via litellm → qwen3-embedding-0.6b model group (OpenAI-compatible, GPU shared with memini)
              EMBEDDING_BINDING: openai
              EMBEDDING_BINDING_HOST: http://litellm.ai:4000
              EMBEDDING_MODEL: qwen3-embedding-0.6b
              EMBEDDING_DIM: "1024"
              # qwen3 expects asymmetric prefixes (instruct on query, none on doc);
              # EMBEDDING_DOCUMENT_PREFIX=NO_PREFIX is LightRag's sentinel for "no doc prefix".
              EMBEDDING_ASYMMETRIC: "true"
              EMBEDDING_QUERY_PREFIX: "Instruct: Given a search query, retrieve relevant passages that answer the query\nQuery: "
              EMBEDDING_DOCUMENT_PREFIX: "NO_PREFIX"
              # qwen3 ctx=2048; keep headroom for prefix + special tokens
              EMBEDDING_TOKEN_LIMIT: "1800"
              EMBEDDING_BINDING_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: lightrag-secret
                    key: EMBEDDING_BINDING_API_KEY
              # Shared GTX 1050 Ti (time-slicing, parallelSlots=1); batch size is
              # bounded by the model's maxInputTokens and the GPU's VRAM.
              EMBEDDING_BATCH_NUM: "16"
              EMBEDDING_FUNC_MAX_ASYNC: "2"
              EMBEDDING_TIMEOUT: "120"
              # Reranker via litellm (Cohere-compatible endpoint; the host must
              # be the full path, not the bare base URL).
              RERANK_BINDING: cohere
              RERANK_BINDING_HOST: http://litellm.ai:4000/v1/rerank
              RERANK_MODEL: qwen3-reranker-0.6b
              RERANK_BINDING_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: lightrag-secret
                    key: EMBEDDING_BINDING_API_KEY

            envFrom:
              - secretRef:
                  name: lightrag-secret
            probes:
              # tcpSocket (not httpGet) — robust without asserting an exact
              # health-endpoint path on first deploy.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              # readOnlyRootFilesystem omitted for first deploy: the image
              # may write Python caches / scratch under / at startup.
              # Durable state is on the data PVC; /tmp is tmpfs below.
              # Revisit with RO rootfs once the image's write paths are
              # confirmed clean.
              seccompProfile:
                type: RuntimeDefault
    defaultPodOptions:
      # Prefer the dedicated AI worker (k8s-3) — closest to the qwen3
      # embedding/reranker models lightrag queries through litellm — but stay
      # schedulable on any node if it is unavailable; the toleration unlocks
      # the workload=ai:NoSchedule taint on k8s-3 (other nodes are untainted).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-3]
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: lightrag
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - lightrag.oxygn.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
