---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm-operator
spec:
  chartRef:
    kind: OCIRepository
    name: litellm-operator
  interval: 15m
  values:
    controller:
      logLevel: info
      leaderElection:
        enabled: true
    llmkube:
      # The projection mirrors llmkube InferenceServices into LiteLLMModel CRs
      # (provider openai/, apiBase trimmed from the ISvc endpoint). Our two
      # ISvcs (qwen3-embedding-0.6b, qwen3-reranker-0.6b) are managed in Git
      # under the same names — the projection would fight Flux and its openai/
      # rerank rendering is rejected by litellm (no openai rerank provider).
      autoRegister: false
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
