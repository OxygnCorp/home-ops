---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-unifi-network-username
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        UNIFI_NETWORK_USERNAME: "{{ .UNIFI_PUCHU_USERNAME }}"
  dataFrom:
    - extract:
        key: unifi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-unifi-network-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        UNIFI_NETWORK_PASSWORD: "{{ .UNIFI_PUCHU_PASSWORD }}"
  dataFrom:
    - extract:
        key: unifi
