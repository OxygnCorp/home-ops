---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: lightrag-mcp
spec:
  image: ghcr.io/astral-sh/uv:python3.12-alpine
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  env:
    - name: LIGHTRAG_HOST
      value: lightrag.ai.svc.cluster.local
    - name: LIGHTRAG_PORT
      value: "9621"
  secrets:
    - name: toolhive-lightrag
      key: LIGHTRAG_API_KEY
      targetEnvName: LIGHTRAG_API_KEY
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      # Prefer the dedicated AI worker (k8s-3) — same node as the lightrag
      # service it proxies — but stay schedulable on any node if it is
      # unavailable; the toleration unlocks the workload=ai:NoSchedule taint
      # on k8s-3 (other nodes are untainted).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-3]
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: mcp
          image: ghcr.io/astral-sh/uv:python3.12-alpine
          command:
            - uvx
          args:
            # mcp 2.0 (2026-07-28) removed mcp.server.fastmcp; mcp-lightrag 0.2.2
            # declares mcp>=1.2.0 with no upper bound, so constrain to latest 1.x.
            - --with
            - mcp<2
            # renovate: datasource=pypi depName=mcp-lightrag
            - mcp-lightrag==0.2.2
          env:
            - name: HOME
              value: /tmp
            - name: UV_CACHE_DIR
              value: /tmp/.uv-cache
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
