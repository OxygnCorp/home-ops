---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: lightrag-mcp
spec:
  image: ghcr.io/astral-sh/uv:python3.12-alpine
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  secrets:
    - name: toolhive-lightrag
      key: LIGHTRAG_API_KEY
      targetEnvName: LIGHTRAG_API_KEY
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # The toolhive streamable proxy caps each MCP request at 60s by default
  # (TOOLHIVE_PROXY_REQUEST_TIMEOUT); lightrag queries routinely take longer
  # than that (measured ~97 s), which surfaces as -32000 "Timeout" on
  # tools/call in openclaw. ResourceOverrides.proxyDeployment.env is the
  # operator-supported way to set env vars on the proxy container itself
  # (spec.env only reaches the workload container).
  resourceOverrides:
    proxyDeployment:
      env:
        - name: TOOLHIVE_PROXY_REQUEST_TIMEOUT
          value: "5m"
  podTemplateSpec:
    spec:
      # Prefer the dedicated AI worker (k8s-3) — same node as the lightrag
      # service it proxies — but stay schedulable on any node if it is
      # unavailable; the toleration unlocks the workload=ai:NoSchedule taint
      # on k8s-3 (other nodes are untainted).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-3]
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: mcp
          image: ghcr.io/astral-sh/uv:python3.12-alpine
          command:
            - sh
            - -c
          args:
            # lightrag-mcp (shemhamforash23) is configured via CLI args only —
            # no env fallback — so the API key is expanded at runtime from the
            # secret-injected LIGHTRAG_API_KEY env var (never committed to git).
            # mcp 2.0 (2026-07-28) removed mcp.server.fastmcp; lightrag-mcp
            # declares mcp>=1.6.0 with no upper bound, so constrain to latest 1.x.
            # The generated openapi-python-client sends the key as
            # `Authorization: Bearer <key>`, which the LightRAG auth middleware
            # parses as a JWT and rejects with 401 (API-key-only profile only
            # accepts the X-API-Key header). The inline -c patch wraps
            # AuthenticatedClient.__init__ so every client is built with the
            # key in the X-API-Key header instead (validated in-pod: 200 on
            # POST /query). Patch runs before `from lightrag_mcp.main import
            # main` so the wrapped __init__ is in place before any client is
            # instantiated.
            # The renovate marker lives inside the shell script because the
            # annotated-deps regex requires the pinned spec (unquoted, at line
            # end) on the line right below it; the shell ignores the comment
            # line. Literal block (|) keeps real newlines — a folded scalar (>-)
            # would collapse the script into one line and the # comment would
            # swallow the whole command.
            - |
              # renovate: datasource=pypi depName=lightrag-mcp
              exec uv run --with 'mcp<2' --with lightrag-mcp==0.1.1 python -c '
              from lightrag_mcp.client.light_rag_server_api_client.client import AuthenticatedClient
              _orig_init = AuthenticatedClient.__init__
              def _patched_init(self, *args, **kwargs):
                  kwargs.setdefault("prefix", "")
                  kwargs.setdefault("auth_header_name", "X-API-Key")
                  _orig_init(self, *args, **kwargs)
              AuthenticatedClient.__init__ = _patched_init
              from lightrag_mcp.main import main
              main()' \
                --host lightrag.ai.svc.cluster.local --port 9621 \
                --api-key "$LIGHTRAG_API_KEY"
          env:
            - name: HOME
              value: /tmp
            - name: UV_CACHE_DIR
              value: /tmp/.uv-cache
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
