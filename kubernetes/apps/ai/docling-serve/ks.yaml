---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: docling-serve
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: docling-serve
  components:
    # Provisionne le PVC docling-serve (20Gi, miroir-slow-local) et le
    # branche sur la sauvegarde kopiur horaire.
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/ai/docling-serve/app
  postBuild:
    substitute:
      APP: docling-serve
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_STORAGECLASS: miroir-slow-local
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
