---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: docling-serve
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: docling-serve
  components:
    # Provisionne le PVC docling-serve (20Gi, miroir-slow) et le
    # branche sur la sauvegarde kopiur horaire.
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    # Garantit l'existence de la StorageClass miroir-slow avant la
    # création du PVC (miroir-slow = DRBD replicas 2, accessible
    # cross-node ; miroir-slow-local épine le PV au node du premier
    # consumer et deadlock le job populator sur un node tainté
    # workload=ai, cf. PR #4705 post-merge).
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/ai/docling-serve/app
  postBuild:
    substitute:
      APP: docling-serve
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_STORAGECLASS: miroir-slow
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
