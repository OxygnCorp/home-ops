---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name lens-admin
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: admin-token
      remoteRef:
        key: lens
        property: ADMIN_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Secret PARTAGÉ avec litellm (kubernetes/apps/ai/litellm/app/litellmproxy.yaml):
#   - service-token  -> LITELLM_LENS_SERVICE_TOKEN (LiteLLM -> Lens)
#   - gateway-secret -> LENS_GATEWAY_SECRET (Lens vérifie l'identité envoyée par LiteLLM)
# Générer deux valeurs DISTINCTES (openssl rand -hex 32), et ne pas les
# confondre avec l'admin token ni avec les clés d'agents (tracing keys).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name lens-connection
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: service-token
      remoteRef:
        key: lens
        property: SERVICE_TOKEN
    - secretKey: gateway-secret
      remoteRef:
        key: lens
        property: GATEWAY_SECRET
