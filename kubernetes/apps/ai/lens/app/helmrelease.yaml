---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lens
spec:
  chartRef:
    kind: OCIRepository
    name: lens
  interval: 30m
  # Placement de ClickHouse : les images amd64 de ClickHouse >= 26.6 sont
  # compilées pour x86-64-v3 (AVX2) et meurent en SIGILL (exit 132,
  # "Illegal instruction") sur un vCPU sans AVX2 — le cas des VMs Proxmox
  # en type `kvm64`. k8s-3 est le seul noeud qui expose AVX2, et il est
  # tainté `workload=ai:NoSchedule`. Le chart n'expose aucun
  # nodeSelector/tolerations pour le StatefulSet ClickHouse : on patche donc
  # le manifeste rendu. Correctif de fond côté infra : passer les VMs en CPU
  # `host` (stop/start), ce qui rendra ce patch inutile.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: lens-clickhouse
            patch: |
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  kubernetes.io/hostname: k8s-3
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - key: workload
                    operator: Equal
                    value: ai
                    effect: NoSchedule
  values:
    # Le chart épingle lui-même `image.digest` (sha256:489a007c…) dans
    # ses values : chaque version du chart embarque le digest de son image.
    # Ne pas surcharger `image.tag`/`image.digest` ici, sinon le pod peut
    # tourner avec une image qui ne correspond plus au protocole du chart.
    replicaCount: 1
    # Origine navigateur (UI + endpoints OTLP affichés aux agents). Le chart
    # exige une valeur non vide ; l'app valide l'URL et trim les slashs.
    publicUrl: https://lens.oxygn.dev
    # Pas d'ingress Ingress : le Service est exposé par ./httproute.yaml
    # (Envoy Gateway, gateway envoy-internal du namespace network).
    ingress:
      enabled: false
    # Tokens fournis par ./externalsecret.yaml (1Password item `lens`).
    # Ne PAS laisser le chart les générer : en GitOps le rendu se fait à
    # chaque sync et un secret généré dériverait (le chart utilise `lookup`,
    # donc en pratique il réutiliserait l'existant, mais on veut la source
    # de vérité dans 1Password).
    adminTokenSecret:
      name: lens-admin
      key: admin-token
    # Connexion LiteLLM <-> Lens : les DEUX services lisent le même Secret
    # `lens-connection` (service-token ici, gateway-secret côté litellm).
    gateway:
      enabled: true
      secretName: lens-connection
      secretKey: gateway-secret
    serviceTokenSecret:
      name: lens-connection
      key: service-token
    # Traces : 14 jours de rétention. Le TTL supprime les lignes expirées,
    # mais ClickHouse ne rend pas l'espace disque : augmenter la rétention
    # demande d'augmenter le PVC en même temps.
    retentionDays: 14
    clickhouse:
      # Pas de surcharge d'image : on garde le digest du chart (26.9.6.6,
      # x86-64-v3/AVX2) — d'où le placement sur k8s-3 via le postRenderer
      # ci-dessus, seul node qui expose AVX2. Si les VMs Proxmox passent un jour
      # en CPU `host`, le postRenderer peut être retiré.
      # PV local : les traces sont assumées perdues si le node qui porte le
      # volume disparaît (pas de composant kopiur sur ce PVC). Le volume est
      # épinglé à k8s-3 par le postRenderer ci-dessus — d'où le dependsOn
      # miroir-config dans ../ks.yaml (l'agent miroir tourne bien sur k8s-3).
      storage: 20Gi
      storageClassName: miroir-slow-local
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi
    # Model gateway for Lens' own analysis/investigations (Settings -> Analysis).
    # Trace ingestion works without it; only analysis runs need a provider, and
    # this is the "no model gateway configured" the UI warns about. Lens reads
    # both at startup, asks /model_group/info which models the key may reach,
    # and bills its own calls through that key — minted by the operator from the
    # LensAnalysis LiteLLMVirtualKey in the litellm app, so no value in Git.
    #
    # `optional: true` on purpose: the operator creates the Secret moments after
    # the CR is applied, and a missing key would otherwise park the pod in
    # CreateContainerConfigError and fail the whole HelmRelease. If the key shows
    # up late, roll the Deployment once (kubectl -n ai rollout restart deploy/lens):
    # the chart exposes no pod-template annotation, so reloader cannot watch it.
    extraEnv:
      - name: LENS_GATEWAY_API_BASE
        value: http://litellm.ai:4000
      - name: LENS_GATEWAY_API_KEY
        valueFrom:
          secretKeyRef:
            name: lens-analysis
            key: api-key
            optional: true
