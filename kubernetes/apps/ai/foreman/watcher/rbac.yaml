---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foreman-watcher
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foreman-watcher
rules:
  - apiGroups:
      - foreman.llmkube.dev
    resources:
      - workloads
    verbs:
      - create
      - get
      - list
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foreman-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: foreman-watcher
subjects:
  - kind: ServiceAccount
    name: foreman-watcher
