---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foreman-watcher
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: foreman-watcher
    template:
      data:
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
  data:
    # Same 1Password item as the foreman agents (item `foreman`); the watcher
    # only needs issues:read (+ issues:write best-effort for label cleanup
    # and completion comments — absent permissions degrade gracefully).
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: foreman
        property: GITHUB_TOKEN
