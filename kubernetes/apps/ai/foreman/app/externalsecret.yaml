---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foreman-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: foreman-agent
    template:
      data:
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        LITELLM_API_KEY: "{{ .credential }}"
  data:
    # 1Password item `foreman`, field GITHUB_TOKEN — fine-grained PAT,
    # contents:read+write on OxygnCorp/home-ops only (the bot pushes branches
    # foreman/*/issue-N and opens PRs).
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: foreman
        property: GITHUB_TOKEN
    # Pushed back to 1Password by litellm/app/virtualkeys/foreman.yaml
    - secretKey: credential
      remoteRef:
        key: litellm
        property: key-foreman
