---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /mnt/repository
      volume:
        nfs:
          server: funkstation.internal
          path: /volume1/Volsync
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  catalog:
    fallbackNamespace: kopiur-system
    periodicRefresh: true
    refreshInterval: 1h
  create:
    enabled: false # adopt the existing volsync kopia repository, never re-initialize
  server:
    namespace: kopiur-system
    auth:
      generate:
        username: admin
    readOnly: false # allow snapshot deletion/maintenance from the kopia web UI
    service:
      type: ClusterIP
      port: 51515
    podSecurityContext:
      runAsUser: 1024
      runAsGroup: 100
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
  credentialProjection:
    allowed: true
  identityDefaults:
    hostnameExpr: "namespace"
    usernameExpr: "namespace + '-' + policyName"
  scheduleDefaults:
    timezone: Europe/Paris
  parameters:
    epoch:
      # kopia default is 24h: an epoch cannot close before it is older than
      # minDuration and compaction trails two epochs behind, so hourly snapshot
      # schedules accumulate thousands of uncompacted index blobs (6180 and
      # climbing) no matter how often maintenance runs. 2h lets epochs close
      # three times faster than 6h and full maintenance compact them; with a
      # single serialized writer (kopiur movers) the extra epoch-advance
      # churn is negligible. See docs/maintenance.md ("index-blob health") in
      # the kopiur repo.
      minDuration: 2h
  maintenance:
    enabled: true
    namespace: kopiur-system
    schedule:
      full:
        cron: "0 3 * * *"
        jitter: 1h
      quick:
        cron: "0 */6 * * *"
        jitter: 30m
      timezone: Europe/Paris
  mode: ReadWrite
  moverDefaults:
    tolerations:
      # Movers are pinned by their staging PVC's node affinity
      # (miroir-slow-local) to the node holding the snapshot data. A source
      # PVC on the tainted GPU worker k8s-3 (workload=ai:NoSchedule) left its
      # mover Unschedulable on every node: 1 untolerated taint + 3 PV affinity
      # mismatches -> MoverPodWedged, every docling-serve snapshot failed.
      # Snapshot movers are node-pinned by their staging PVs, so this only
      # unblocks the ones whose data lives on k8s-3; maintenance/discovery
      # jobs (NFS backend only, no PV affinity) merely become eligible.
      - key: workload
        operator: Equal
        value: ai
        effect: NoSchedule
    cache:
      # Local (non-replicated) class for the mover kopia caches: replicated
      # staging churns DRBD on every backup run (snapshot/freeze/teardown) and
      # was the trigger for the LINBIT/drbd#137 teardown wedge (see
      # home-operations/miroir#262). Cache loss on node failure is acceptable:
      # it rebuilds from the repository on the next mover run.
      storageClassName: miroir-slow-local
      # Kopia's own defaults are 5000 MiB per budget, larger than the whole
      # cache PVC (KOPIUR_CAPACITY default 5Gi), so the sweeper never runs and
      # the cache fills the volume. The metadata budget applies twice: kopia
      # caps the index-blobs cache at the same size.
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
    securityContext:
      runAsUser: 1024
      runAsGroup: 100
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
