---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-offsite-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-offsite-secret
  data:
    # Must be the same value as the `nas` repository password: the
    # ClusterRepository seed copies the already-initialised (and encrypted)
    # repository config. Keyed explicitly (not via dataFrom) so that adding a
    # KOPIA_PASSWORD to the `kopiur-offsite` item can never shadow this one.
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur
        property: KOPIA_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: kopiur-offsite
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kopiur-offsite
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: kopiur-offsite
        property: S3_ENDPOINT
    - secretKey: S3_BUCKET
      remoteRef:
        key: kopiur-offsite
        property: S3_BUCKET
