---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-offsite-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-offsite-secret
  data:
    # Must be the same value as the `nas` repository password: the
    # ClusterRepository seed copies the already-initialised (and encrypted)
    # repository config, so the formats and passwords must match verbatim.
    # Keyed explicitly (not via dataFrom) so the source field stays pinned.
    # Same password =
    # same blast radius as `nas`: whoever holds the R2 credentials AND this
    # password can decrypt the entire inherited history.
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur
        property: KOPIA_PASSWORD
    # The operator reads only these two keys from the S3 secret; endpoint and
    # bucket live in the ClusterRepository spec, so S3_ENDPOINT/S3_BUCKET
    # entries here would be dead weight that silently "looks" configurable.
    # Both keys already live in the `kopiur` 1Password item (as
    # CLOUDFLARE_R2_*) alongside KOPIA_PASSWORD: no separate item needed.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: kopiur
        property: CLOUDFLARE_R2_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kopiur
        property: CLOUDFLARE_R2_SECRET_ACCESS_KEY
