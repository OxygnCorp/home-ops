---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-offsite-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-offsite-secret
    template:
      engineVersion: v2
      data:
        # Must be the same value as the `kopiur` item's KOPIA_PASSWORD: the
        # ClusterRepository seed copies the already-initialised (and encrypted)
        # repository config from the `nas` repository.
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        S3_ENDPOINT: "{{ .S3_ENDPOINT }}"
        S3_BUCKET: "{{ .S3_BUCKET }}"
  dataFrom:
    - extract:
        key: kopiur
    - extract:
        key: kopiur-offsite
