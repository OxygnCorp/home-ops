---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: offsite
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-offsite-secret
          namespace: kopiur-system
      bucket: kopiur-backup
      endpoint: https://d1403fac4607ccda8f0f9d8153b6c03f.eu.r2.cloudflarestorage.com
      prefix: kopiur/
      region: auto
  concurrency:
    maxConcurrentJobs: 4
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-offsite-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  # Never silently re-initialise an empty repository (e.g. after a bucket is
  # purged): a missing repo must fail loudly instead of quietly starting over
  # and leaving the offsite copy empty. An armed `seed` still bootstraps.
  create:
    enabled: false
  catalog:
    fallbackNamespace: kopiur-system
    periodicRefresh: true
    refreshInterval: 1h
  server:
    namespace: kopiur-system
    auth:
      generate:
        username: admin
    readOnly: false
    service:
      type: ClusterIP
      port: 51515
    podSecurityContext:
      runAsUser: 1024
      runAsGroup: 100
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
  identityDefaults:
    hostnameExpr: "namespace"
    usernameExpr: "namespace + '-' + policyName"
  scheduleDefaults:
    timezone: Europe/Paris
  parameters:
    epoch:
      minDuration: 6h # S3: fewer, larger index blobs than the 2h used for the NFS repository
  maintenance:
    enabled: true
    namespace: kopiur-system
    schedule:
      full:
        cron: "0 3 * * *"
        jitter: 1h
      quick:
        cron: "0 */6 * * *"
        jitter: 30m
      timezone: Europe/Paris
  moverDefaults:
    tolerations:
      - key: workload
        operator: Equal
        value: ai
        effect: NoSchedule
    cache:
      storageClassName: miroir-slow-local
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
    securityContext:
      runAsUser: 1024
      runAsGroup: 100
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
  # One-shot bootstrap: copies the deduplicated/encrypted repository from the
  # NFS `nas` repository. Harmless once the destination is initialised (a seed
  # against an existing repository is a no-op), so it can stay in Git.
  seed:
    from:
      backend:
        filesystem:
          path: /mnt/repository
          volume:
            nfs:
              server: funkstation.internal
              path: /volume1/Volsync
