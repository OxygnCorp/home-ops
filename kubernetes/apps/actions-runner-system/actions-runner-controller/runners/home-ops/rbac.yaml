---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-ops-runner
  # Intentionally NOT bound to cluster-admin (removed: vestige of the deleted
  # schemas.yaml workflow). The SA token is not even mounted from the pods
  # (helmrelease.yaml automount: false → token never mounted in runner pods). The only elevated
  # identity pods need is the talos ServiceAccount below (talosctl image pull).
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: home-ops-runner
spec:
  roles: ["os:admin"]
