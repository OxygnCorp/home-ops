---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stirling-pdf
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
    - name: kopiur
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/self-hosted/stirling-pdf/app
  postBuild:
    substitute:
      APP: stirling-pdf
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "1000" # mover uid must match stirling-pdf's data owner (ubuntu=1000): credential-encryption.key is 0640 1000:100 and is unreadable by the default mover uid 1024
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: self-hosted
  wait: false
