---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: repo-wiki
  namespace: self-hosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: repo-wiki
  dependsOn:
    - name: litellm
      namespace: ai
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/self-hosted/repo-wiki/app
  postBuild:
    substitute:
      APP: repo-wiki
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: self-hosted
  timeout: 5m
  wait: false
