---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-wiki
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: repo-wiki
    template:
      data:
        OPENAI_API_KEY: "{{ .credential }}"
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
  data:
    # Pushed back to 1Password by litellm/app/virtualkeys/repo-wiki.yaml
    - secretKey: credential
      remoteRef:
        key: litellm
        property: KEY_REPO_WIKI
    # 1Password item `repo-wiki`, field GITHUB_TOKEN (PAT, contents:read on OxygnCorp/home-ops)
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: repo-wiki
        property: GITHUB_TOKEN
