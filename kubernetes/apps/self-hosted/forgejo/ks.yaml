---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo
  labels:
    components.postgres/cnpg: init
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: kopiur
      namespace: kopiur-system
    - name: miroir-config
      namespace: miroir-system
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/self-hosted/forgejo/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 30Gi
      KOPIUR_PUID: "1000" # mover uid must match forgejo (git=1000): app data dirs are 0700 git:git, unreadable by the default 1024
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: self-hosted
  timeout: 5m
  wait: false
