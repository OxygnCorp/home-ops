---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: konflate
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      repo: github://OxygnCorp/home-ops
      appClientId: Iv23lizpdaSYJBX0uzo8
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.oxygn.dev
      mcp: true
      verifyImages: true
    secret:
      existingSecret: konflate
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          # Unauthenticated GET / is redirected to Kanidm (302) by the
          # konflate-oidc SecurityPolicy (public paths /mcp and /hooks live in
          # httproute-public.yaml) — probing the redirect proves gateway + IdP
          # alive end-to-end.
          # Gatus follows redirects by default, chasing the 302 to Kanidm's
          # 200 login page and failing [STATUS] == 302 (same trap as
          # opencode, fixed in 59df7c44f) → ignore redirects, judge the
          # 302 directly.
          client:
            ignore-redirect: true
          conditions: ["[STATUS] == 302"]
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: https
      hostnames:
        - konflate.oxygn.dev
    persistence:
      enabled: true
      size: 5Gi
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
