---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: konflate
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: konflate
  components:
    - ../../../../components/oidc-kanidm/envoy
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: kanidm
      namespace: security
  healthCheckExprs:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/flux-system/konflate/app
  postBuild:
    substitute:
      APP: konflate
      APP_NAMESPACE: flux-system
      DOMAIN: oxygn.dev
      OIDC_CALLBACK: /oauth2/callback
      OIDC_DISPLAY_NAME: Konflate
      OIDC_ROUTE_NAME: konflate
      SUBDOMAIN: konflate
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  wait: false
