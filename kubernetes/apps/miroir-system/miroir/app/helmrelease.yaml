---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chartRef:
    kind: OCIRepository
    name: miroir
  interval: 1h
  install:
    timeout: 15m
  upgrade:
    timeout: 15m
  values:
    # keep well above the longest planned reboot/upgrade window (rolling Talos upgrades span hours incl. resyncs)
    autoEvictAfter: 24h
    agent:
      # OOMKilled at the chart default 128Mi during hourly kopiur snapshot
      # bursts (26 staging PVCs/h): p95 ~100Mi, spikes up to 125Mi observed.
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          cpu: "4"
          memory: 512Mi
    drbd:
      alExtents: 6007
      verify:
        # weekly online verify of every replicated volume (crc32c default algorithm)
        schedule: "0 4 * * 0"
    groupSnapshots:
      enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        overrides:
          # A diskless primary is an expected steady state for these cache
          # volumes (and the alert is already inhibited by InfoInhibitor in
          # Alertmanager). Disable it so it stops showing as firing.
          MiroirVolumeRemoteConsumer:
            disabled: true
    replicaCount: 2
