---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
spec:
  interval: 1h
  chart:
    spec:
      chart: radar
      # Upstream chart image (ghcr.io/skyhook-io/radar, tag defaults to the
      # chart appVersion). NOTE: Renovate does NOT bump this chart
      # automatically — the HelmRepository is a classic URL (not OCI) and
      # namespaces are kustomize-injected, so the flux manager cannot link
      # the dependency: chart bumps stay manual PRs.
      # NOTE: top-level allowedHosts is REQUIRED with the 1.19.0 chart (see
      # the allowedHosts value below — no-auth DNS-rebinding check). Keep it
      # on every chart bump: it was added in #5304, dropped in #5405, and
      # re-added in #5423.
      version: 1.20.2
      sourceRef:
        kind: HelmRepository
        name: radar
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    persistence:
      enabled: false

    timeline:
      storage: sqlite
      retention: 168h
      maxSize: 800Mi

    ingress:
      enabled: true

    allowedHosts:
      # Public hostname served through the standalone HTTPRoute — the chart
      # only auto-adds hosts it renders itself (httpRoute would conflict with
      # ingress), and the 1.18+ DNS-rebinding check enforces it in no-auth
      # mode (auth.mode: none).
      - radar.oxygn.dev

    rbac:
      podLogs: true
      podExec: true
      portForward: true
      helm: true
      secrets: true
      traffic: true
      metrics: true
      viewRBAC: true
      viewWebhooks: true
      additionalRules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["delete", "patch"]

    traffic:
      prometheusUrl: http://prometheus-operated.observability.svc.cluster.local:9090

    auth:
      mode: none

    mcp:
      enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 4Gi

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: radar
            patch: |-
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: data
                  persistentVolumeClaim:
                    claimName: radar
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: data
                  mountPath: /data
