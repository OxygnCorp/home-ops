---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
spec:
  interval: 1h
  chart:
    spec:
      chart: radar
      # Pinned to the upstream release the custom image grafts (see
      # kubernetes/apps/radar/radar values image + OxygnCorp/containers);
      # Renovate auto-bump is disabled in .renovate/overrides.json5 until a
      # new graft image is built (chart 1.19.0 passes flags unknown to the
      # 1.17.0 binary).
      # NOTE while pinned: 1.18+ chart values (top-level allowedHosts /
      # crdGroups groups) are unused by the 1.17.0 chart — the DNS-rebinding
      # allowlist (plan 2026-10-28-radar-allowed-hosts) is NOT in force;
      # both pins move together at the next graft bump.
      version: 1.17.0
      sourceRef:
        kind: HelmRepository
        name: radar
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/oxygncorp/radar
      tag: 1.17.0

    env:
      # Radar spawns the OpenCode agent CLI installed in the custom image
      # (OxygnCorp/containers). State under $HOME lands on the /data PVC and
      # OpenCode reads its minimal provider-only config from /etc/opencode
      # (see ./opencode.yaml; the config must stay MCP-free — `opencode --auto`
      # auto-approves every configured MCP server).
      - name: HOME
        value: /data
      - name: TMPDIR
        value: /data/tmp
      - name: OPENCODE_CONFIG
        value: /etc/opencode/opencode.json
      - name: LITELLM_API_KEY
        valueFrom:
          secretKeyRef:
            name: radar-litellm
            key: LITELLM_API_KEY

    extraVolumes:
      - name: scratch
        emptyDir: {}
      - name: opencode-config
        configMap:
          name: radar-opencode-config

    extraVolumeMounts:
      - name: scratch
        mountPath: /data/tmp
      - name: opencode-config
        mountPath: /etc/opencode
        readOnly: true

    persistence:
      enabled: false

    timeline:
      storage: sqlite
      retention: 168h
      maxSize: 800Mi

    ingress:
      enabled: true

    rbac:
      podLogs: true
      podExec: true
      portForward: true
      helm: true
      secrets: true
      traffic: true
      metrics: true
      viewRBAC: true
      viewWebhooks: true
      additionalRules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["delete", "patch"]

    traffic:
      prometheusUrl: http://prometheus-operated.observability.svc.cluster.local:9090

    auth:
      mode: none

    mcp:
      enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 4Gi

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: radar
            patch: |-
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: data
                  persistentVolumeClaim:
                    claimName: radar
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: data
                  mountPath: /data
              # Digest pin (values.image.tag alone is tag-floating): the chart
              # has no image.digest field, so replace the rendered
              # repo:tag with the digest reference.
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: ghcr.io/oxygncorp/radar@sha256:af4527dce030b4039fcfbde52fa8767e152a18dd001390eb2c04c665517d544a
