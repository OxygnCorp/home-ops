---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./externalsecret.yaml
  - ./grafanadatasource.yaml
  - ./grafanadashboard.yaml
patches:
  - target:
      kind: Cluster
      name: ${APP}
    patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: ${APP}
      spec:
        resources:
          requests:
            memory: 768Mi
          limits:
            memory: 1Gi
