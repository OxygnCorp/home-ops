  # Redeploy: uncomment this line, then re-enable ha_mcp in
  # kubernetes/apps/ai/litellm/app/mcp/workloads.yaml (+ its ExternalSecret in
  # mcp/externalsecrets.yaml with a fresh token, and `- ha_mcp` in
  # teams/mcp-apps.yaml).
  # - ./home-assistant/ks.yaml
  - ./teslamate/ks.yaml
  - ./mosquitto/ks.yaml
